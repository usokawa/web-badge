<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1e1e1e">
  <title>Web Badge</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
  <!-- <script src="cjpegli.js"></script> -->
  <style>
    :root {
      --color-bg: #f8f9fa;
      --color-surface: #ffffff;
      --color-text-main: #202124;
      --color-text-muted: #5f6368;
      --color-border: #dadce0;
      --color-input-bg: #ffffff;
      --color-crop-bg: #e8eaed;
      --color-mask-border: rgba(0, 0, 0, 0.2);
      --color-primary: #007bff;
      --color-danger: #dc3545;
      --state-hover: rgba(0, 0, 0, 0.05);
      --state-active: rgba(0, 0, 0, 0.1);
      --state-danger-hover: rgba(220, 53, 69, 0.1);
      --modal-bg: rgba(255, 255, 255, 0.95);
      --modal-btn: rgba(0, 0, 0, 0.05);
      --modal-btn-hover: rgba(0, 0, 0, 0.1);
      --modal-btn-active: rgba(0, 0, 0, 0.2);
      --shadow-xs: 0 2px 4px rgba(0, 0, 0, 0.15);
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
      --trans-fast: 0.1s ease;
      --trans-normal: 0.2s ease;
      --z-range-base: 4;
      --z-header: 10;
      --z-nav: 20;
      --z-modal: 100;
      --z-modal-ui: 101;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --color-bg: #121212;
        --color-surface: #1e1e1e;
        --color-text-main: #ffffff;
        --color-text-muted: #aaaaaa;
        --color-border: #333333;
        --color-input-bg: #333333;
        --color-crop-bg: #222222;
        --color-mask-border: rgba(255, 255, 255, 0.4);
        --color-primary: #4da3ff;
        --color-danger: #ff453a;
        --state-hover: rgba(255, 255, 255, 0.1);
        --state-active: rgba(255, 255, 255, 0.2);
        --state-danger-hover: rgba(255, 69, 58, 0.15);
        --modal-bg: rgba(0, 0, 0, 0.95);
        --modal-btn: rgba(255, 255, 255, 0.15);
        --modal-btn-hover: rgba(255, 255, 255, 0.25);
        --modal-btn-active: rgba(255, 255, 255, 0.35);
        --shadow-xs: 0 2px 4px rgba(0, 0, 0, 0.4);
        --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.5);
      }
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      inline-size: 100%;
      block-size: 100%;
      margin: 0;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      color: var(--color-text-main);
      font-family: system-ui, sans-serif;
      background-color: var(--color-bg);
      overflow: hidden;
      overscroll-behavior: none;
      user-select: none;
    }

    :is(.btn, select, input, .modal-overlay):focus-visible {
      outline: 2px solid var(--color-primary);
      outline-offset: 2px;
    }

    .push-right {
      margin-inline-start: auto;
    }

    .hidden-control {
      display: none !important;
    }

    .text-label {
      color: var(--color-text-muted);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    .app-layout {
      display: flex;
      flex-direction: column;
      block-size: 100dvh;
    }

    .tab-nav {
      z-index: var(--z-nav);
      display: flex;
      block-size: 48px;
      background-color: var(--color-surface);
      border-block-end: 1px solid var(--color-border);
    }

    .view-panel {
      display: none;
      flex: 1;
      flex-direction: column;
      overflow: hidden;

      &.active {
        display: flex;
      }
    }

    .header-toolbar {
      z-index: var(--z-header);
      display: flex;
      align-items: center;
      gap: 12px;
      padding-inline: 16px;
      block-size: 56px;
      background-color: var(--color-surface);
      border-block-end: 1px solid var(--color-border);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      background-color: transparent;
      border: none;
      cursor: pointer;
      transition: background-color var(--trans-normal), color var(--trans-normal), transform var(--trans-fast);

      &:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }

      &:not(:disabled, .btn-modal) {
        &:hover {
          background-color: var(--state-hover);
        }
        &:active {
          background-color: var(--state-active);
        }
      }
    }

    .btn-icon {
      inline-size: 44px;
      block-size: 44px;
      color: var(--color-text-main);
      border-radius: 50%;

      &.active-primary {
        color: var(--color-primary);
      }

      &.sm {
        inline-size: 36px;
        block-size: 36px;
      }
    }

    .btn-text {
      flex: 1;
      padding: 10px 16px;
      color: var(--color-text-main);
      font-size: 14px;
      font-weight: 500;
      background-color: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 4px;
    }

    .btn-tab {
      flex: 1;
      color: var(--color-text-muted);
      border-block-end: 2px solid transparent;

      &.active {
        color: var(--color-text-main);
        border-block-end-color: var(--color-text-main);
      }
    }

    :is(select, input[type="number"], input[type="checkbox"]) {
      padding: 6px 4px;
      color: var(--color-text-main);
      font-size: 14px;
      background-color: var(--color-input-bg);
      border: 1px solid var(--color-border);
      border-radius: 4px;
      outline: none;
    }

    input[type="number"] {
      inline-size: 54px;

      &.input-time {
        inline-size: 68px;
      }
    }

    input[type="checkbox"] {
      inline-size: 16px;
      block-size: 16px;
      margin: 0;
      cursor: pointer;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 6px;

      &.video-playback-row {
        gap: 12px;
        margin-block-end: 4px;
      }

      &.video-params-row {
        justify-content: space-between;
      }
    }

    .badge-controls {
      display: flex;
      flex-direction: column;
      padding: 16px;
      block-size: 100%;
      background-color: var(--color-surface);
      overflow: hidden;
    }

    #info-badge-header {
      display: none;
      font-size: 14px;
    }

    #text-mac-address {
      color: var(--color-text-muted);
      font-size: 12px;
      font-weight: normal;
    }

    .command-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-inline-size: 300px;
    }

    .command-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .select-command {
      padding: 8px;
      inline-size: 100px;
    }

    .crop-container {
      position: relative;
      display: flex;
      flex: 1;
      background-color: var(--color-crop-bg);
      overflow: hidden;
      touch-action: none;
    }

    :is(#img-source, #video-source, .crop-mask) {
      position: absolute;
      inset-block-start: 50%;
      inset-inline-start: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
    }

    :is(#img-source, #video-source) {
      opacity: 0;
      backface-visibility: hidden;
      will-change: transform;
      transition: opacity var(--trans-normal);

      &.loaded {
        opacity: 1;
      }
    }

    .crop-mask {
      border: 1px dashed var(--color-mask-border);
      border-radius: 50%;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
    }

    .video-controls {
      display: none;
      flex-direction: column;
      gap: 12px;
      padding: 12px 16px;
      background-color: var(--color-surface);
      border-block-end: 1px solid var(--color-border);

      &.active {
        display: flex;
      }
    }

    .range-slider-container {
      position: relative;
      display: flex;
      flex: 1;
      align-items: center;
      block-size: 24px;
    }

    :is(.range-track, .range-track-highlight) {
      position: absolute;
      block-size: 6px;
      border-radius: 3px;
    }

    .range-track {
      inline-size: 100%;
      background-color: var(--color-border);
    }

    .range-track-highlight {
      background-color: var(--color-primary);
      pointer-events: none;
    }

    .range-current-pos {
      position: absolute;
      z-index: calc(var(--z-range-base) + 1);
      inline-size: 14px;
      block-size: 14px;
      background-color: var(--color-danger);
      border: 2px solid var(--color-surface);
      border-radius: 50%;
      box-shadow: var(--shadow-xs);
      pointer-events: none;
      transform: translateX(-50%);
    }

    input[type="range"].dual-slider {
      position: absolute;
      inline-size: 100%;
      margin: 0;
      background-color: transparent;
      appearance: none;
      pointer-events: none;

      &::-webkit-slider-thumb {
        position: relative;
        z-index: var(--z-range-base);
        inline-size: 12px;
        block-size: 20px;
        background-color: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: 6px;
        box-shadow: var(--shadow-xs), inset 0 0 0 2px var(--color-primary);
        appearance: none;
        cursor: ew-resize;
        pointer-events: auto;
        transition: box-shadow var(--trans-fast), transform var(--trans-fast);
      }

      &:active::-webkit-slider-thumb {
        z-index: calc(var(--z-range-base) + 2);
        box-shadow: var(--shadow-sm), inset 0 0 0 3px var(--color-primary);
        transform: scale(1.05);
      }
    }

    .thumbnail-list {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-inline: 12px;
      block-size: 84px;
      background-color: var(--color-surface);
      border-block-start: 1px solid var(--color-border);
      overflow-inline: auto;
      scrollbar-width: none;

      &::-webkit-scrollbar {
        display: none;
      }
    }

    .thumbnail-item {
      flex-shrink: 0;
      inline-size: 60px;
      block-size: 60px;
      border-radius: 4px;
      box-shadow: var(--shadow-sm);
      object-fit: cover;
      cursor: pointer;
      transition: transform var(--trans-normal);
      -webkit-user-drag: none;

      &:hover {
        transform: scale(1.05);
      }
    }

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-inline: 16px;
      block-size: 44px;
      font-size: 14px;
      background-color: var(--color-surface);
      border-block-start: 1px solid var(--color-border);
    }

    .status-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
    }

    .status-icon {
      color: var(--color-text-muted);
      font-size: 24px;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: var(--z-modal);
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--modal-bg);
      opacity: 0;
      visibility: hidden;
      outline: none;
      touch-action: none;
      transition: opacity 0.3s, visibility 0.3s;

      &.active {
        opacity: 1;
        visibility: visible;
      }
    }

    .modal-bar {
      position: absolute;
      inset-inline: 16px;
      z-index: var(--z-modal-ui);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      pointer-events: none;

      &.top {
        inset-block-start: 16px;
      }

      &.bottom {
        inset-block-end: 16px;
      }

      .center {
        grid-column: 2;
        pointer-events: auto;
      }

      .right {
        grid-column: 3;
        justify-self: end;
        pointer-events: auto;
      }
    }

    .modal-text {
      text-align: center;
      font-variant-numeric: tabular-nums;

      &.primary {
        max-inline-size: 200px;
        color: var(--color-text-main);
        font-size: 16px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      &.secondary {
        color: var(--color-text-muted);
        font-size: 14px;
      }
    }

    .btn-modal {
      background-color: var(--modal-btn);
      backdrop-filter: blur(4px);

      &:hover:not(:disabled) {
        background-color: var(--modal-btn-hover);
      }

      &:active:not(:disabled),
      &.simulate-active {
        background-color: var(--modal-btn-active);
        transform: scale(0.9);
      }

      &.danger {
        color: var(--color-danger);

        &:hover:not(:disabled) {
          background-color: var(--state-danger-hover);
        }
      }
    }

    .modal-content {
      display: grid;
      grid-template-areas:
        ". upload ."
        "prev img next"
        ". download ."
        "prog prog prog";
      align-items: center;
      justify-items: center;
      gap: 16px;
      pointer-events: none;

      > button {
        pointer-events: auto;
      }
    }

    #btn-upload { grid-area: upload; }
    #btn-prev { grid-area: prev; }
    #btn-next { grid-area: next; }
    #btn-download { grid-area: download; }

    #img-preview {
      grid-area: img;
      max-inline-size: 90vw;
      max-block-size: 55vh;
      box-shadow: var(--shadow-sm);
      object-fit: contain;
      pointer-events: auto;
      -webkit-user-drag: none;
    }

    .progress-container {
      display: none;
      grid-area: prog;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      inline-size: 80%;
      max-inline-size: 300px;
      pointer-events: none;

      &.active {
        display: flex;
      }
    }

    progress {
      inline-size: 100%;
      block-size: 6px;
      background-color: transparent;
      border-radius: 3px;
      appearance: none;
      overflow: hidden;

      &::-webkit-progress-bar {
        background-color: var(--color-border);
      }

      &::-webkit-progress-value {
        background-color: var(--color-primary);
        transition: inline-size 0.1s linear;
      }
    }

    .progress-text {
      color: var(--color-text-main);
      font-size: 13px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>

<div class="app-layout">
  <nav class="tab-nav">
    <button id="tab-badge" class="btn btn-tab active" title="Badge Control">
      <span class="material-symbols-outlined">watch</span>
    </button>
    <button id="tab-media" class="btn btn-tab" title="Media Processing">
      <span class="material-symbols-outlined">photo_library</span>
    </button>
  </nav>

  <div id="panel-badge" class="view-panel active">
    <header class="header-toolbar">
      <button id="btn-connect-ble" class="btn btn-icon" title="Connect/Disconnect Bluetooth">
        <span id="icon-ble" class="material-symbols-outlined">bluetooth</span>
      </button>

      <div id="info-badge-header" class="status-group" title="Badge Info">
        <span id="text-badge-name" title="Badge Name"></span>
        <span id="text-mac-address" title="MAC Address"></span>
      </div>

      <button id="btn-debug" class="btn btn-icon push-right" title="Toggle Console Debug Logging">
        <span class="material-symbols-outlined">bug_report</span>
      </button>
    </header>

    <main class="badge-controls">
      <div class="command-panel">
        <div class="command-row">
            <button id="btn-set-lang" class="btn btn-text btn-badge-cmd" title="Set Badge Language" disabled>Language</button>
            <select id="sel-lang" class="select-command" title="Select Language">
              <option value="0x01">English</option>
              <option value="0x08">日本語</option>
            </select>
        </div>
        <button id="btn-call" class="btn btn-text btn-badge-cmd" title="Send Call Alert" disabled>Call</button>
        <button id="btn-check-storage" class="btn btn-text btn-badge-cmd" title="Check Free Space on Badge" disabled>Check Free Space</button>
      </div>
    </main>
  </div>

  <div id="panel-media" class="view-panel">
    <header class="header-toolbar">
      <button id="btn-open-file" class="btn btn-icon" title="Open Media File">
        <span class="material-symbols-outlined">folder_open</span>
      </button>
      <input type="file" id="input-file" accept="image/*,video/*" hidden>

      <button id="btn-process" class="btn btn-icon" title="Crop and Process Media" disabled>
        <span class="material-symbols-outlined">crop</span>
      </button>

      <div class="control-group">
        <label for="sel-resolution" class="btn btn-icon" title="Select Target Resolution">
          <span class="material-symbols-outlined">aspect_ratio</span>
        </label>
        <select id="sel-resolution" title="Select Target Resolution">
          <option value="240">240px</option>
          <option value="360">360px</option>
        </select>
      </div>

      <div class="control-group hidden-control" id="grp-filesize">
        <label for="input-filesize" class="btn btn-icon" title="Target File Size (KiB)">
          <span class="material-symbols-outlined">compress</span>
        </label>
        <input type="number" id="input-filesize" min="1" max="39" step="1" value="20" title="Target File Size (KiB)">
        <span class="text-label" title="Target File Size (KiB)">KiB</span>
      </div>

      <div class="control-group" id="grp-quality">
        <label for="input-quality" class="btn btn-icon" title="JPEG Quality">
          <span class="material-symbols-outlined">high_quality</span>
        </label>
        <input type="number" id="input-quality" min="1" max="100" step="1" value="90" title="JPEG Quality">
      </div>
    </header>

    <main id="crop-area" class="crop-container" title="Drag to Pan, Scroll/Pinch to Zoom">
      <img id="img-source" decoding="async">
      <video id="video-source" playsinline muted></video>
      <div id="crop-mask" class="crop-mask"></div>
    </main>

    <div id="video-controls" class="video-controls">
      <div class="control-group video-playback-row">
        <button id="btn-play" class="btn btn-icon sm">
          <span id="icon-play" class="material-symbols-outlined">play_arrow</span>
        </button>
        <div class="range-slider-container" id="seek-container">
          <div class="range-track"></div>
          <div class="range-track-highlight" id="seek-highlight"></div>
          <div class="range-current-pos" id="seek-current-pos"></div>
          <input type="range" id="seek-start" class="dual-slider" min="0" max="100" step="0.001" value="0">
          <input type="range" id="seek-end" class="dual-slider" min="0" max="100" step="0.001" value="100">
        </div>
      </div>
      <div class="control-group video-params-row">
        <div class="control-group">
          <span class="text-label" title="Start Time (s)">Start(s)</span>
          <input type="number" id="input-start" class="input-time" min="0" step="0.001" value="0">
        </div>
        <div class="control-group">
          <span class="text-label" title="Duration (s)">Duration(s)</span>
          <input type="number" id="input-duration" class="input-time" min="0.001" step="0.001" value="3.000">
        </div>
        <div class="control-group">
          <span class="text-label" title="Frames Per Second">FPS</span>
          <input type="number" id="input-fps" min="1" max="30" step="1" value="3">
        </div>
      </div>
    </div>
  </div>

  <footer id="thumbnail-container" class="thumbnail-list"></footer>

  <div class="status-bar">
    <div class="status-group" title="Battery Level">
      <span id="icon-battery" class="material-symbols-outlined status-icon">battery_full</span>
      <span id="text-battery">--%</span>
    </div>
    <div class="status-group" title="Screen Size">
      <span class="material-symbols-outlined status-icon">aspect_ratio</span>
      <span id="text-screen-size">--x--</span>
    </div>
    <div class="status-group" title="Free Storage Space">
      <span id="text-storage">-- KiB</span>
      <span class="material-symbols-outlined status-icon">storage</span>
    </div>
  </div>
</div>

<div id="modal-preview" class="modal-overlay" tabindex="-1">
  <div class="modal-bar top">
    <div id="modal-filename" class="modal-text primary center" title="File Name"></div>
    <button id="btn-close" class="btn btn-icon btn-modal right" title="Close Overlay">
      <span class="material-symbols-outlined">close</span>
    </button>
  </div>

  <div class="modal-content">
    <button id="btn-upload" class="btn btn-icon btn-modal" title="Upload to Badge">
      <span class="material-symbols-outlined">upload</span>
    </button>
    <button id="btn-prev" class="btn btn-icon btn-modal" title="Previous Image">
      <span class="material-symbols-outlined">chevron_left</span>
    </button>

    <img id="img-preview" title="Preview">

    <button id="btn-next" class="btn btn-icon btn-modal" title="Next Image">
      <span class="material-symbols-outlined">chevron_right</span>
    </button>
    <button id="btn-download" class="btn btn-icon btn-modal" title="Download JPEG">
      <span class="material-symbols-outlined">download</span>
    </button>

    <div id="progress-container" class="progress-container" title="Upload Progress">
      <progress id="progress-bar" max="100" value="0"></progress>
      <span id="progress-text" class="progress-text">0 / 0</span>
    </div>
  </div>

  <div class="modal-bar bottom">
    <div id="modal-filesize" class="modal-text secondary center" title="File Size"></div>
    <button id="btn-delete" class="btn btn-icon btn-modal danger right" title="Delete Image">
      <span class="material-symbols-outlined">delete</span>
    </button>
  </div>
</div>

<script type="module">
  const BLE_UUIDS = {
    SERVICE: '7e400001-b5a3-f393-e0a9-e50e24dcca9d',
    WRITE: '7e400002-b5a3-f393-e0a9-e50e24dcca9d',
    NOTIFY: '7e400003-b5a3-f393-e0a9-e50e24dcca9d'
  };

  const BLE_FRAME = {
    CMD: 0xCD,
    ACK: 0xDC
  };

  const BLE_CMD = {
    SYSTEM: 0x12,
    DEVICE: 0x1A,
    FILE: 0x1F,
    CTRL: 0x20
  };

  const $ = (id) => document.getElementById(id);
  const pad = (num) => String(num).padStart(2, '0');

  const elements = {
    tabBadge: $('tab-badge'),
    tabMedia: $('tab-media'),
    panelBadge: $('panel-badge'),
    btnConnectBle: $('btn-connect-ble'),
    iconBle: $('icon-ble'),
    infoBadgeHeader: $('info-badge-header'),
    textBadgeName: $('text-badge-name'),
    textMacAddress: $('text-mac-address'),
    btnDebug: $('btn-debug'),
    btnSetLang: $('btn-set-lang'),
    selLang: $('sel-lang'),
    btnCall: $('btn-call'),
    btnCheckStorage: $('btn-check-storage'),
    panelMedia: $('panel-media'),
    btnOpenFile: $('btn-open-file'),
    inputFile: $('input-file'),
    btnProcess: $('btn-process'),
    selResolution: $('sel-resolution'),
    inputFilesize: $('input-filesize'),
    grpFilesize: $('grp-filesize'),
    inputQuality: $('input-quality'),
    grpQuality: $('grp-quality'),
    cropArea: $('crop-area'),
    imgSource: $('img-source'),
    videoSource: $('video-source'),
    cropMask: $('crop-mask'),
    videoControls: $('video-controls'),
    btnPlay: $('btn-play'),
    iconPlay: $('icon-play'),
    seekStart: $('seek-start'),
    seekEnd: $('seek-end'),
    seekHighlight: $('seek-highlight'),
    seekCurrentPos: $('seek-current-pos'),
    inputStart: $('input-start'),
    inputDuration: $('input-duration'),
    inputFps: $('input-fps'),
    thumbnailContainer: $('thumbnail-container'),
    iconBattery: $('icon-battery'),
    textBattery: $('text-battery'),
    textScreenSize: $('text-screen-size'),
    textStorage: $('text-storage'),
    modalPreview: $('modal-preview'),
    modalFilename: $('modal-filename'),
    btnClose: $('btn-close'),
    btnUpload: $('btn-upload'),
    btnPrev: $('btn-prev'),
    imgPreview: $('img-preview'),
    btnNext: $('btn-next'),
    btnDownload: $('btn-download'),
    progressContainer: $('progress-container'),
    progressBar: $('progress-bar'),
    progressText: $('progress-text'),
    modalFilesize: $('modal-filesize'),
    btnDelete: $('btn-delete')
  };

  const state = {
    isDebug: false,
    isVideo: false,
    scale: 1,
    x: 0,
    y: 0,
    initialScale: 1,
    initialX: 0,
    initialY: 0,
    pointers: new Map(),
    isPanning: false,
    startX: 0,
    startY: 0,
    pinchDist: 0,
    croppedImages: [],
    previewIndex: -1,
    badgeWidth: 0,
    badgeHeight: 0,
    maxBlockSize: 0
  };

  let bluetoothBadge = null;
  let charWrite = null;
  let charNotify = null;
  const pendingRequests = {};
  let pendingChunkReq = null;
  let cjpegliPromise = null;
  let rafId = null;
  let modalTouchX = 0;
  let modalTouchY = 0;

  const logDebug = (msg) => {
    if (!state.isDebug) return;
    console.log(`[${new Date().toISOString()}] ${msg}`);
  };

  const toHex = (buf) => {
    const hex = Array.from(buf).map(b => b.toString(16).padStart(2, '0').toUpperCase()).join(' ');
    return hex.length > 96 ? hex.substring(0, 96) + '...' : hex;
  };

  const calcChecksum8 = (buf) => buf.reduce((sum, byte) => (sum + byte) >>> 0, 0);

  const calcChecksum32 = (val) => ((val >>> 24) & 0xFF) + ((val >>> 16) & 0xFF) + ((val >>> 8) & 0xFF) + (val & 0xFF);

  const simulateClick = (id) => {
    const btn = $(id);
    if (!btn || btn.style.visibility === 'hidden') return;

    btn.classList.add('simulate-active');
    setTimeout(() => btn.classList.remove('simulate-active'), 150);
    btn.click();
  };

  const switchTab = (isBadge) => {
    elements.tabBadge.classList.toggle('active', isBadge);
    elements.tabMedia.classList.toggle('active', !isBadge);
    elements.panelBadge.classList.toggle('active', isBadge);
    elements.panelMedia.classList.toggle('active', !isBadge);
  };

  const updateModal = () => {
    if (state.previewIndex < 0 || state.previewIndex >= state.croppedImages.length) return;

    const item = state.croppedImages[state.previewIndex];
    elements.imgPreview.src = item.url;
    elements.modalFilename.textContent = item.filename;
    elements.modalFilesize.textContent = `${item.sizeKiB} KiB`;
    elements.btnPrev.style.visibility = state.previewIndex > 0 ? 'visible' : 'hidden';
    elements.btnNext.style.visibility = state.previewIndex < state.croppedImages.length - 1 ? 'visible' : 'hidden';
  };

  const openModal = (index) => {
    state.previewIndex = index;
    updateModal();
    elements.modalPreview.classList.add('active');
    elements.modalPreview.focus();
  };

  const setBadgeControlState = (enabled) => {
    document.querySelectorAll('.btn-badge-cmd').forEach(btn => btn.disabled = !enabled);
    elements.btnConnectBle.classList.toggle('active-primary', enabled);
    elements.iconBle.textContent = enabled ? 'bluetooth_connected' : 'bluetooth';
    elements.infoBadgeHeader.style.display = enabled ? 'flex' : 'none';
  };

  const waitForPacket = (prefix, cls, sub, timeoutMs) => new Promise((resolve, reject) => {
    const key = `${prefix}_${cls}_${sub}`;
    const timer = setTimeout(() => {
      delete pendingRequests[key];
      reject(new Error(`${prefix.toUpperCase()} Timeout (${cls.toString(16)} ${sub?.toString(16)})`));
    }, timeoutMs);

    pendingRequests[key] = {
      resolve: (data) => {
        clearTimeout(timer);
        delete pendingRequests[key];
        resolve(data);
      },
      reject: (err) => {
        clearTimeout(timer);
        delete pendingRequests[key];
        reject(err);
      },
      clear: () => {
        clearTimeout(timer);
        delete pendingRequests[key];
      }
    };
  });

  const waitForAck = (cls, sub) => waitForPacket('ack', cls, sub, 3000);
  const waitForData = (cls, sub) => waitForPacket('data', cls, sub, 5000);

  const waitForChunkCtrl = (expectedCode, timeoutMs = 10000) => new Promise((resolve, reject) => {
    const timer = setTimeout(() => {
      pendingChunkReq = null;
      reject(new Error(`Chunk Timeout (Expected: ${expectedCode})`));
    }, timeoutMs);

    pendingChunkReq = {
      expectedCode,
      resolve: () => {
        clearTimeout(timer);
        pendingChunkReq = null;
        resolve();
      },
      reject: (err) => {
        clearTimeout(timer);
        pendingChunkReq = null;
        reject(err);
      }
    };
  });

  const buildFrame = (cls, sub, payload = []) => {
    if (sub === null) {
      return new Uint8Array([BLE_FRAME.CMD, 0x00, 0x02, cls, 0x01]);
    }

    const len = 5 + payload.length;
    const buf = new Uint8Array(len + 3);

    buf[0] = BLE_FRAME.CMD;
    buf[1] = (len >>> 8) & 0xFF;
    buf[2] = len & 0xFF;
    buf[3] = cls;
    buf[4] = 0x01;
    buf[5] = sub;
    buf[6] = (payload.length >>> 8) & 0xFF;
    buf[7] = payload.length & 0xFF;
    buf.set(payload, 8);

    return buf;
  };

  const writePacket = async (buf) => {
    if (!charWrite) throw new Error("Bluetooth not connected");
    logDebug(`[TX] ${toHex(buf)}`);
    for (let i = 0; i < buf.length; i += 487) {
      await charWrite.writeValueWithoutResponse(buf.slice(i, i + 487));
    }
  };

  const sendAck = async (cls, sub, len) => {
    const frame = new Uint8Array([BLE_FRAME.ACK, 0x00, 0x05, cls, sub, (len >>> 8) & 0xFF, len & 0xFF, 0x01]);
    await writePacket(frame);
  };

  const sendCmd = async (cls, sub, payload = []) => {
    const p = waitForAck(cls, sub);
    await writePacket(buildFrame(cls, sub, payload));
    await p;
  };

  const reqData = async (cls, sub, payload = []) => {
    const pData = waitForData(cls, sub);
    await writePacket(buildFrame(cls, sub, payload));

    if (cls === BLE_CMD.CTRL) {
      return await pData;
    }

    const pAck = waitForAck(cls, sub);
    await Promise.race([pAck, pData]);
    pendingRequests[`ack_${cls}_${sub}`]?.clear();

    return await pData;
  };

  const handleAckEvent = (val) => {
    if (val.length < 8) return;
    const cls = val[3];
    const sub = val[4];
    const status = val[7];
    const req = pendingRequests[`ack_${cls}_${sub}`];

    if (!req) return;

    if (status === 0x01) {
      req.resolve();
    } else {
      req.reject(new Error(`ACK Error: ${status}`));
    }
  };

  const handleDataEvent = async (val) => {
    if (val.length < 8) return;
    const frameLen = (val[1] << 8) | val[2];
    const payloadLen = (val[6] << 8) | val[7];
    if (frameLen !== payloadLen + 5 || val.length < 8 + payloadLen) return;

    const cls = val[3];
    const sub = val[5];
    const payload = val.slice(8, 8 + payloadLen);

    await sendAck(cls, sub, frameLen + 3);
    pendingRequests[`data_${cls}_${sub}`]?.resolve(payload);

    if (cls === BLE_CMD.CTRL && sub === 0x04 && payload.length >= 8) {
      const storageBytes = (payload[4] << 24) | (payload[5] << 16) | (payload[6] << 8) | payload[7];
      elements.textStorage.textContent = `${(storageBytes / 1024).toFixed(0)} KiB`;
      return;
    }

    if (cls === BLE_CMD.CTRL && sub === 0x01 && payload.length >= 4 && pendingChunkReq) {
      const code = ((payload[0] << 24) | (payload[1] << 16) | (payload[2] << 8) | payload[3]) >>> 0;
      if (code === pendingChunkReq.expectedCode) {
        pendingChunkReq.resolve();
      } else {
        pendingChunkReq.reject(new Error(`Transfer Rejected: Code ${code}`));
      }
    }
  };

  const onBleNotification = async (e) => {
    const val = new Uint8Array(e.target.value.buffer);
    if (val.length === 0) return;
    const hex = toHex(val);
    logDebug(`[RX] ${hex}`);
    const type = val[0];
    if (type === BLE_FRAME.ACK) {
      handleAckEvent(val);
      return;
    }
    if (type === BLE_FRAME.CMD) {
      await handleDataEvent(val);
    }
  };

  const onBadgeDisconnected = () => {
    logDebug("Badge disconnected.");
    setBadgeControlState(false);
    charWrite = null;
    charNotify = null;

    state.badgeWidth = 0;
    state.badgeHeight = 0;

    elements.textBadgeName.textContent = '';
    elements.textMacAddress.textContent = '';
    elements.iconBattery.textContent = 'battery_full';
    elements.textBattery.textContent = '--%';
    elements.textScreenSize.textContent = '--x--';
    elements.textStorage.textContent = '-- KiB';

    for (const k in pendingRequests) {
      pendingRequests[k]?.reject(new Error("Badge disconnected"));
    }

    if (pendingChunkReq) {
      pendingChunkReq.reject(new Error("Badge disconnected"));
      pendingChunkReq = null;
    }
  };

  const setupSecondaryNotifications = async (service) => {
    try {
      const secChar = await service.getCharacteristic('7e400004-b5a3-f393-e0a9-e50e24dcca9d');
      await secChar.startNotifications();
    } catch (e) {
      logDebug("Secondary notifications unavailable.");
    }
  };

  const setupBatteryService = async (server) => {
    try {
      const batSvc = await server.getPrimaryService('battery_service');
      const batChar = await batSvc.getCharacteristic('battery_level');

      const updateBat = (val) => {
        elements.textBattery.textContent = `${val}%`;
        const step = Math.min(6, Math.floor(val / 15));
        elements.iconBattery.textContent = val >= 95 ? 'battery_full' : `battery_${step}_bar`;
      };

      const initialVal = await batChar.readValue();
      updateBat(initialVal.getUint8(0));

      await batChar.startNotifications();
      batChar.addEventListener('characteristicvaluechanged', e => updateBat(e.target.value.getUint8(0)));
    } catch (e) {
      logDebug("Battery Service unavailable.");
    }
  };

  const execInitSequence = async () => {
    try {
      const d = new Date();
      const packed = ((Math.max(0, d.getFullYear() - 2000) & 0x3F) << 26)
                   | (((d.getMonth() + 1) & 0x0F) << 22)
                   | ((d.getDate() & 0x1F) << 17)
                   | ((d.getHours() & 0x1F) << 12)
                   | ((d.getMinutes() & 0x3F) << 6)
                   | (d.getSeconds() & 0x3F);

      await sendCmd(BLE_CMD.SYSTEM, 0x01, new Uint8Array([
        (packed >>> 24) & 0xFF,
        (packed >>> 16) & 0xFF,
        (packed >>> 8) & 0xFF,
        packed & 0xFF
      ]));

      const mac = await reqData(BLE_CMD.DEVICE, 0x0A);
      if (mac.length >= 6) {
        elements.textMacAddress.textContent = `(${Array.from(mac).map(b => b.toString(16).padStart(2,'0').toUpperCase()).join(':')})`;
      }

      const name = await reqData(BLE_CMD.DEVICE, 0x0C);
      if (name.length >= 1) {
        elements.textBadgeName.textContent = new TextDecoder().decode(name.slice(1));
      }

      const ctrlDevInfo = await reqData(BLE_CMD.CTRL, 0x02);
      if (ctrlDevInfo.length >= 32 && ctrlDevInfo[0] === 0x01) {
        state.badgeWidth = (ctrlDevInfo[2] << 8) | ctrlDevInfo[3];
        state.badgeHeight = (ctrlDevInfo[4] << 8) | ctrlDevInfo[5];
        elements.textScreenSize.textContent = `${state.badgeWidth}x${state.badgeHeight}`;
        state.maxBlockSize = (ctrlDevInfo[30] << 8) | ctrlDevInfo[31];
        const p1_len = ctrlDevInfo[6] || 0;
        const p1 = p1_len ? new TextDecoder().decode(ctrlDevInfo.slice(7, 7 + p1_len)) : "";
        const p2_start = 7 + p1_len;
        const p2_len = ctrlDevInfo[p2_start] || 0;
        const p2 = p2_len ? new TextDecoder().decode(ctrlDevInfo.slice(p2_start + 1, p2_start + 1 + p2_len)) : "";
        const p3_start = p2_start + 1 + p2_len + 5;
        const p3_len = ctrlDevInfo[p3_start] || 0;
        const p3 = p3_len ? new TextDecoder().decode(ctrlDevInfo.slice(p3_start + 1, p3_start + 1 + p3_len)) : "";
        logDebug(`[Device Info] Screen: ${state.badgeWidth}x${state.badgeHeight}, MaxBlockSize: ${state.maxBlockSize}, Cap: ${p1}, ${p2}, ${p3}`);
      }

      await reqData(BLE_CMD.CTRL, 0x04);

      logDebug("Initialization sequence completed.");
    } catch (e) {
      logDebug(`Init Error: ${e.message}`);
    }
  };

  const connectAndInitBadge = async () => {
    logDebug("Requesting BLE badge...");
    bluetoothBadge = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: [BLE_UUIDS.SERVICE, 'battery_service']
    });

    bluetoothBadge.addEventListener('gattserverdisconnected', onBadgeDisconnected);

    const server = await bluetoothBadge.gatt.connect();
    const service = await server.getPrimaryService(BLE_UUIDS.SERVICE);

    charWrite = await service.getCharacteristic(BLE_UUIDS.WRITE);
    charNotify = await service.getCharacteristic(BLE_UUIDS.NOTIFY);

    await charNotify.startNotifications();
    charNotify.addEventListener('characteristicvaluechanged', onBleNotification);

    setBadgeControlState(true);
    logDebug("Connected. Starting initialization...");

    await setupSecondaryNotifications(service);
    await setupBatteryService(server);
    await execInitSequence();
  };

  const createChunks = (buf, size) => {
    const blocks = [];
    let offset = 0;
    let bid = 1;

    while (offset < size) {
      const len = Math.min(size - offset, bid === 1 ? state.maxBlockSize - 4 : state.maxBlockSize);
      blocks.push(buf.slice(offset, offset + len));
      offset += len;
      bid++;
    }

    return blocks;
  };

  const initiateFileTransfer = async (size) => {
    const sid = Math.floor(Math.random() * 0xFFFFFFFF);
    const dSize = size + 4;
    const initPayload = new Uint8Array([
      (sid >>> 24) & 0xFF, (sid >>> 16) & 0xFF, (sid >>> 8) & 0xFF, sid & 0xFF,
      0x02, 0x08, 0, 0, 0,
      (dSize >>> 24) & 0xFF, (dSize >>> 16) & 0xFF, (dSize >>> 8) & 0xFF, dSize & 0xFF,
      0, 0, 0, 0
    ]);

    await writePacket(buildFrame(BLE_CMD.FILE, 0x02, initPayload));
    await waitForChunkCtrl(1000);
  };

  const sendFileChunk = async (chunkIndex, blockData, totalSize, cs32, currentSum) => {
    const isFirst = chunkIndex === 1;
    const hEnd = isFirst ? 14 : 10;
    const fLen = 5 + (hEnd - 8) + blockData.length + 4;
    const frame = new Uint8Array(fLen + 3);

    frame.set([
      BLE_FRAME.CMD,
      (fLen >>> 8) & 0xFF,
      fLen & 0xFF,
      BLE_CMD.FILE,
      0x01,
      0x01,
      ((fLen - 5) >>> 8) & 0xFF,
      (fLen - 5) & 0xFF,
      (chunkIndex >>> 8) & 0xFF,
      chunkIndex & 0xFF
    ]);

    if (isFirst) {
      frame.set([(totalSize >>> 24) & 0xFF, (totalSize >>> 16) & 0xFF, (totalSize >>> 8) & 0xFF, totalSize & 0xFF], 10);
    }

    frame.set(blockData, hEnd);

    const bCS = calcChecksum8(blockData);
    const newSum = (currentSum + bCS) >>> 0;
    const tVal = (isFirst ? (bCS + cs32 + 1) : (bCS + chunkIndex)) >>> 0;
    const tIdx = hEnd + blockData.length;

    frame.set([(tVal >>> 24) & 0xFF, (tVal >>> 16) & 0xFF, (tVal >>> 8) & 0xFF, tVal & 0xFF], tIdx);

    await writePacket(frame);
    await waitForChunkCtrl(1000 + chunkIndex);

    return newSum;
  };

  const finalizeFileTransfer = async (sum, cs32) => {
    const vCS = (sum + cs32) >>> 0;
    await writePacket(buildFrame(BLE_CMD.FILE, 0x03, new Uint8Array([(vCS >>> 24) & 0xFF, (vCS >>> 16) & 0xFF, (vCS >>> 8) & 0xFF, vCS & 0xFF])));
    await waitForChunkCtrl(0x0002);
  };

  const transferFileToBadge = async (blob, onProgress) => {
    const buf = new Uint8Array(await blob.arrayBuffer());
    const size = buf.length;

    if (size > 600000) {
      throw new Error("File too large");
    }

    const blocks = createChunks(buf, size);
    if (onProgress) {
      onProgress(0, blocks.length);
    }

    await initiateFileTransfer(size);

    let sum = 0;
    const cs32 = calcChecksum32(size);

    for (let k = 1; k <= blocks.length; k++) {
      sum = await sendFileChunk(k, blocks[k - 1], size, cs32, sum);
      if (onProgress) {
        onProgress(k, blocks.length);
      }
    }

    await finalizeFileTransfer(sum, cs32);
  };

  const updateQualityUI = () => {
    const hasCjpegli = !!window.createCjpegli;
    elements.grpFilesize.classList.toggle('hidden-control', !hasCjpegli);
    elements.grpQuality.classList.toggle('hidden-control', hasCjpegli);
  };

  const initCjpegli = async () => {
    if (window.createCjpegli) {
      cjpegliPromise ??= window.createCjpegli();
      try {
        return await cjpegliPromise;
      } catch (e) {
        console.error(e);
        throw e;
      }
    }
    return null;
  };

  const renderSourceMedia = () => {
    if (rafId) return;

    rafId = requestAnimationFrame(() => {
      const el = state.isVideo ? elements.videoSource : elements.imgSource;
      el.style.transform = `translate(-50%, -50%) translate3d(${state.x}px, ${state.y}px, 0) scale(${state.scale})`;
      rafId = null;
    });
  };

  const renderThumbs = () => {
    elements.thumbnailContainer.innerHTML = '';

    state.croppedImages.forEach((img, i) => {
      const el = document.createElement('img');
      el.src = img.url;
      el.className = 'thumbnail-item';
      el.draggable = false;
      el.title = 'Preview';
      el.addEventListener('click', () => openModal(i));
      elements.thumbnailContainer.appendChild(el);
    });

    elements.thumbnailContainer.scrollLeft = elements.thumbnailContainer.scrollWidth;
  };

  const drawToCanvas = async (source, res) => {
    const bmp = await createImageBitmap(source);

    try {
      const cvs = new OffscreenCanvas(res, res);
      const ctx = cvs.getContext('2d', { willReadFrequently: true });
      ctx.imageSmoothingQuality = 'high';
      ctx.fillStyle = 'black';
      ctx.fillRect(0, 0, res, res);

      ctx.beginPath();
      ctx.arc(res / 2, res / 2, (res + 16) / 2, 0, Math.PI * 2);
      ctx.clip();

      const dSize = res + 16;
      const sArea = dSize / state.scale;
      const sx = (bmp.width / 2) - (state.x / state.scale) - sArea / 2;
      const sy = (bmp.height / 2) - (state.y / state.scale) - sArea / 2;

      ctx.drawImage(bmp, sx, sy, sArea, sArea, -8, -8, dSize, dSize);
      return { cvs, ctx };
    } finally {
      bmp.close();
    }
  };

  const convertToJpegBlob = async (mod, pam, tSize) => {
    mod.FS.writeFile('in.pam', pam);
    let jpg = null;

    try {
      mod.callMain(['in.pam', 'out.jpg', '-p', '0', '--target_size', tSize, '--std_quant']);
      jpg = mod.FS.readFile('out.jpg');
    } catch(e) {
      console.error(e);
    } finally {
      try {
        mod.FS.unlink('in.pam');
        mod.FS.unlink('out.jpg');
      } catch(e) {}
    }

    return jpg ? new Blob([jpg], { type: 'image/jpeg' }) : null;
  };

  const generatePamImageAsync = async (source, res) => {
    const { ctx } = await drawToCanvas(source, res);
    const imgData = ctx.getImageData(0, 0, res, res);
    const hdr = new TextEncoder().encode(`P7\nWIDTH ${res}\nHEIGHT ${res}\nDEPTH 3\nMAXVAL 255\nTUPLTYPE RGB\nENDHDR\n`);
    const pam = new Uint8Array(hdr.length + res * res * 3);

    pam.set(hdr);
    let p = hdr.length;

    for (let i = 0; i < imgData.data.length; i += 4) {
      pam[p++] = imgData.data[i];
      pam[p++] = imgData.data[i+1];
      pam[p++] = imgData.data[i+2];
    }

    return pam;
  };

  const generateNativeJpegBlob = async (source, res, quality) => {
    const { cvs } = await drawToCanvas(source, res);
    return await cvs.convertToBlob({ type: 'image/jpeg', quality });
  };

  const processFrameCjpegli = async (mod, source, res, targetSizeKb) => {
    const tSize = Math.round(Math.max(1, targetSizeKb) * 1024).toString();
    const pam = await generatePamImageAsync(source, res);
    return await convertToJpegBlob(mod, pam, tSize);
  };

  const addCroppedImage = (blob, res) => {
    const d = new Date();
    const ms = String(d.getMilliseconds()).padStart(3, '0');
    const ts = `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}_${ms}`;

    state.croppedImages.push({
      url: URL.createObjectURL(blob),
      blob,
      filename: `badge_${ts}.jpg`,
      sizeKiB: (blob.size/1024).toFixed(1),
      res
    });

    renderThumbs();
  };

  const updateRangeUI = () => {
    if (!state.isVideo || !elements.videoSource.duration) return;

    const dur = elements.videoSource.duration;
    let st = parseFloat(elements.seekStart.value);
    let ed = parseFloat(elements.seekEnd.value);

    if (st > ed) {
      if (document.activeElement === elements.seekStart) {
        elements.seekEnd.value = st;
        ed = st;
      } else {
        elements.seekStart.value = ed;
        st = ed;
      }
    }

    const startPct = (st / dur) * 100;
    const endPct = (ed / dur) * 100;

    elements.seekHighlight.style.insetInlineStart = `${startPct}%`;
    elements.seekHighlight.style.inlineSize = `${endPct - startPct}%`;
    elements.inputStart.value = st.toFixed(3);
    elements.inputDuration.value = (ed - st).toFixed(3);
  };

  const handlePointerDown = (e) => {
    if (elements.btnProcess.disabled) return;

    e.preventDefault();
    document.activeElement?.blur();
    elements.cropArea.setPointerCapture(e.pointerId);
    state.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (state.pointers.size === 1) {
      state.isPanning = true;
      state.startX = e.clientX;
      state.startY = e.clientY;
      state.initialX = state.x;
      state.initialY = state.y;
    } else if (state.pointers.size === 2) {
      state.isPanning = false;
      const pts = Array.from(state.pointers.values());
      state.pinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      state.initialScale = state.scale;
    }
  };

  const handlePointerMove = (e) => {
    if (!state.pointers.has(e.pointerId)) return;

    state.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const pts = Array.from(state.pointers.values());

    if (pts.length === 1 && state.isPanning) {
      state.x = state.initialX + (e.clientX - state.startX);
      state.y = state.initialY + (e.clientY - state.startY);
      renderSourceMedia();
    } else if (pts.length === 2 && state.pinchDist > 0) {
      const r = (state.initialScale * (Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y) / state.pinchDist)) / state.scale;
      state.scale *= r;
      state.x *= r;
      state.y *= r;
      renderSourceMedia();
    }
  };

  const handlePointerUp = (e) => {
    state.pointers.delete(e.pointerId);

    if (state.pointers.size === 1) {
      const pt = Array.from(state.pointers.values())[0];
      state.startX = pt.x;
      state.startY = pt.y;
      state.initialX = state.x;
      state.initialY = state.y;
      state.isPanning = true;
    } else {
      state.isPanning = false;
    }
  };

  const handleKeydown = (e) => {
    if (elements.modalPreview.classList.contains('active')) {
      const acts = {
        Escape: 'btn-close',
        Esc: 'btn-close',
        Delete: 'btn-delete',
        Backspace: 'btn-delete',
        ArrowLeft: 'btn-prev',
        ArrowRight: 'btn-next',
        ArrowUp: 'btn-upload',
        ArrowDown: 'btn-download'
      };

      if (acts[e.key]) {
        simulateClick(acts[e.key]);
        e.preventDefault();
      }
      return;
    }

    if (elements.btnProcess.disabled || ['INPUT', 'SELECT'].includes(document.activeElement.tagName)) return;

    const acts = {
      ArrowUp: () => {
        state.y -= 20;
      },
      ArrowDown: () => {
        state.y += 20;
      },
      ArrowLeft: () => {
        state.x -= 20;
      },
      ArrowRight: () => {
        state.x += 20;
      },
      PageUp: () => {
        state.scale *= 1.1;
        state.x *= 1.1;
        state.y *= 1.1;
      },
      PageDown: () => {
        state.scale /= 1.1;
        state.x /= 1.1;
        state.y /= 1.1;
      }
    };

    if (acts[e.key]) {
      acts[e.key]();
      e.preventDefault();
      renderSourceMedia();
    }
  };

  const initApp = () => {
    document.addEventListener('keydown', handleKeydown);
    elements.tabBadge.addEventListener('click', () => switchTab(true));
    elements.tabMedia.addEventListener('click', () => switchTab(false));

    elements.btnConnectBle.addEventListener('click', async () => {
      if (bluetoothBadge?.gatt.connected) {
        bluetoothBadge.gatt.disconnect();
        return;
      }
      try {
        await connectAndInitBadge();
      } catch (e) {
        logDebug(`Connection Error: ${e.message}`);
      }
    });

    elements.btnDebug.addEventListener('click', () => {
      state.isDebug = !state.isDebug;
      elements.btnDebug.classList.toggle('active-primary', state.isDebug);
    });

    if (elements.btnSetLang) {
      elements.btnSetLang.addEventListener('click', async () => {
        try {
          await sendCmd(BLE_CMD.SYSTEM, 0x15, [parseInt(elements.selLang.value)]);
          logDebug("Language applied.");
        } catch(e) {}
      });
    }

    if (elements.btnCall) {
      elements.btnCall.addEventListener('click', async () => {
        try {
          await sendCmd(BLE_CMD.SYSTEM, 0x0B, [0x01]);
          logDebug("Call alert sent.");
        } catch(e) {}
      });
    }

    if (elements.btnCheckStorage) {
      elements.btnCheckStorage.addEventListener('click', async () => {
        try {
          await reqData(BLE_CMD.CTRL, 0x04);
          logDebug("Storage requested.");
        } catch(e) {}
      });
    }

    elements.btnOpenFile.addEventListener('click', () => elements.inputFile.click());

    elements.inputFile.addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;

      if (file.type.includes('svg')) {
        alert("SVG files are not supported.");
        e.target.value = '';
        return;
      }

      elements.btnProcess.disabled = true;
      elements.imgSource.classList.remove('loaded');
      elements.videoSource.classList.remove('loaded');

      if (elements.imgSource.src.startsWith('blob:')) {
        URL.revokeObjectURL(elements.imgSource.src);
        elements.imgSource.removeAttribute('src');
      }
      if (elements.videoSource.src.startsWith('blob:')) {
        URL.revokeObjectURL(elements.videoSource.src);
        elements.videoSource.removeAttribute('src');
      }

      state.isVideo = file.type.startsWith('video/');
      state.scale = 1;
      state.x = 0;
      state.y = 0;
      state.initialScale = 1;
      state.initialX = 0;
      state.initialY = 0;
      state.pointers.clear();
      state.isPanning = false;
      state.startX = 0;
      state.startY = 0;
      state.pinchDist = 0;

      const url = URL.createObjectURL(file);

      elements.imgSource.style.display = state.isVideo ? 'none' : 'block';
      elements.videoSource.style.display = state.isVideo ? 'block' : 'none';
      elements.videoControls.classList.toggle('active', state.isVideo);

      if (state.isVideo) {
        elements.videoSource.src = url;
        elements.videoSource.onloadedmetadata = async () => {
          const res = parseInt(elements.selResolution.value, 10);
          state.scale = Math.min(1, res / Math.min(elements.videoSource.videoWidth, elements.videoSource.videoHeight));
          state.x = 0;
          state.y = 0;

          const dur = elements.videoSource.duration;

          elements.videoSource.currentTime = 0;
          elements.iconPlay.textContent = 'play_arrow';
          elements.seekStart.max = dur;
          elements.seekStart.value = 0;
          elements.seekEnd.max = dur;
          elements.seekEnd.value = dur;
          elements.seekCurrentPos.style.insetInlineStart = '0%';
          elements.inputStart.value = "0.000";
          elements.inputDuration.value = dur.toFixed(3);

          updateRangeUI();
          renderSourceMedia();

          elements.videoSource.classList.add('loaded');
          await initCjpegli();
          elements.btnProcess.disabled = false;
        };
      } else {
        elements.imgSource.src = url;
        elements.imgSource.onload = async () => {
          const res = parseInt(elements.selResolution.value, 10);
          const nw = elements.imgSource.naturalWidth || res;
          const nh = elements.imgSource.naturalHeight || res;
          state.scale = Math.min(1, res / Math.min(nw, nh));
          state.x = 0;
          state.y = 0;

          renderSourceMedia();
          elements.imgSource.classList.add('loaded');

          await initCjpegli();
          elements.btnProcess.disabled = false;
        };
      }
      e.target.value = '';
    });

    elements.btnProcess.addEventListener('click', async () => {
      if (elements.btnProcess.disabled) return;

      elements.btnProcess.disabled = true;

      try {
        const mod = window.createCjpegli ? await initCjpegli() : null;
        const targetSize = parseFloat(elements.inputFilesize.value) || 20;
        const res = parseInt(elements.selResolution.value, 10);
        const qualityVal = parseInt(elements.inputQuality.value, 10) || 90;
        const quality = Math.max(1, Math.min(100, qualityVal)) / 100;

        const processSingleFrame = async (source) => {
          if (mod) {
            return await processFrameCjpegli(mod, source, res, targetSize);
          } else {
            return await generateNativeJpegBlob(source, res, quality);
          }
        };

        if (state.isVideo) {
          const wasPlaying = !elements.videoSource.paused;
          const originalTime = elements.videoSource.currentTime;
          elements.videoSource.pause();

          const st = parseFloat(elements.inputStart.value) || 0;
          const dur = parseFloat(elements.inputDuration.value) || 3;
          const rawFps = parseInt(elements.inputFps.value, 10) || 3;
          const fps = Math.min(30, Math.max(1, rawFps));
          const frames = Math.floor(dur * fps);
          const step = 1 / fps;

          for (let i = 0; i <= frames; i++) {
            const t = st + i * step;
            if (t > elements.videoSource.duration || t > st + dur) break;

            if (elements.videoSource.currentTime !== t) {
              elements.videoSource.currentTime = t;
              await new Promise(resolve => {
                const timer = setTimeout(resolve, 500);
                const onSeeked = () => {
                  clearTimeout(timer);
                  resolve();
                };
                elements.videoSource.addEventListener('seeked', onSeeked, { once: true });
              });
            }

            const blob = await processSingleFrame(elements.videoSource);
            if (blob) {
              addCroppedImage(blob, res);
            }
          }

          if (elements.videoSource.currentTime !== originalTime) {
            elements.videoSource.currentTime = originalTime;
            await new Promise(resolve => {
              const timer = setTimeout(resolve, 500);
              const onSeeked = () => {
                clearTimeout(timer);
                resolve();
              };
              elements.videoSource.addEventListener('seeked', onSeeked, { once: true });
            });
          }

          if (wasPlaying) {
            elements.videoSource.play();
          }
        } else {
          const blob = await processSingleFrame(elements.imgSource);
          if (blob) {
            addCroppedImage(blob, res);
          }
        }
      } finally {
        elements.btnProcess.disabled = false;
      }
    });

    elements.selResolution.addEventListener('change', () => {
      const s = elements.selResolution.value;
      elements.cropMask.style.inlineSize = `${s}px`;
      elements.cropMask.style.blockSize = `${s}px`;
    });

    elements.cropArea.addEventListener('pointerdown', handlePointerDown);
    elements.cropArea.addEventListener('pointermove', handlePointerMove);

    ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => {
      elements.cropArea.addEventListener(ev, handlePointerUp);
    });

    elements.cropArea.addEventListener('wheel', e => {
      if (elements.btnProcess.disabled) return;

      e.preventDefault();
      const f = Math.exp(-e.deltaY * 0.005);
      state.scale *= f;
      state.x *= f;
      state.y *= f;

      renderSourceMedia();
    }, { passive: false });

    elements.thumbnailContainer.addEventListener('wheel', e => {
      e.preventDefault();
      elements.thumbnailContainer.scrollLeft += e.deltaY + e.deltaX;
    }, { passive: false });

    elements.modalPreview.addEventListener('pointerdown', e => {
      if (e.pointerType !== 'mouse') {
        modalTouchX = e.clientX;
        modalTouchY = e.clientY;
      }
    });

    elements.modalPreview.addEventListener('pointerup', e => {
      if (e.pointerType === 'mouse' || state.previewIndex < 0) return;

      const dx = e.clientX - modalTouchX;
      const dy = e.clientY - modalTouchY;

      if (Math.abs(dx) > 50 && Math.abs(dy) < 50) {
        if (dx < 0) {
          simulateClick('btn-next');
        } else {
          simulateClick('btn-prev');
        }
      }
    });

    elements.btnClose.addEventListener('click', () => {
      elements.modalPreview.classList.remove('active');
    });

    elements.btnPrev.addEventListener('click', () => {
      if (state.previewIndex > 0) {
        openModal(state.previewIndex - 1);
      }
    });

    elements.btnNext.addEventListener('click', () => {
      if (state.previewIndex < state.croppedImages.length - 1) {
        openModal(state.previewIndex + 1);
      }
    });

    elements.btnDelete.addEventListener('click', () => {
      URL.revokeObjectURL(state.croppedImages.splice(state.previewIndex, 1)[0].url);
      renderThumbs();

      if (state.croppedImages.length === 0) {
        elements.modalPreview.classList.remove('active');
        state.previewIndex = -1;
      } else {
        openModal(Math.min(state.previewIndex, state.croppedImages.length - 1));
      }
    });

    elements.btnDownload.addEventListener('click', () => {
      const a = document.createElement('a');
      const img = state.croppedImages[state.previewIndex];
      a.href = img.url;
      a.download = img.filename;
      a.click();
    });

    elements.btnUpload.addEventListener('click', async () => {
      if (!charWrite) {
        logDebug("Error: Bluetooth badge not connected.");
        elements.modalPreview.classList.remove('active');
        switchTab(true);
        return;
      }

      if (!state.badgeWidth || !state.maxBlockSize) {
        alert("Badge screen size or block size is unknown. Cannot upload.");
        return;
      }

      const img = state.croppedImages[state.previewIndex];

      if (img.res !== state.badgeWidth) {
        alert(`Image resolution (${img.res}px) does not match the badge screen size (${state.badgeWidth}px). Please crop again with the correct resolution.`);
        return;
      }

      const btns = document.querySelectorAll('.btn-modal');
      btns.forEach(b => b.disabled = true);
      elements.progressContainer.classList.add('active');
      elements.progressBar.value = 0;
      elements.progressText.textContent = `0 / ?`;

      try {
        await transferFileToBadge(img.blob, (curr, tot) => {
          elements.progressBar.max = tot;
          elements.progressBar.value = curr;
          elements.progressText.textContent = `${curr} / ${tot}`;
        });

        logDebug("Upload complete. Checking free space...");
        await reqData(BLE_CMD.CTRL, 0x04);
      } catch (e) {
        logDebug(`Upload Error: ${e.message}`);
      } finally {
        btns.forEach(b => b.disabled = false);
        setTimeout(() => {
          elements.progressContainer.classList.remove('active');
        }, 500);
      }
    });

    elements.seekStart.addEventListener('input', () => {
      updateRangeUI();
      elements.videoSource.currentTime = parseFloat(elements.seekStart.value);
    });

    elements.seekEnd.addEventListener('input', () => {
      updateRangeUI();
      elements.videoSource.currentTime = parseFloat(elements.seekEnd.value);
    });

    elements.inputStart.addEventListener('input', () => {
      let st = parseFloat(elements.inputStart.value) || 0;
      const ed = parseFloat(elements.seekEnd.value) || 0;

      if (st > ed) {
        st = ed;
      }

      elements.seekStart.value = st;
      updateRangeUI();
      elements.videoSource.currentTime = st;
    });

    elements.inputDuration.addEventListener('input', () => {
      const st = parseFloat(elements.seekStart.value) || 0;
      let len = parseFloat(elements.inputDuration.value) || 0;
      const dur = elements.videoSource.duration || 100;

      if (st + len > dur) {
        len = dur - st;
      }

      elements.seekEnd.value = st + len;
      updateRangeUI();
    });

    elements.btnPlay.addEventListener('click', () => {
      if (elements.videoSource.paused) {
        elements.videoSource.play();
        elements.iconPlay.textContent = 'pause';
      } else {
        elements.videoSource.pause();
        elements.iconPlay.textContent = 'play_arrow';
      }
    });

    elements.videoSource.addEventListener('timeupdate', () => {
      if (!state.isVideo || !elements.videoSource.duration) return;

      const dur = elements.videoSource.duration;
      const curr = elements.videoSource.currentTime;
      const ed = parseFloat(elements.seekEnd.value) || dur;
      const st = parseFloat(elements.seekStart.value) || 0;

      if (curr >= ed) {
        if (!elements.videoSource.paused) {
          elements.videoSource.currentTime = st;
        }
      }

      elements.seekCurrentPos.style.insetInlineStart = `${(curr / dur) * 100}%`;
    });

    initCjpegli();
    updateQualityUI();
    elements.selResolution.dispatchEvent(new Event('change'));
  };

  initApp();
</script>
</body>
</html>
