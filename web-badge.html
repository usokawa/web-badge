</div>

<script type="module">
  const BLE_UUIDS = {
    SERVICE: '7e400001-b5a3-f393-e0a9-e50e24dcca9d',
    WRITE: '7e400002-b5a3-f393-e0a9-e50e24dcca9d',
    NOTIFY: '7e400003-b5a3-f393-e0a9-e50e24dcca9d'
  };
  const BLE_FRAME = { CMD: 0xCD, ACK: 0xDC };
  const BLE_CMD = { SYSTEM: 0x12, DEVICE: 0x1A, FILE: 0x1F, CTRL: 0x20 };

  const CRC_TABLE = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let j = 0; j < 8; j++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
    CRC_TABLE[i] = c;
  }

  const $ = (id) => document.getElementById(id);
  const clamp = (v, min, max) => Math.min(max, Math.max(min, v));
  const pad = (num, len = 2) => String(num).padStart(len, '0');
  const hexByte = (b) => b.toString(16).padStart(2, '0').toUpperCase();
  const u32be = (v) => [(v >>> 24) & 0xFF, (v >>> 16) & 0xFF, (v >>> 8) & 0xFF, v & 0xFF];
  const readU32be = (buf, pos = 0) => ((buf[pos] << 24) | (buf[pos + 1] << 16) | (buf[pos + 2] << 8) | buf[pos + 3]) >>> 0;
  const writeAscii = (dv, pos, str) => { for (let i = 0; i < str.length; i++) dv.setUint8(pos + i, str.charCodeAt(i)); };
  const getExportFilename = (img, idx) => img.filename.replace('.jpg', `_${idx}.jpg`);

  const elements = {
    appLayout: $('app-layout'),
    tabBadge: $('tab-badge'),
    tabMedia: $('tab-media'),
    panelBadge: $('panel-badge'),
    btnConnectBle: $('btn-connect-ble'),
    iconBle: $('icon-ble'),
    infoBadgeHeader: $('info-badge-header'),
    textBadgeName: $('text-badge-name'),
    textMacAddress: $('text-mac-address'),
    btnDebug: $('btn-debug'),
    btnSetLang: $('btn-set-lang'),
    selLang: $('sel-lang'),
    btnCall: $('btn-call'),
    btnCheckStorage: $('btn-check-storage'),
    panelMedia: $('panel-media'),
    btnOpenFile: $('btn-open-file'),
    inputFile: $('input-file'),
    btnProcess: $('btn-process'),
    selResolution: $('sel-resolution'),
    inputFilesize: $('input-filesize'),
    grpFilesize: $('grp-filesize'),
    inputQuality: $('input-quality'),
    grpQuality: $('grp-quality'),
    cropArea: $('crop-area'),
    imgSource: $('img-source'),
    videoSource: $('video-source'),
    audioSource: $('audio-source'),
    cropMask: $('crop-mask'),
    videoControls: $('video-controls'),
    btnPlay: $('btn-play'),
    iconPlay: $('icon-play'),
    seekStart: $('seek-start'),
    seekEnd: $('seek-end'),
    seekHighlight: $('seek-highlight'),
    seekCurrentPos: $('seek-current-pos'),
    inputStart: $('input-start'),
    inputDuration: $('input-duration'),
    grpTotal: $('grp-total'),
    inputTotal: $('input-total'),
    grpFps: $('grp-fps'),
    inputFps: $('input-fps'),
    btnImport: $('btn-import'),
    inputImport: $('input-import'),
    thumbnailContainer: $('thumbnail-container'),
    btnAudioThumb: $('btn-audio-thumb'),
    iconBattery: $('icon-battery'),
    textBattery: $('text-battery'),
    textScreenSize: $('text-screen-size'),
    textStorage: $('text-storage'),
    modalPreview: $('modal-preview'),
    modalFilename: $('modal-filename'),
    btnClose: $('btn-close'),
    btnUploadImage: $('btn-upload-image'),
    btnUploadVideo: $('btn-upload-video'),
    modalFpsGroup: $('modal-fps-group'),
    modalInputFps: $('modal-input-fps'),
    btnPrev: $('btn-prev'),
    imgPreview: $('img-preview'),
    btnNext: $('btn-next'),
    btnDownload: $('btn-download'),
    btnDownloadZip: $('btn-download-zip'),
    modalFilesize: $('modal-filesize'),
    btnDelete: $('btn-delete'),
    modalProgress: $('modal-progress'),
    progressBar: $('progress-bar'),
    progressText: $('progress-text')
  };

  const state = {
    isBusy: false,
    isDebug: false,
    isVideo: false,
    isAudioCrop: false,
    badgeWidth: 0,
    badgeHeight: 0,
    maxBlockSize: 0,
    maskRes: 0,
    scale: 1,
    x: 0,
    y: 0,
    initialScale: 1,
    initialX: 0,
    initialY: 0,
    pointers: new Map(),
    startX: 0,
    startY: 0,
    pinchDist: 0,
    currentAudioBuffer: null,
    activeAudio: null,
    croppedImages: [],
    previewIndex: -1
  };

  let bluetoothBadge = null;
  let charWrite = null;
  let charNotify = null;
  let charBattery = null;
  let writeChain = Promise.resolve();
  let rafId = null;
  let cjpegliPromise = null;
  let pendingChunkReq = null;
  let modalTouchId = null;
  let modalTouchX = 0;
  let modalTouchY = 0;
  const pendingRequests = {};

  let cachedCanvas = null;
  let cachedCtx = null;
  let cachedRes = 0;

  const decodeAudio = async (buf) => {
    const ctx = new OfflineAudioContext(1, 1, 16000);
    return await ctx.decodeAudioData(buf);
  };

  const getTimestamp = () => {
    const d = new Date();
    return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}_${pad(d.getMilliseconds(), 3)}`;
  };

  const logDebug = (msg) => {
    if (state.isDebug) console.log(`[${new Date().toISOString()}] ${msg}`);
  };

  const toHex = (buf) => {
    const hex = Array.from(buf, hexByte).join(' ');
    return hex.length > 96 ? hex.substring(0, 96) + '...' : hex;
  };

  const calcChecksum8 = (buf) => buf.reduce((sum, byte) => (sum + byte) >>> 0, 0);

  const calcChecksum32 = (val) => ((val >>> 24) & 0xFF) + ((val >>> 16) & 0xFF) + ((val >>> 8) & 0xFF) + (val & 0xFF);

  const simulateClick = (id) => {
    const btn = $(id);
    if (!btn || btn.disabled || btn.classList.contains('hidden-control') || btn.style.visibility === 'hidden') return;
    btn.classList.add('simulate-active');
    setTimeout(() => btn.classList.remove('simulate-active'), 150);
    btn.click();
  };

  const updateProgress = (curr, tot) => {
    const pct = tot > 0 ? Math.round((curr / tot) * 100) : 0;
    elements.progressBar.value = pct;
    elements.progressText.textContent = `${pct}%`;
  };

  const setUILock = (locked, showProg = false) => {
    state.isBusy = locked;
    elements.appLayout.inert = locked;
    elements.modalPreview.inert = locked;
    if (showProg) {
      updateProgress(0, 1);
      void elements.progressBar.offsetWidth;
      elements.modalProgress.classList.add('active');
    } else if (!locked) {
      elements.modalProgress.classList.remove('active');
      updateProgress(0, 1);
      if (elements.modalPreview.classList.contains('active')) {
        elements.modalPreview.focus();
      }
    }
  };

  const triggerDownload = (url, filename) => {
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
  };

  const waitForPacket = (prefix, cls, sub, timeoutMs) => new Promise((resolve, reject) => {
    const key = `${prefix}_${cls}_${sub}`;
    if (pendingRequests[key]) pendingRequests[key].reject(new Error('Cancelled'));
    const timer = setTimeout(() => {
      delete pendingRequests[key];
      reject(new Error(`${prefix.toUpperCase()} Timeout (${cls.toString(16)} ${sub?.toString(16)})`));
    }, timeoutMs);
    pendingRequests[key] = {
      resolve: (data) => {
        clearTimeout(timer);
        delete pendingRequests[key];
        resolve(data);
      },
      reject: (err) => {
        clearTimeout(timer);
        delete pendingRequests[key];
        reject(err);
      },
      clear: () => {
        clearTimeout(timer);
        delete pendingRequests[key];
      }
    };
  });

  const waitForAck = (cls, sub) => waitForPacket('ack', cls, sub, 3000);
  const waitForData = (cls, sub) => waitForPacket('data', cls, sub, 5000);

  const waitForChunkCtrl = (expectedCode, timeoutMs = 10000) => new Promise((resolve, reject) => {
    if (pendingChunkReq) pendingChunkReq.reject(new Error('Cancelled'));
    const timer = setTimeout(() => {
      pendingChunkReq = null;
      reject(new Error(`Chunk Timeout (Expected: ${expectedCode})`));
    }, timeoutMs);
    pendingChunkReq = {
      expectedCode,
      resolve: () => {
        clearTimeout(timer);
        pendingChunkReq = null;
        resolve();
      },
      reject: (err) => {
        clearTimeout(timer);
        pendingChunkReq = null;
        reject(err);
      },
      clear: () => {
        clearTimeout(timer);
        pendingChunkReq = null;
      }
    };
  });

  const buildFrame = (cls, sub, payload = []) => {
    const len = 5 + payload.length;
    const buf = new Uint8Array(len + 3);
    buf[0] = BLE_FRAME.CMD;
    buf[1] = (len >>> 8) & 0xFF;
    buf[2] = len & 0xFF;
    buf[3] = cls;
    buf[4] = 0x01;
    buf[5] = sub;
    buf[6] = (payload.length >>> 8) & 0xFF;
    buf[7] = payload.length & 0xFF;
    buf.set(payload, 8);
    return buf;
  };

  const writePacket = (buf) => {
    const run = async () => {
      if (!charWrite) throw new Error("Bluetooth not connected");
      logDebug(`[TX] ${toHex(buf)}`);
      for (let i = 0; i < buf.length; i += 487) {
        if (!charWrite) throw new Error("Bluetooth not connected");
        await charWrite.writeValueWithoutResponse(buf.subarray(i, i + 487));
      }
    };
    const task = writeChain.then(run, run);
    writeChain = task.catch(() => {});
    return task;
  };

  const sendAck = async (cls, sub, len) => {
    await writePacket(new Uint8Array([BLE_FRAME.ACK, 0x00, 0x05, cls, sub, (len >>> 8) & 0xFF, len & 0xFF, 0x01]));
  };

  const sendCmd = async (cls, sub, payload = []) => {
    const p = waitForAck(cls, sub);
    p.catch(() => {});
    try {
      await writePacket(buildFrame(cls, sub, payload));
      await p;
    } catch (e) {
      pendingRequests[`ack_${cls}_${sub}`]?.clear();
      throw e;
    }
  };

  const reqData = async (cls, sub, payload = []) => {
    const pData = waitForData(cls, sub);
    pData.catch(() => {});
    const pAck = cls === BLE_CMD.CTRL ? null : waitForAck(cls, sub);
    pAck?.catch(() => {});
    try {
      await writePacket(buildFrame(cls, sub, payload));
      if (pAck) {
        await Promise.race([pAck, pData]);
        pendingRequests[`ack_${cls}_${sub}`]?.clear();
      }
      return await pData;
    } catch (e) {
      pendingRequests[`data_${cls}_${sub}`]?.clear();
      pendingRequests[`ack_${cls}_${sub}`]?.clear();
      throw e;
    }
  };

  const sendFileCmd = async (sub, payload, expectedCode) => {
    const p = waitForChunkCtrl(expectedCode);
    p.catch(() => {});
    try {
      await writePacket(buildFrame(BLE_CMD.FILE, sub, payload));
      await p;
    } catch (e) {
      pendingChunkReq?.clear();
      throw e;
    }
  };

  const checkBadgeStorage = () => reqData(BLE_CMD.CTRL, 0x04);

  const handleAckEvent = (val) => {
    if (val.length < 8) return;
    const req = pendingRequests[`ack_${val[3]}_${val[4]}`];
    if (!req) return;
    val[7] === 0x01 ? req.resolve() : req.reject(new Error(`ACK Error: ${val[7]}`));
  };

  const handleDataEvent = async (val) => {
    if (val.length < 8) return;
    const frameLen = (val[1] << 8) | val[2];
    const payloadLen = (val[6] << 8) | val[7];
    if (frameLen !== payloadLen + 5 || val.length < 8 + payloadLen) return;
    const cls = val[3];
    const sub = val[5];
    const payload = val.subarray(8, 8 + payloadLen);
    try {
      await sendAck(cls, sub, frameLen + 3);
    } catch (e) {
      logDebug(`ACK Send Error: ${e.message}`);
    }
    pendingRequests[`data_${cls}_${sub}`]?.resolve(payload);

    if (cls === BLE_CMD.CTRL && sub === 0x04 && payload.length >= 8) {
      elements.textStorage.textContent = `${(readU32be(payload, 4) / 1024).toFixed(0)} KiB`;
      return;
    }

    if (cls === BLE_CMD.CTRL && sub === 0x01 && payload.length >= 4 && pendingChunkReq) {
      const code = readU32be(payload, 0);
      code === pendingChunkReq.expectedCode ? pendingChunkReq.resolve() : pendingChunkReq.reject(new Error(`Transfer Rejected: Code ${code}`));
    }
  };

  const onBleNotification = async (e) => {
    const dv = e.target.value;
    const val = new Uint8Array(dv.buffer, dv.byteOffset, dv.byteLength);
    if (val.length === 0) return;
    logDebug(`[RX] ${toHex(val)}`);
    val[0] === BLE_FRAME.ACK ? handleAckEvent(val) : await handleDataEvent(val);
  };

  const updateBatteryUI = (val) => {
    elements.textBattery.textContent = `${val}%`;
    const step = Math.min(6, Math.floor(val / 15));
    elements.iconBattery.textContent = val >= 95 ? 'battery_full' : `battery_${step}_bar`;
  };

  const onBatteryChange = (e) => updateBatteryUI(e.target.value.getUint8(0));

  const setBadgeControlState = (enabled) => {
    document.querySelectorAll('.btn-badge-cmd').forEach(btn => btn.disabled = !enabled);
    elements.btnConnectBle.classList.toggle('active-primary', enabled);
    elements.iconBle.textContent = enabled ? 'bluetooth_connected' : 'bluetooth';
    elements.infoBadgeHeader.classList.toggle('hidden-control', !enabled);
  };

  const onBadgeDisconnected = () => {
    logDebug("Badge disconnected.");
    setBadgeControlState(false);
    charNotify?.removeEventListener('characteristicvaluechanged', onBleNotification);
    charBattery?.removeEventListener('characteristicvaluechanged', onBatteryChange);
    charWrite = null;
    charNotify = null;
    charBattery = null;
    writeChain = Promise.resolve();
    state.badgeWidth = 0;
    state.badgeHeight = 0;
    state.maxBlockSize = 0;
    elements.textBadgeName.textContent = '';
    elements.textMacAddress.textContent = '';
    elements.iconBattery.textContent = 'battery_full';
    elements.textBattery.textContent = '--%';
    elements.textScreenSize.textContent = '--x--';
    elements.textStorage.textContent = '-- KiB';
    Object.keys(pendingRequests).forEach(k => pendingRequests[k]?.reject(new Error("Badge disconnected")));
    if (pendingChunkReq) {
      pendingChunkReq.reject(new Error("Badge disconnected"));
    }
  };

  const setupSecondaryNotifications = async (service) => {
    try {
      const secChar = await service.getCharacteristic('7e400004-b5a3-f393-e0a9-e50e24dcca9d');
      await secChar.startNotifications();
    } catch (e) {
      logDebug("Secondary notifications unavailable.");
    }
  };

  const setupBatteryService = async (server) => {
    try {
      const batSvc = await server.getPrimaryService('battery_service');
      charBattery = await batSvc.getCharacteristic('battery_level');
      const initialVal = await charBattery.readValue();
      updateBatteryUI(initialVal.getUint8(0));
      await charBattery.startNotifications();
      charBattery.addEventListener('characteristicvaluechanged', onBatteryChange);
    } catch (e) {
      logDebug("Battery Service unavailable.");
    }
  };

  const execInitSequence = async () => {
    try {
      const d = new Date();
      const packed = ((Math.max(0, d.getFullYear() - 2000) & 0x3F) << 26)
                   | (((d.getMonth() + 1) & 0x0F) << 22)
                   | ((d.getDate() & 0x1F) << 17)
                   | ((d.getHours() & 0x1F) << 12)
                   | ((d.getMinutes() & 0x3F) << 6)
                   | (d.getSeconds() & 0x3F);
      await sendCmd(BLE_CMD.SYSTEM, 0x01, u32be(packed));
      const mac = await reqData(BLE_CMD.DEVICE, 0x0A);
      if (mac.length >= 6) {
        elements.textMacAddress.textContent = `(${Array.from(mac, hexByte).join(':')})`;
      }
      const name = await reqData(BLE_CMD.DEVICE, 0x0C);
      if (name.length >= 1) elements.textBadgeName.textContent = new TextDecoder().decode(name.subarray(1));
      const ctrlDevInfo = await reqData(BLE_CMD.CTRL, 0x02);
      if (ctrlDevInfo.length >= 32 && ctrlDevInfo[0] === 0x01) {
        state.badgeWidth = (ctrlDevInfo[2] << 8) | ctrlDevInfo[3];
        state.badgeHeight = (ctrlDevInfo[4] << 8) | ctrlDevInfo[5];
        elements.textScreenSize.textContent = `${state.badgeWidth}x${state.badgeHeight}`;
        state.maxBlockSize = (ctrlDevInfo[30] << 8) | ctrlDevInfo[31];
        const wStr = String(state.badgeWidth);
        if ([...elements.selResolution.options].some(o => o.value === wStr)) {
          elements.selResolution.value = wStr;
          elements.selResolution.dispatchEvent(new Event('change'));
        }
      }
      await checkBadgeStorage();
    } catch (e) {
      logDebug(`Init Error: ${e.message}`);
    }
  };

  const connectAndInitBadge = async () => {
    bluetoothBadge?.removeEventListener('gattserverdisconnected', onBadgeDisconnected);
    bluetoothBadge = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: [BLE_UUIDS.SERVICE, 'battery_service']
    });
    bluetoothBadge.addEventListener('gattserverdisconnected', onBadgeDisconnected, { once: true });
    try {
      const server = await bluetoothBadge.gatt.connect();
      const service = await server.getPrimaryService(BLE_UUIDS.SERVICE);
      charWrite = await service.getCharacteristic(BLE_UUIDS.WRITE);
      charNotify = await service.getCharacteristic(BLE_UUIDS.NOTIFY);
      await charNotify.startNotifications();
      charNotify.addEventListener('characteristicvaluechanged', onBleNotification);
      await setupSecondaryNotifications(service);
      await setupBatteryService(server);
      await execInitSequence();
      if (bluetoothBadge?.gatt.connected) setBadgeControlState(true);
    } catch (e) {
      if (bluetoothBadge?.gatt.connected) bluetoothBadge.gatt.disconnect();
      else onBadgeDisconnected();
      throw e;
    }
  };

  const sendFileChunk = async (chunkIndex, blockData, totalSize, cs32, currentSum) => {
    const isFirst = chunkIndex === 1;
    const headerLen = isFirst ? 6 : 2;
    const payload = new Uint8Array(headerLen + blockData.length + 4);
    payload[0] = (chunkIndex >>> 8) & 0xFF;
    payload[1] = chunkIndex & 0xFF;
    if (isFirst) payload.set(u32be(totalSize), 2);
    payload.set(blockData, headerLen);
    const bCS = calcChecksum8(blockData);
    const newSum = (currentSum + bCS) >>> 0;
    const tVal = (isFirst ? (bCS + cs32 + 1) : (bCS + chunkIndex)) >>> 0;
    payload.set(u32be(tVal), headerLen + blockData.length);
    await sendFileCmd(0x01, payload, 1000 + chunkIndex);
    return newSum;
  };

  const transferFileToBadge = async (blob, onProgress) => {
    const buf = new Uint8Array(await blob.arrayBuffer());
    const size = buf.length;
    const blocks = [];
    let offset = 0;
    let bid = 1;
    while (offset < size) {
      const len = Math.min(size - offset, bid === 1 ? state.maxBlockSize - 4 : state.maxBlockSize);
      blocks.push(buf.subarray(offset, offset + len));
      offset += len;
      bid++;
    }
    if (onProgress) onProgress(0, blocks.length);
    const sid = Math.floor(Math.random() * 0xFFFFFFFF);
    const fileType = blob.type === 'video/avi' ? 0x01 : 0x02;
    const initPayload = new Uint8Array([
      ...u32be(sid),
      fileType, 0x08, 0, 0, 0,
      ...u32be(size + 4),
      0, 0, 0, 0
    ]);
    await sendFileCmd(0x02, initPayload, 1000);
    let sum = 0;
    const cs32 = calcChecksum32(size);
    for (let k = 1; k <= blocks.length; k++) {
      sum = await sendFileChunk(k, blocks[k - 1], size, cs32, sum);
      if (onProgress) onProgress(k, blocks.length);
    }
    const vCS = (sum + cs32) >>> 0;
    await sendFileCmd(0x03, u32be(vCS), 0x0002);
  };

  const calcAviSize = (items, totalAudioBytes) => {
    const hasAudio = totalAudioBytes > 0;
    let videoBytes = 0;
    let chunkCount = items.length;
    let audioGenerated = 0;
    for (let v = 0; v < items.length; v++) {
      const rawSize = items[v].blob ? items[v].blob.size : items[v].buf.length;
      videoBytes += rawSize + (rawSize & 1);
      if (hasAudio) {
        const target = Math.floor(totalAudioBytes * (v + 1) / items.length) & ~1;
        chunkCount += Math.ceil((target - audioGenerated) / 684);
        audioGenerated = target;
      }
    }
    return (hasAudio ? 334 : 232) + videoBytes + totalAudioBytes + (chunkCount * 24);
  };

  const buildAviFile = async (croppedImages, width, height, fps, audioData) => {
    const frames = await Promise.all(croppedImages.map(async (img) => {
      const buf = new Uint8Array(await img.blob.arrayBuffer());
      const pad = buf.length & 1;
      return { buf, pad, size: buf.length + pad };
    }));
    const hasAudio = Boolean(audioData?.length);
    const interleaved = [];
    let audioBytesGenerated = 0;
    const microSecPerFrame = Math.round(1000000 / fps);
    const dwScale = 1000;
    const dwRate = Math.max(1, Math.round(fps * dwScale));
    const audioBytesPerSec = 32000;
    const totalAudioBytes = hasAudio ? audioData.length : 0;
    for (let v = 0; v < frames.length; v++) {
      interleaved.push({ type: 'video', frame: frames[v] });
      if (hasAudio) {
        const targetAudioBytes = Math.floor(totalAudioBytes * (v + 1) / frames.length) & ~1;
        while (audioBytesGenerated < targetAudioBytes) {
          const chunkSize = Math.min(684, targetAudioBytes - audioBytesGenerated);
          interleaved.push({ type: 'audio', size: chunkSize, buf: audioData.subarray(audioBytesGenerated, audioBytesGenerated + chunkSize) });
          audioBytesGenerated += chunkSize;
        }
      }
    }
    const maxVideoSize = frames.reduce((max, f) => Math.max(max, f.size), 0);
    const maxAudioSize = hasAudio ? 684 : 0;
    const maxBytesPerSec = Math.floor(maxVideoSize * fps) + (hasAudio ? audioBytesPerSec : 0);
    const suggestedBufferSize = maxVideoSize + maxAudioSize;
    const exactSize = calcAviSize(frames, totalAudioBytes);
    const data = new Uint8Array(exactSize);
    const dv = new DataView(data.buffer);
    let pos = 0;
    const write4CC = (s) => { writeAscii(dv, pos, s); pos += 4; };
    const writeU32 = (v) => { dv.setUint32(pos, v, true); pos += 4; };
    const writeU16 = (v) => { dv.setUint16(pos, v, true); pos += 2; };
    const writeZeros = (len) => { pos += len; };
    const writeData = (buf) => { data.set(buf, pos); pos += buf.length; };
    write4CC('RIFF');
    const riffSizePos = pos;
    writeU32(0); write4CC('AVI '); write4CC('LIST');
    const hdrlSizePos = pos;
    writeU32(0); write4CC('hdrl'); write4CC('avih');
    writeU32(56); writeU32(microSecPerFrame); writeU32(maxBytesPerSec);
    writeU32(0); writeU32(0x0910); writeU32(frames.length); writeU32(0);
    writeU32(hasAudio ? 2 : 1); writeU32(suggestedBufferSize); writeU32(width); writeU32(height);
    writeZeros(16); write4CC('LIST');
    const vStrlSizePos = pos;
    writeU32(0); write4CC('strl'); write4CC('strh'); writeU32(56);
    write4CC('vids'); write4CC('MJPG'); writeU32(0); writeU16(0); writeU16(0);
    writeU32(0); writeU32(dwScale); writeU32(dwRate); writeU32(0); writeU32(frames.length);
    writeU32(maxVideoSize); writeU32(0xFFFFFFFF); writeU32(0); writeU16(0); writeU16(0);
    writeU16(width); writeU16(height); write4CC('strf'); writeU32(40);
    writeU32(40); writeU32(width); writeU32(height); writeU16(1); writeU16(24);
    write4CC('MJPG'); writeU32(maxVideoSize); writeU32(0); writeU32(0); writeU32(0); writeU32(0);
    dv.setUint32(vStrlSizePos, pos - vStrlSizePos - 4, true);
    if (hasAudio) {
      write4CC('LIST');
      const aStrlSizePos = pos;
      writeU32(0); write4CC('strl'); write4CC('strh'); writeU32(56);
      write4CC('auds'); writeU32(0); writeU16(0); writeU16(0);
      writeU32(0); writeU32(1); writeU32(16000); writeU32(0); writeU32(totalAudioBytes / 2);
      writeU32(maxAudioSize); writeU32(0xFFFFFFFF); writeU32(2); writeZeros(8);
      write4CC('strf'); writeU32(18); writeU16(1); writeU16(1); writeU32(16000);
      writeU32(32000); writeU16(2); writeU16(16); writeU16(0);
      dv.setUint32(aStrlSizePos, pos - aStrlSizePos - 4, true);
    }
    dv.setUint32(hdrlSizePos, pos - hdrlSizePos - 4, true);
    write4CC('LIST');
    const moviSizePos = pos;
    writeU32(0);
    const moviFourccPos = pos;
    write4CC('movi');
    const indexEntries = [];
    for (const item of interleaved) {
      const chunkOffset = pos - moviFourccPos;
      if (item.type === 'video') {
        write4CC('00dc'); writeU32(item.frame.buf.length); writeData(item.frame.buf);
        if (item.frame.pad) writeZeros(1);
        indexEntries.push({ id: '00dc', flags: 0x10, offset: chunkOffset, size: item.frame.buf.length });
      } else {
        write4CC('01wb'); writeU32(item.size); writeData(item.buf);
        indexEntries.push({ id: '01wb', flags: 0x10, offset: chunkOffset, size: item.size });
      }
    }
    dv.setUint32(moviSizePos, pos - moviSizePos - 4, true);
    write4CC('idx1'); writeU32(indexEntries.length * 16);
    for (const entry of indexEntries) {
      write4CC(entry.id); writeU32(entry.flags); writeU32(entry.offset); writeU32(entry.size);
    }
    dv.setUint32(riffSizePos, pos - 8, true);
    return new Blob([data], { type: 'video/avi' });
  };

  const createZip = (files) => {
    let cdSize = 0, lfSize = 0;
    const encoder = new TextEncoder();
    const d = new Date();
    const dosTime = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
    const dosDate = ((Math.max(1980, d.getFullYear()) - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
    const filesData = files.map(f => {
      const nameBuf = encoder.encode(f.name);
      let crc = ~0 >>> 0;
      const buf = f.data;
      for (let j = 0; j < buf.length; j++) {
        crc = CRC_TABLE[(crc ^ buf[j]) & 0xff] ^ (crc >>> 8);
      }
      const finalCrc = (~crc) >>> 0;
      lfSize += 30 + nameBuf.length + buf.length;
      cdSize += 46 + nameBuf.length;
      return { ...f, nameBuf, crc: finalCrc };
    });
    const out = new Uint8Array(lfSize + cdSize + 22);
    const dv = new DataView(out.buffer);
    let p = 0;
    for (const f of filesData) {
      f.offset = p;
      dv.setUint32(p, 0x04034b50, true); dv.setUint16(p + 4, 10, true);
      dv.setUint16(p + 8, 0, true); dv.setUint16(p + 10, dosTime, true); dv.setUint16(p + 12, dosDate, true);
      dv.setUint32(p + 14, f.crc, true);
      dv.setUint32(p + 18, f.data.length, true); dv.setUint32(p + 22, f.data.length, true);
      dv.setUint16(p + 26, f.nameBuf.length, true);
      out.set(f.nameBuf, p + 30); out.set(f.data, p + 30 + f.nameBuf.length);
      p += 30 + f.nameBuf.length + f.data.length;
    }
    const cdStart = p;
    for (const f of filesData) {
      dv.setUint32(p, 0x02014b50, true); dv.setUint16(p + 4, 10, true);
      dv.setUint16(p + 6, 10, true); dv.setUint16(p + 12, dosTime, true); dv.setUint16(p + 14, dosDate, true);
      dv.setUint32(p + 16, f.crc, true);
      dv.setUint32(p + 20, f.data.length, true); dv.setUint32(p + 24, f.data.length, true);
      dv.setUint16(p + 28, f.nameBuf.length, true); dv.setUint32(p + 42, f.offset, true);
      out.set(f.nameBuf, p + 46);
      p += 46 + f.nameBuf.length;
    }
    dv.setUint32(p, 0x06054b50, true); dv.setUint16(p + 8, files.length, true);
    dv.setUint16(p + 10, files.length, true); dv.setUint32(p + 12, cdSize, true);
    dv.setUint32(p + 16, cdStart, true);
    return new Blob([out], { type: 'application/zip' });
  };

  const drawToCanvas = (source, res) => {
    if (cachedRes !== res || !cachedCanvas) {
      cachedCanvas = new OffscreenCanvas(res, res);
      cachedCtx = cachedCanvas.getContext('2d');
      cachedCtx.imageSmoothingQuality = 'high';
      cachedCtx.fillStyle = 'black';
      cachedCtx.beginPath();
      cachedCtx.arc(res / 2, res / 2, (res + 16) / 2, 0, Math.PI * 2);
      cachedCtx.clip();
      cachedRes = res;
    }
    cachedCtx.fillRect(0, 0, res, res);
    const srcW = source.videoWidth || source.naturalWidth;
    const srcH = source.videoHeight || source.naturalHeight;
    const dSize = res + 16;
    const sArea = dSize / state.scale;
    const sx = (srcW / 2) - (state.x / state.scale) - sArea / 2;
    const sy = (srcH / 2) - (state.y / state.scale) - sArea / 2;
    cachedCtx.drawImage(source, sx, sy, sArea, sArea, -8, -8, dSize, dSize);
    return { cvs: cachedCanvas, ctx: cachedCtx };
  };

  const generatePamImage = (source, res) => {
    const { ctx } = drawToCanvas(source, res);
    const imgData = ctx.getImageData(0, 0, res, res);
    const hdr = new TextEncoder().encode(`P7\nWIDTH ${res}\nHEIGHT ${res}\nDEPTH 3\nMAXVAL 255\nTUPLTYPE RGB\nENDHDR\n`);
    const pam = new Uint8Array(hdr.length + res * res * 3);
    pam.set(hdr);
    let p = hdr.length;
    for (let i = 0; i < imgData.data.length; i += 4) {
      pam[p++] = imgData.data[i]; pam[p++] = imgData.data[i + 1]; pam[p++] = imgData.data[i + 2];
    }
    return pam;
  };

  const processFrameCjpegli = (mod, source, res, targetSizeKb) => {
    const pam = generatePamImage(source, res);
    mod.FS.writeFile('in.pam', pam);
    let jpg = null;
    try {
      mod.callMain(['in.pam', 'out.jpg', '-p', '0', '--target_size', Math.round(clamp(targetSizeKb, 1, 39) * 1024).toString(), '--std_quant']);
      jpg = mod.FS.readFile('out.jpg');
    } catch (e) {
      logDebug(`cjpegli Process Error: ${e.message}`);
      cjpegliPromise = null;
    } finally {
      try { mod.FS.unlink('in.pam'); mod.FS.unlink('out.jpg'); } catch (e) {}
    }
    return jpg ? new Blob([jpg], { type: 'image/jpeg' }) : null;
  };

  const initCjpegli = async () => {
    if (!window.createCjpegli) return null;
    try {
      cjpegliPromise ??= window.createCjpegli();
      return await cjpegliPromise;
    } catch (e) {
      logDebug(`cjpegli Init Error: ${e.message}`);
      cjpegliPromise = null;
      return null;
    }
  };

  const processSingleFrame = async (source, res, targetSize, quality) => {
    const mod = await initCjpegli();
    if (mod) return processFrameCjpegli(mod, source, res, targetSize);
    const { cvs } = drawToCanvas(source, res);
    return await cvs.convertToBlob({ type: 'image/jpeg', quality });
  };

  const createPcmWav = async (audioBuffer, startOffset, duration, totalDuration) => {
    const offCtx = new OfflineAudioContext(1, Math.max(1, Math.ceil(totalDuration * 16000)), 16000);
    if (duration > 0 && audioBuffer) {
      const safeStart = clamp(startOffset, 0, Math.max(0, audioBuffer.duration - 0.001));
      const safeDur = clamp(duration, 0, Math.max(0, audioBuffer.duration - safeStart));
      if (safeDur > 0) {
        const src = offCtx.createBufferSource();
        src.buffer = audioBuffer;
        src.connect(offCtx.destination);
        src.start(0, safeStart, safeDur);
      }
    }
    const rbuf = await offCtx.startRendering();
    const ch = rbuf.getChannelData(0);
    const pcm = new Int16Array(ch.length);
    for (let j = 0; j < ch.length; j++) {
      const s = clamp(ch[j], -1, 1);
      pcm[j] = s < 0 ? s * 0x8000 : s * 0x7FFF;
    }
    const pcmData = new Uint8Array(pcm.buffer);
    const wav = new ArrayBuffer(44);
    const dv = new DataView(wav);
    writeAscii(dv, 0, 'RIFF'); dv.setUint32(4, 36 + pcmData.length, true);
    writeAscii(dv, 8, 'WAVE'); writeAscii(dv, 12, 'fmt '); dv.setUint32(16, 16, true);
    dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
    dv.setUint32(24, 16000, true); dv.setUint32(28, 32000, true);
    dv.setUint16(32, 2, true); dv.setUint16(34, 16, true);
    writeAscii(dv, 36, 'data'); dv.setUint32(40, pcmData.length, true);
    return { pcmData, blob: new Blob([wav, pcmData], { type: 'audio/wav' }), rbuf };
  };

  const getMedia = () => state.isAudioCrop ? elements.audioSource : elements.videoSource;

  const getSeekBounds = (m) => {
    const st = parseFloat(elements.seekStart.value) || 0;
    const ed = parseFloat(elements.seekEnd.value);
    return { st, ed: isNaN(ed) ? (m.duration || 0) : ed };
  };

  const pauseMedia = () => {
    elements.videoSource.pause();
    elements.audioSource.pause();
  };

  const revokeMediaUrl = (el) => {
    if (el.src.startsWith('blob:') && el.src !== state.activeAudio?.url && (el === elements.videoSource || el.src !== elements.videoSource.src)) {
      URL.revokeObjectURL(el.src);
    }
    el.removeAttribute('src');
    if (el.tagName !== 'IMG') el.load();
  };

  const switchTab = (isMedia) => {
    pauseMedia();
    elements.tabBadge.classList.toggle('active', !isMedia);
    elements.tabMedia.classList.toggle('active', isMedia);
    elements.panelBadge.classList.toggle('active', !isMedia);
    elements.panelMedia.classList.toggle('active', isMedia);
  };

  const updateMediaModeUI = () => {
    elements.cropMask.classList.toggle('hidden-control', state.isAudioCrop);
    elements.imgSource.classList.toggle('hidden-control', state.isAudioCrop || state.isVideo);
    elements.videoSource.classList.toggle('hidden-control', state.isAudioCrop || !state.isVideo);
    elements.videoControls.classList.toggle('active', state.isAudioCrop || state.isVideo);
    elements.grpTotal.classList.toggle('hidden-control', !state.isAudioCrop);
    elements.grpFps.classList.toggle('hidden-control', state.isAudioCrop);
  };

  const seekVideo = (time) => new Promise(resolve => {
    if (Math.abs(elements.videoSource.currentTime - time) < 0.001) return resolve();
    let timer = null;
    const done = () => {
      clearTimeout(timer);
      elements.videoSource.removeEventListener('seeked', onSeeked);
      resolve();
    };
    const onSeeked = () => requestAnimationFrame(done);
    timer = setTimeout(done, 500);
    elements.videoSource.addEventListener('seeked', onSeeked, { once: true });
    elements.videoSource.currentTime = time;
  });

  const updatePosIndicator = () => {
    const m = getMedia();
    elements.seekCurrentPos.style.insetInlineStart = `${m.duration > 0 ? (m.currentTime / m.duration) * 100 : 0}%`;
  };

  const updateRangeUI = (syncTotal = true) => {
    if (!(state.isVideo || state.isAudioCrop)) return;
    const dur = getMedia().duration || 0;
    let st = parseFloat(elements.seekStart.value) || 0;
    let ed = parseFloat(elements.seekEnd.value) || 0;
    if (st > ed) {
      document.activeElement === elements.seekStart ? (elements.seekEnd.value = ed = st) : (elements.seekStart.value = st = ed);
    }
    const len = ed - st;
    elements.seekHighlight.style.insetInlineStart = `${dur > 0 ? (st / dur) * 100 : 0}%`;
    elements.seekHighlight.style.inlineSize = `${dur > 0 ? (len / dur) * 100 : 0}%`;

    if (document.activeElement !== elements.inputStart) elements.inputStart.value = st.toFixed(3);
    if (document.activeElement !== elements.inputDuration) elements.inputDuration.value = len.toFixed(3);
    if (syncTotal && document.activeElement !== elements.inputTotal) elements.inputTotal.value = len.toFixed(3);
  };

  const initTimelineUI = (dur) => {
    elements.seekStart.max = elements.seekEnd.max = dur;
    elements.seekStart.value = 0;
    elements.seekEnd.value = dur;
    elements.seekCurrentPos.style.insetInlineStart = '0%';
    updateRangeUI(true);
  };

  const renderSourceMedia = () => {
    if (rafId || state.isAudioCrop) return;
    rafId = requestAnimationFrame(() => {
      const el = state.isVideo ? elements.videoSource : elements.imgSource;
      el.style.transform = `translate(-50%, -50%) translate3d(${state.x}px, ${state.y}px, 0) scale(${state.scale})`;
      rafId = null;
    });
  };

  const zoomMedia = (factor) => {
    state.scale *= factor;
    state.x *= factor;
    state.y *= factor;
    renderSourceMedia();
  };

  const setupMediaViewport = (el, w, h) => {
    const res = parseInt(elements.selResolution.value, 10);
    state.scale = Math.min(1, res / Math.min(w || res, h || res));
    state.x = state.y = 0;
    renderSourceMedia();
    el.classList.add('loaded');
  };

  const updateModalText = () => {
    if (state.previewIndex < 0) return;
    const item = state.croppedImages[state.previewIndex];
    const fileCount = state.croppedImages.length;
    const audioBytes = state.activeAudio ? state.activeAudio.pcmData.length : 0;
    const audioLen = audioBytes / 32000;
    const hasAudio = audioBytes > 0;
    const estSize = (calcAviSize(state.croppedImages, audioBytes) / 1024).toFixed(1);

    let bottomText = `${item.filename}\nImage ${item.w}x${item.h} ${(item.blob.size / 1024).toFixed(1)} KiB`;
    if (hasAudio) {
      bottomText += `\nAudio ${audioLen.toFixed(1)}s | AVI ${estSize} KiB ${(fileCount / audioLen).toFixed(1)}fps`;
    } else {
      const uiFps = clamp(parseInt(elements.modalInputFps.value, 10) || 3, 1, 15);
      bottomText += `\nNo Audio | AVI ${estSize} KiB (at ${uiFps}fps)`;
    }
    elements.modalFpsGroup.classList.toggle('hidden-control', hasAudio);
    elements.modalFilesize.textContent = bottomText;
  };

  const openModal = (index) => {
    state.previewIndex = index;
    const fileCount = state.croppedImages.length;
    if (state.previewIndex < 0 || state.previewIndex >= fileCount) return;

    elements.btnDownloadZip.classList.toggle('hidden-control', !(fileCount > 1 || state.activeAudio));
    const item = state.croppedImages[state.previewIndex];
    elements.imgPreview.src = item.url;
    elements.modalFilename.textContent = `${state.previewIndex + 1} / ${fileCount}`;

    updateModalText();

    elements.btnPrev.style.visibility = state.previewIndex > 0 ? 'visible' : 'hidden';
    elements.btnNext.style.visibility = state.previewIndex < fileCount - 1 ? 'visible' : 'hidden';
    elements.modalPreview.classList.add('active');

    if (document.activeElement !== elements.modalInputFps) {
      elements.modalPreview.focus();
    }
  };

  const renderThumbs = () => {
    elements.thumbnailContainer.innerHTML = '';
    state.croppedImages.forEach((img, i) => {
      const el = document.createElement('img');
      el.src = img.url; el.className = 'thumbnail-item'; el.draggable = false; el.title = 'Preview';
      el.addEventListener('click', () => openModal(i));
      elements.thumbnailContainer.appendChild(el);
    });
    elements.btnAudioThumb.classList.toggle('active', !!state.activeAudio);
    elements.thumbnailContainer.scrollLeft = elements.thumbnailContainer.scrollWidth;
  };

  const clearActiveAudio = () => {
    pauseMedia();
    revokeMediaUrl(elements.audioSource);
    if (state.activeAudio) {
      URL.revokeObjectURL(state.activeAudio.url);
      state.activeAudio = null;
    }
  };

  const setActiveAudio = (pcmData, blob, buffer) => {
    clearActiveAudio();
    blob.name = `audio_${getTimestamp()}.wav`;
    state.activeAudio = { pcmData, blob, url: URL.createObjectURL(blob), buffer };
    if (state.isAudioCrop) {
      state.currentAudioBuffer = buffer;
      elements.audioSource.src = state.activeAudio.url;
    }
  };

  const addCroppedImage = (blob, w, h = w, skipRender = false) => {
    const filename = `badge_${getTimestamp()}.jpg`;
    state.croppedImages.push({ url: URL.createObjectURL(blob), blob, filename, w, h });
    if (!skipRender) renderThumbs();
  };

  const loadMediaFile = async (file) => {
    setUILock(true);
    pauseMedia();
    elements.btnProcess.disabled = true;
    elements.imgSource.classList.remove('loaded');
    elements.videoSource.classList.remove('loaded');
    revokeMediaUrl(elements.imgSource);
    revokeMediaUrl(elements.videoSource);
    revokeMediaUrl(elements.audioSource);
    state.currentAudioBuffer = null;
    state.isAudioCrop = file.type.startsWith('audio/');
    state.isVideo = file.type.startsWith('video/');
    state.scale = state.initialScale = 1;
    state.x = state.y = state.initialX = state.initialY = state.startX = state.startY = state.pinchDist = 0;
    state.pointers.clear();
    updateMediaModeUI();

    const url = URL.createObjectURL(file);

    try {
      if (state.isAudioCrop) {
        const ab = await decodeAudio(await file.arrayBuffer());
        state.currentAudioBuffer = ab;
        initTimelineUI(ab.duration);
        elements.audioSource.src = url;
        elements.btnProcess.disabled = false;
      } else if (state.isVideo) {
        const audioPromise = file.arrayBuffer().then(decodeAudio).then(ab => {
          state.currentAudioBuffer = ab;
        }).catch(e => logDebug(`Video Audio Decode Error: ${e.message}`));

        elements.videoSource.src = url;
        const videoPromise = new Promise((resolve, reject) => {
          elements.videoSource.onloadedmetadata = () => {
            elements.videoSource.currentTime = 0;
            initTimelineUI(elements.videoSource.duration);
            setupMediaViewport(elements.videoSource, elements.videoSource.videoWidth, elements.videoSource.videoHeight);
            resolve();
          };
          elements.videoSource.onerror = () => reject(new Error('Video load failed'));
        });

        await Promise.all([audioPromise, videoPromise]);
        elements.btnProcess.disabled = false;
      } else {
        await new Promise((resolve, reject) => {
          elements.imgSource.onload = () => {
            setupMediaViewport(elements.imgSource, elements.imgSource.naturalWidth, elements.imgSource.naturalHeight);
            resolve();
          };
          elements.imgSource.onerror = () => reject(new Error('Image load failed'));
          elements.imgSource.src = url;
        });
        elements.btnProcess.disabled = false;
      }
    } catch (e) {
      if (state.isAudioCrop) URL.revokeObjectURL(url);
      else if (state.isVideo) revokeMediaUrl(elements.videoSource);
      else revokeMediaUrl(elements.imgSource);
      logDebug(`Media Load Error: ${e.message}`);
    } finally {
      setUILock(false);
    }
  };

  const initPinch = () => {
    const [p1, p2] = Array.from(state.pointers.values());
    state.pinchDist = Math.hypot(p1.x - p2.x, p1.y - p2.y);
    state.initialScale = state.scale;
  };

  const handlePointerDown = (e) => {
    if (elements.btnProcess.disabled || state.isAudioCrop) return;
    e.preventDefault();
    document.activeElement?.blur();
    elements.cropArea.setPointerCapture(e.pointerId);
    state.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (state.pointers.size === 1) {
      state.startX = e.clientX; state.startY = e.clientY;
      state.initialX = state.x; state.initialY = state.y;
    } else if (state.pointers.size === 2) {
      initPinch();
    }
  };

  const handlePointerMove = (e) => {
    if (!state.pointers.has(e.pointerId) || elements.btnProcess.disabled || state.isAudioCrop) return;
    state.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const pts = Array.from(state.pointers.values());
    if (pts.length === 1) {
      state.x = state.initialX + (e.clientX - state.startX);
      state.y = state.initialY + (e.clientY - state.startY);
      renderSourceMedia();
    } else if (pts.length === 2 && state.pinchDist > 0) {
      const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      zoomMedia((state.initialScale * (dist / state.pinchDist)) / state.scale);
    }
  };

  const handlePointerUp = (e) => {
    state.pointers.delete(e.pointerId);
    if (state.pointers.size === 1) {
      const pt = Array.from(state.pointers.values())[0];
      state.startX = pt.x; state.startY = pt.y;
      state.initialX = state.x; state.initialY = state.y;
    } else if (state.pointers.size === 2) {
      initPinch();
    }
  };

  const handleKeydown = (e) => {
    if (state.isBusy || e.ctrlKey || e.altKey || e.metaKey) return;
    if (elements.modalPreview.classList.contains('active')) {
      if (['INPUT', 'SELECT'].includes(document.activeElement?.tagName)) return;
      const acts = { Escape: 'btn-close', Delete: 'btn-delete', Backspace: 'btn-delete', ArrowLeft: 'btn-prev', ArrowRight: 'btn-next', ArrowDown: 'btn-download' };
      let targetId = acts[e.key];
      if (e.key === 'ArrowUp') targetId = e.shiftKey ? 'btn-upload-video' : 'btn-upload-image';
      if (targetId) { simulateClick(targetId); e.preventDefault(); }
      return;
    }
    if (!elements.panelMedia.classList.contains('active') || elements.btnProcess.disabled || state.isAudioCrop || ['INPUT', 'SELECT'].includes(document.activeElement?.tagName)) return;
    const acts = {
      ArrowUp: () => { state.y -= 20; renderSourceMedia(); },
      ArrowDown: () => { state.y += 20; renderSourceMedia(); },
      ArrowLeft: () => { state.x -= 20; renderSourceMedia(); },
      ArrowRight: () => { state.x += 20; renderSourceMedia(); },
      PageUp: () => zoomMedia(1.1),
      PageDown: () => zoomMedia(1 / 1.1)
    };
    if (acts[e.key]) { acts[e.key](); e.preventDefault(); }
  };

  const validateForUpload = (images) => {
    if (!charWrite) {
      elements.modalPreview.classList.remove('active');
      simulateClick('tab-badge');
      return false;
    }
    if (!state.badgeWidth || !state.badgeHeight || state.maxBlockSize <= 4) {
      alert("Error: Badge screen size or block size is unknown. Cannot upload.");
      return false;
    }
    if (images.some(img => img.w !== state.badgeWidth || img.h !== state.badgeHeight)) {
      alert(`Error: Resolution mismatch in cropped image(s). Expected ${state.badgeWidth}x${state.badgeHeight}px.`);
      return false;
    }
    if (images.some(img => img.blob.size > 40959)) {
      alert("Error: Image exceeds the maximum size of 40959 bytes.");
      return false;
    }
    return true;
  };

  const executeUpload = async (blobToUpload) => {
    setUILock(true, true);
    try {
      await transferFileToBadge(blobToUpload, updateProgress);
      await checkBadgeStorage();
    } catch (e) {
      logDebug(`Upload Error: ${e.message}`);
    } finally {
      setUILock(false);
    }
  };

  const initApp = () => {
    const syncPlayIcon = (e) => elements.iconPlay.textContent = e.type === 'play' ? 'pause' : 'play_arrow';
    const onTimeUpdate = () => {
      const m = getMedia();
      if (!(state.isVideo || state.isAudioCrop) || !m.duration) return;
      const { st, ed } = getSeekBounds(m);
      if (m.currentTime >= ed && !m.paused) m.currentTime = st;
      updatePosIndicator();
    };
    const onMediaEnded = () => {
      const m = getMedia();
      if (!(state.isVideo || state.isAudioCrop)) return;
      m.currentTime = getSeekBounds(m).st;
      m.play();
    };

    [elements.videoSource, elements.audioSource].forEach(el => {
      el.addEventListener('play', syncPlayIcon);
      el.addEventListener('pause', syncPlayIcon);
      el.addEventListener('timeupdate', onTimeUpdate);
      el.addEventListener('ended', onMediaEnded);
    });

    document.addEventListener('keydown', handleKeydown);
    elements.tabBadge.addEventListener('click', () => switchTab(false));
    elements.tabMedia.addEventListener('click', () => switchTab(true));

    elements.btnConnectBle.addEventListener('click', async () => {
      if (bluetoothBadge?.gatt.connected) return bluetoothBadge.gatt.disconnect();
      try { await connectAndInitBadge(); } catch (e) { logDebug(`BLE Connect Error: ${e.message}`); }
    });
    elements.btnDebug.addEventListener('click', () => { state.isDebug = !state.isDebug; elements.btnDebug.classList.toggle('active-primary', state.isDebug); });

    const bindBleCmd = (btn, fn) => btn.addEventListener('click', async () => {
      try { await fn(); } catch (e) { logDebug(`Command Error: ${e.message}`); }
    });
    bindBleCmd(elements.btnSetLang, () => sendCmd(BLE_CMD.SYSTEM, 0x15, [parseInt(elements.selLang.value)]));
    bindBleCmd(elements.btnCall, () => sendCmd(BLE_CMD.SYSTEM, 0x0B, [0x01]));
    bindBleCmd(elements.btnCheckStorage, checkBadgeStorage);

    const bindClampInput = (el, min, max, def, onUpdate) => {
      el.addEventListener('change', () => {
        el.value = clamp(parseInt(el.value, 10) || def, min, max);
        onUpdate?.();
      });
    };
    bindClampInput(elements.inputFilesize, 1, 39, 20);
    bindClampInput(elements.inputQuality, 1, 100, 90);
    bindClampInput(elements.inputFps, 1, 15, 3);
    bindClampInput(elements.modalInputFps, 1, 15, 3, updateModalText);
    elements.modalInputFps.addEventListener('input', updateModalText);

    elements.btnOpenFile.addEventListener('click', () => elements.inputFile.click());
    elements.inputFile.addEventListener('change', e => {
      const file = e.target.files[0];
      e.target.value = '';
      if (!file || file.type.includes('svg')) return;
      loadMediaFile(file);
    });

    elements.btnProcess.addEventListener('click', async () => {
      if (elements.btnProcess.disabled || state.isBusy) return;
      const targetSize = clamp(parseFloat(elements.inputFilesize.value) || 20, 1, 39);
      const res = parseInt(elements.selResolution.value, 10);
      const quality = clamp(parseInt(elements.inputQuality.value, 10) || 90, 1, 100) / 100;
      const st = parseFloat(elements.inputStart.value) || 0;
      const dur = parseFloat(elements.inputDuration.value) || 0;

      if (state.isVideo) {
        const fps = clamp(parseInt(elements.inputFps.value, 10) || 3, 1, 15);
        const frames = Math.round(dur * fps);
        if (dur <= 0 || frames <= 0) return;
        setUILock(true, true);
        const wasPlaying = !elements.videoSource.paused;
        const originalTime = elements.videoSource.currentTime;
        elements.videoSource.pause();
        const step = 1 / fps;
        try {
          for (let i = 0; i < frames; i++) {
            const t = Math.min(elements.videoSource.duration, st + i * step);
            await seekVideo(t);
            const blob = await processSingleFrame(elements.videoSource, res, targetSize, quality);
            if (blob) addCroppedImage(blob, res, res, true);
            updateProgress(i + 1, frames);
          }
          await seekVideo(originalTime);
          if (wasPlaying) elements.videoSource.play();
          if (state.currentAudioBuffer) {
            const { pcmData, blob, rbuf } = await createPcmWav(state.currentAudioBuffer, st, dur, dur);
            setActiveAudio(pcmData, blob, rbuf);
          }
          renderThumbs();
        } finally {
          setUILock(false);
        }
        return;
      }

      setUILock(true);
      try {
        if (state.isAudioCrop) {
          const parsedTot = parseFloat(elements.inputTotal.value);
          const tot = isNaN(parsedTot) ? dur : parsedTot;
          if (tot <= 0) {
            clearActiveAudio();
            state.currentAudioBuffer = null;
            initTimelineUI(0);
            renderThumbs();
          } else {
            const srcBuf = state.currentAudioBuffer ?? new AudioBuffer({ length: 16, sampleRate: 16000 });
            const { pcmData, blob, rbuf } = await createPcmWav(srcBuf, st, dur, tot);
            setActiveAudio(pcmData, blob, rbuf);
            initTimelineUI(rbuf.duration);
            renderThumbs();
          }
        } else {
          const blob = await processSingleFrame(elements.imgSource, res, targetSize, quality);
          if (blob) addCroppedImage(blob, res, res);
        }
      } finally {
        setUILock(false);
      }
    });

    elements.btnImport.addEventListener('click', () => elements.inputImport.click());
    elements.inputImport.addEventListener('change', async (e) => {
      const files = Array.from(e.target.files);
      e.target.value = '';
      if (files.length === 0) return;
      setUILock(true, files.length > 1);
      const defRes = parseInt(elements.selResolution.value, 10);
      try {
        for (let i = 0; i < files.length; i++) {
          const file = files[i];
          const name = file.name.toLowerCase();
          if (file.type === 'image/jpeg' || name.endsWith('.jpg') || name.endsWith('.jpeg')) {
            await new Promise((resolve) => {
              const url = URL.createObjectURL(file);
              const img = new Image();
              img.onload = () => {
                addCroppedImage(file, img.naturalWidth || defRes, img.naturalHeight || defRes, true);
                URL.revokeObjectURL(url);
                resolve();
              };
              img.onerror = () => {
                URL.revokeObjectURL(url);
                resolve();
              };
              img.src = url;
            });
          } else if (file.type.startsWith('audio/wav') || file.type === 'audio/x-wav' || name.endsWith('.wav')) {
            try {
              const ab = await decodeAudio(await file.arrayBuffer());
              const { pcmData, blob, rbuf } = await createPcmWav(ab, 0, ab.duration, ab.duration);
              setActiveAudio(pcmData, blob, rbuf);
              if (state.isAudioCrop) initTimelineUI(rbuf.duration);
            } catch (err) {
              logDebug(`WAV Import Error: ${err.message}`);
            }
          }
          if (files.length > 1) updateProgress(i + 1, files.length);
        }
        renderThumbs();
      } finally {
        setUILock(false);
      }
    });

    elements.btnAudioThumb.addEventListener('click', () => {
      pauseMedia();
      revokeMediaUrl(elements.audioSource);
      state.isAudioCrop = true;
      state.isVideo = false;
      switchTab(true);
      updateMediaModeUI();

      state.currentAudioBuffer = state.activeAudio?.buffer ?? null;
      if (state.activeAudio) {
        elements.audioSource.src = state.activeAudio.url;
        initTimelineUI(state.activeAudio.buffer.duration);
      } else {
        initTimelineUI(0);
      }
      elements.btnProcess.disabled = false;
    });

    elements.audioSource.addEventListener('loadedmetadata', () => {
      if (!state.isAudioCrop) return;
      initTimelineUI(elements.audioSource.duration);
      elements.btnProcess.disabled = false;
    });

    elements.selResolution.addEventListener('change', () => {
      const newRes = parseInt(elements.selResolution.value, 10);
      elements.cropMask.style.inlineSize = `${newRes}px`;
      elements.cropMask.style.blockSize = `${newRes}px`;
      if (state.maskRes > 0 && state.maskRes !== newRes) {
        const hasLoadedMedia = state.isVideo
          ? elements.videoSource.classList.contains('loaded')
          : elements.imgSource.classList.contains('loaded');
        if (!state.isAudioCrop && hasLoadedMedia) {
          zoomMedia(newRes / state.maskRes);
        }
      }
      state.maskRes = newRes;
    });

    elements.cropArea.addEventListener('pointerdown', handlePointerDown);
    elements.cropArea.addEventListener('pointermove', handlePointerMove);
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => elements.cropArea.addEventListener(ev, handlePointerUp));
    elements.cropArea.addEventListener('wheel', e => {
      if (elements.btnProcess.disabled || state.isAudioCrop) return;
      e.preventDefault();
      zoomMedia(Math.exp(-e.deltaY * 0.005));
    }, { passive: false });

    elements.thumbnailContainer.addEventListener('wheel', e => { e.preventDefault(); elements.thumbnailContainer.scrollLeft += e.deltaY + e.deltaX; }, { passive: false });

    elements.modalPreview.addEventListener('pointerdown', e => {
      if (e.pointerType !== 'mouse' && modalTouchId === null) {
        modalTouchId = e.pointerId;
        modalTouchX = e.clientX;
        modalTouchY = e.clientY;
      }
    });
    elements.modalPreview.addEventListener('pointerup', e => {
      if (e.pointerId !== modalTouchId) return;
      modalTouchId = null;
      if (state.previewIndex < 0) return;
      const dx = e.clientX - modalTouchX;
      if (Math.abs(dx) > 50 && Math.abs(e.clientY - modalTouchY) < 50) simulateClick(dx < 0 ? 'btn-next' : 'btn-prev');
    });
    elements.modalPreview.addEventListener('pointercancel', e => {
      if (e.pointerId === modalTouchId) modalTouchId = null;
    });

    elements.btnClose.addEventListener('click', () => elements.modalPreview.classList.remove('active'));
    elements.btnPrev.addEventListener('click', () => { if (state.previewIndex > 0) openModal(state.previewIndex - 1); });
    elements.btnNext.addEventListener('click', () => { if (state.previewIndex < state.croppedImages.length - 1) openModal(state.previewIndex + 1); });

    elements.btnDelete.addEventListener('click', () => {
      URL.revokeObjectURL(state.croppedImages.splice(state.previewIndex, 1)[0].url);
      renderThumbs();
      if (state.croppedImages.length === 0) {
        elements.imgPreview.removeAttribute('src');
        elements.modalPreview.classList.remove('active');
        state.previewIndex = -1;
      } else {
        openModal(Math.min(state.previewIndex, state.croppedImages.length - 1));
      }
    });

    elements.btnDownload.addEventListener('click', () => {
      const img = state.croppedImages[state.previewIndex];
      triggerDownload(img.url, getExportFilename(img, state.previewIndex));
    });

    elements.btnDownloadZip.addEventListener('click', async () => {
      const total = state.croppedImages.length + (state.activeAudio ? 1 : 0);
      setUILock(true, true);
      try {
        const filesToZip = [];
        for (let i = 0; i < state.croppedImages.length; i++) {
          const img = state.croppedImages[i];
          filesToZip.push({ name: getExportFilename(img, i), data: new Uint8Array(await img.blob.arrayBuffer()) });
          updateProgress(i + 1, total);
        }
        if (state.activeAudio) {
          filesToZip.push({ name: state.activeAudio.blob.name, data: new Uint8Array(await state.activeAudio.blob.arrayBuffer()) });
          updateProgress(total, total);
        }
        const url = URL.createObjectURL(createZip(filesToZip));
        triggerDownload(url, `badge_media_${Date.now()}.zip`);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } finally {
        setUILock(false);
      }
    });

    elements.btnUploadImage.addEventListener('click', async () => {
      const img = state.croppedImages[state.previewIndex];
      if (!img || !validateForUpload([img])) return;
      await executeUpload(img.blob);
    });

    elements.btnUploadVideo.addEventListener('click', async () => {
      if (!validateForUpload(state.croppedImages)) return;
      const audioLen = state.activeAudio ? state.activeAudio.pcmData.length / 32000 : 0;
      const uiFps = clamp(parseInt(elements.modalInputFps.value, 10) || 3, 1, 15);
      const fps = audioLen > 0 ? Math.max(0.001, state.croppedImages.length / audioLen) : uiFps;
      if (fps > 15) {
        alert(`Failed to build AVI: FPS (${fps.toFixed(1)}) exceeds the maximum limit of 15.`);
        return;
      }
      try {
        const aviBlob = await buildAviFile(state.croppedImages, state.badgeWidth, state.badgeHeight, fps, state.activeAudio?.pcmData);
        await executeUpload(aviBlob);
      } catch (e) {
        alert("Failed to build AVI: " + e.message);
      }
    });

    const handleSeekInput = (isStart) => {
      elements.seekStart.classList.toggle('is-front', isStart);
      elements.seekEnd.classList.toggle('is-front', !isStart);
      updateRangeUI();
      getMedia().currentTime = parseFloat((isStart ? elements.seekStart : elements.seekEnd).value) || 0;
      updatePosIndicator();
    };
    elements.seekStart.addEventListener('input', () => handleSeekInput(true));
    elements.seekEnd.addEventListener('input', () => handleSeekInput(false));

    const syncStartInput = (commit) => {
      const st = parseFloat(elements.inputStart.value);
      if (!commit && isNaN(st)) return;
      const clamped = clamp(st || 0, 0, parseFloat(elements.seekEnd.value) || 0);
      if (commit) elements.inputStart.value = clamped.toFixed(3);
      elements.seekStart.value = clamped;
      updateRangeUI(false);
      getMedia().currentTime = clamped;
      updatePosIndicator();
    };
    elements.inputStart.addEventListener('input', () => syncStartInput(false));
    elements.inputStart.addEventListener('change', () => syncStartInput(true));

    const syncDurationInput = (commit) => {
      const len = parseFloat(elements.inputDuration.value);
      if (!commit && isNaN(len)) return;
      const st = parseFloat(elements.seekStart.value) || 0;
      const maxLen = Math.max(0, (getMedia().duration || 0) - st);
      const clamped = clamp(len || 0, 0, maxLen);
      if (commit) elements.inputDuration.value = clamped.toFixed(3);
      elements.seekEnd.value = st + clamped;
      updateRangeUI(commit);
    };
    elements.inputDuration.addEventListener('input', () => syncDurationInput(false));
    elements.inputDuration.addEventListener('change', () => syncDurationInput(true));

    elements.inputTotal.addEventListener('change', () => {
      const tot = Math.max(0, parseFloat(elements.inputTotal.value) || 0);
      elements.inputTotal.value = tot.toFixed(3);
    });

    elements.btnPlay.addEventListener('click', () => {
      if (state.isAudioCrop && !elements.audioSource.src) return;
      const m = getMedia();
      if (m.paused) {
        const { st, ed } = getSeekBounds(m);
        if (m.currentTime < st || m.currentTime >= ed) m.currentTime = st;
        m.play();
      } else {
        m.pause();
      }
    });

    initCjpegli().then(mod => {
      elements.grpFilesize.classList.toggle('hidden-control', !mod);
      elements.grpQuality.classList.toggle('hidden-control', !!mod);
    });
    elements.selResolution.dispatchEvent(new Event('change'));
  };

  initApp();
</script>
</body>
</html>
