<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1e1e1e">
  <title>Web Badge</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0&display=swap" rel="stylesheet">
  <!-- <script src="cjpegli.js"></script> -->
  <style>
    :root {
      --color-bg: #f8f9fa;
      --color-surface: #ffffff;
      --color-text-main: #202124;
      --color-text-muted: #5f6368;
      --color-border: #dadce0;
      --color-input-bg: #ffffff;
      --color-crop-bg: #e8eaed;
      --color-mask-border: rgba(0, 0, 0, 0.2);
      --color-primary: #007bff;
      --color-danger: #dc3545;
      --state-hover: rgba(0, 0, 0, 0.05);
      --state-active: rgba(0, 0, 0, 0.1);
      --state-danger-hover: rgba(220, 53, 69, 0.1);
      --modal-bg: rgba(255, 255, 255, 0.95);
      --modal-btn: rgba(0, 0, 0, 0.05);
      --modal-btn-hover: rgba(0, 0, 0, 0.1);
      --modal-btn-active: rgba(0, 0, 0, 0.2);
      --shadow-xs: 0 2px 4px rgba(0, 0, 0, 0.15);
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
      --trans-fast: 0.1s ease;
      --trans-normal: 0.2s ease;
      --z-range-base: 4;
      --z-header: 10;
      --z-nav: 20;
      --z-modal: 100;
      --z-modal-ui: 101;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --color-bg: #121212;
        --color-surface: #1e1e1e;
        --color-text-main: #ffffff;
        --color-text-muted: #aaaaaa;
        --color-border: #333333;
        --color-input-bg: #333333;
        --color-crop-bg: #222222;
        --color-mask-border: rgba(255, 255, 255, 0.4);
        --color-primary: #4da3ff;
        --color-danger: #ff453a;
        --state-hover: rgba(255, 255, 255, 0.1);
        --state-active: rgba(255, 255, 255, 0.2);
        --state-danger-hover: rgba(255, 69, 58, 0.15);
        --modal-bg: rgba(0, 0, 0, 0.95);
        --modal-btn: rgba(255, 255, 255, 0.15);
        --modal-btn-hover: rgba(255, 255, 255, 0.25);
        --modal-btn-active: rgba(255, 255, 255, 0.35);
        --shadow-xs: 0 2px 4px rgba(0, 0, 0, 0.4);
        --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.5);
      }
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      inline-size: 100%;
      block-size: 100%;
      margin: 0;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      color: var(--color-text-main);
      font-family: system-ui, sans-serif;
      background-color: var(--color-bg);
      overflow: hidden;
      overscroll-behavior: none;
      user-select: none;
    }

    :is(.btn, select, input, .modal-overlay):focus-visible {
      outline: 2px solid var(--color-primary);
      outline-offset: 2px;
    }

    .push-right {
      margin-inline-start: auto;
    }

    .hidden-control {
      display: none !important;
    }

    .text-label {
      color: var(--color-text-muted);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    .app-layout {
      display: flex;
      flex-direction: column;
      block-size: 100dvh;
    }

    .tab-nav {
      z-index: var(--z-nav);
      display: flex;
      block-size: 48px;
      background-color: var(--color-surface);
      border-block-end: 1px solid var(--color-border);
    }

    .view-panel {
      display: none;
      flex: 1;
      flex-direction: column;
      overflow: hidden;

      &.active {
        display: flex;
      }
    }

    .header-toolbar {
      z-index: var(--z-header);
      display: flex;
      align-items: center;
      gap: 12px;
      padding-inline: 16px;
      block-size: 56px;
      background-color: var(--color-surface);
      border-block-end: 1px solid var(--color-border);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      background-color: transparent;
      border: none;
      cursor: pointer;
      transition: background-color var(--trans-normal), color var(--trans-normal), transform var(--trans-fast);

      &:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }

      &:not(:disabled, .btn-modal) {
        &:hover {
          background-color: var(--state-hover);
        }
        &:active {
          background-color: var(--state-active);
        }
      }
    }

    .btn-icon {
      inline-size: 44px;
      block-size: 44px;
      color: var(--color-text-main);
      border-radius: 50%;

      &.active-primary {
        color: var(--color-primary);
      }

      &.sm {
        inline-size: 36px;
        block-size: 36px;
      }
    }

    .btn-text {
      flex: 1;
      padding: 10px 16px;
      color: var(--color-text-main);
      font-size: 14px;
      font-weight: 500;
      background-color: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 4px;
    }

    .btn-tab {
      flex: 1;
      color: var(--color-text-muted);
      border-block-end: 2px solid transparent;

      &.active {
        color: var(--color-text-main);
        border-block-end-color: var(--color-text-main);
      }
    }

    :is(select, input[type="number"], input[type="checkbox"]) {
      padding: 6px 4px;
      color: var(--color-text-main);
      font-size: 14px;
      background-color: var(--color-input-bg);
      border: 1px solid var(--color-border);
      border-radius: 4px;
      outline: none;
    }

    input[type="number"] {
      inline-size: 54px;

      &.input-time {
        inline-size: 68px;
      }
    }

    input[type="checkbox"] {
      inline-size: 16px;
      block-size: 16px;
      margin: 0;
      cursor: pointer;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 6px;

      &.video-playback-row {
        gap: 12px;
        margin-block-end: 4px;
      }

      &.video-params-row {
        justify-content: space-between;
      }
    }

    .badge-controls {
      display: flex;
      flex-direction: column;
      padding: 16px;
      block-size: 100%;
      background-color: var(--color-surface);
      overflow: hidden;
    }

    #info-badge-header {
      font-size: 14px;
    }

    #text-mac-address {
      color: var(--color-text-muted);
      font-size: 12px;
      font-weight: normal;
    }

    .command-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-inline-size: 300px;
    }

    .command-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .select-command {
      padding: 8px;
      inline-size: 100px;
    }

    .crop-container {
      position: relative;
      display: flex;
      flex: 1;
      background-color: var(--color-crop-bg);
      overflow: hidden;
      touch-action: none;
    }

    :is(#img-source, #video-source, .crop-mask) {
      position: absolute;
      inset-block-start: 50%;
      inset-inline-start: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
    }

    :is(#img-source, #video-source) {
      opacity: 0;
      backface-visibility: hidden;
      will-change: transform;
      transition: opacity var(--trans-normal);

      &.loaded {
        opacity: 1;
      }
    }

    .crop-mask {
      border: 1px dashed var(--color-mask-border);
      border-radius: 50%;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
    }

    .video-controls {
      display: none;
      flex-direction: column;
      gap: 12px;
      padding: 12px 16px;
      background-color: var(--color-surface);
      border-block-end: 1px solid var(--color-border);

      &.active {
        display: flex;
      }
    }

    .range-slider-container {
      position: relative;
      display: flex;
      flex: 1;
      align-items: center;
      block-size: 24px;
    }

    :is(.range-track, .range-track-highlight) {
      position: absolute;
      block-size: 6px;
      border-radius: 3px;
    }

    .range-track {
      inline-size: 100%;
      background-color: var(--color-border);
    }

    .range-track-highlight {
      background-color: var(--color-primary);
      pointer-events: none;
    }

    .range-current-pos {
      position: absolute;
      z-index: calc(var(--z-range-base) + 1);
      inline-size: 14px;
      block-size: 14px;
      background-color: var(--color-danger);
      border: 2px solid var(--color-surface);
      border-radius: 50%;
      box-shadow: var(--shadow-xs);
      pointer-events: none;
      transform: translateX(-50%);
    }

    input[type="range"].dual-slider {
      position: absolute;
      inline-size: 100%;
      margin: 0;
      background-color: transparent;
      appearance: none;
      pointer-events: none;

      &::-webkit-slider-thumb {
        position: relative;
        z-index: var(--z-range-base);
        inline-size: 12px;
        block-size: 20px;
        background-color: var(--color-surface);
        border: 1px solid var(--color-border);
        border-radius: 6px;
        box-shadow: var(--shadow-xs), inset 0 0 0 2px var(--color-primary);
        appearance: none;
        cursor: ew-resize;
        pointer-events: auto;
        transition: box-shadow var(--trans-fast), transform var(--trans-fast);
      }

      &:active::-webkit-slider-thumb {
        z-index: calc(var(--z-range-base) + 2);
        box-shadow: var(--shadow-sm), inset 0 0 0 3px var(--color-primary);
        transform: scale(1.05);
      }
    }

    .thumbnail-footer {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-inline: 16px;
      block-size: 84px;
      background-color: var(--color-surface);
      border-block-start: 1px solid var(--color-border);
    }

    .thumbnail-list-inner {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      overflow-inline: auto;
      scrollbar-width: none;
    }

    .thumbnail-list-inner::-webkit-scrollbar {
      display: none;
    }

    .thumbnail-item {
      flex-shrink: 0;
      inline-size: 60px;
      block-size: 60px;
      border-radius: 4px;
      box-shadow: var(--shadow-sm);
      object-fit: cover;
      cursor: pointer;
      transition: transform var(--trans-normal);
      -webkit-user-drag: none;
    }

    .thumbnail-item:hover {
      transform: scale(1.05);
    }

    #btn-audio-thumb {
      transition: color var(--trans-normal);
    }

    #btn-audio-thumb.active {
      color: var(--color-primary);
    }

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-inline: 16px;
      block-size: 44px;
      font-size: 14px;
      background-color: var(--color-surface);
      border-block-start: 1px solid var(--color-border);
    }

    .status-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
    }

    .status-icon {
      color: var(--color-text-muted);
      font-size: 24px;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: var(--z-modal);
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--modal-bg);
      opacity: 0;
      visibility: hidden;
      outline: none;
      touch-action: none;
      transition: opacity 0.3s, visibility 0.3s;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-bar {
      position: absolute;
      inset-inline: 16px;
      z-index: var(--z-modal-ui);
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      pointer-events: none;
    }

    .modal-bar.top {
      inset-block-start: 16px;
    }

    .modal-bar.bottom {
      inset-block-end: 16px;
      align-items: flex-end;
    }

    .modal-bar .center {
      grid-column: 2;
      pointer-events: auto;
    }

    .modal-bar .right {
      grid-column: 3;
      justify-self: end;
      pointer-events: auto;
    }

    .modal-text {
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .modal-text.primary {
      max-inline-size: 200px;
      color: var(--color-text-main);
      font-size: 16px;
      font-weight: 600;
      line-height: 1.2;
    }

    .modal-text.secondary {
      color: var(--color-text-muted);
      font-size: 14px;
      line-height: 1.4;
      white-space: pre-line;
    }

    .btn-modal {
      background-color: var(--modal-btn);
      backdrop-filter: blur(4px);
    }

    .btn-modal:hover:not(:disabled) {
      background-color: var(--modal-btn-hover);
    }

    .btn-modal:active:not(:disabled),
    .btn-modal.simulate-active {
      background-color: var(--modal-btn-active);
      transform: scale(0.9);
    }

    .btn-modal.danger {
      color: var(--color-danger);
    }

    .btn-modal.danger:hover:not(:disabled) {
      background-color: var(--state-danger-hover);
    }

    .modal-content {
      display: grid;
      grid-template-areas:
        ". upload ."
        "prev img next"
        ". download ."
        "prog prog prog";
      align-items: center;
      justify-items: center;
      gap: 16px;
      pointer-events: none;
    }

    .modal-content > button, .modal-content > div {
      pointer-events: auto;
    }

    .upload-group {
      grid-area: upload;
      display: flex;
      gap: 16px;
      align-items: center;
      pointer-events: none;
    }

    .upload-group > button {
      pointer-events: auto;
    }

    .download-group {
      grid-area: download;
      display: flex;
      gap: 16px;
      pointer-events: none;
    }

    .download-group > button {
      pointer-events: auto;
    }

    #btn-prev { grid-area: prev; }
    #btn-next { grid-area: next; }

    #img-preview {
      grid-area: img;
      max-inline-size: 90vw;
      max-block-size: 55vh;
      box-shadow: var(--shadow-sm);
      object-fit: contain;
      pointer-events: auto;
      -webkit-user-drag: none;
    }

    .progress-container {
      display: none;
      grid-area: prog;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      inline-size: 80%;
      max-inline-size: 300px;
      pointer-events: none;
    }

    .progress-container.active {
      display: flex;
    }

    progress {
      inline-size: 100%;
      block-size: 6px;
      background-color: transparent;
      border-radius: 3px;
      appearance: none;
      overflow: hidden;
    }

    progress::-webkit-progress-bar {
      background-color: var(--color-border);
    }

    progress::-webkit-progress-value {
      background-color: var(--color-primary);
      transition: inline-size 0.1s linear;
    }

    .progress-text {
      color: var(--color-text-main);
      font-size: 13px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>

<div class="app-layout">
  <nav class="tab-nav">
    <button id="tab-badge" class="btn btn-tab active" title="Badge Control">
      <span class="material-symbols-outlined">watch</span>
    </button>
    <button id="tab-media" class="btn btn-tab" title="Media Processing">
      <span class="material-symbols-outlined">photo_library</span>
    </button>
  </nav>

  <div id="panel-badge" class="view-panel active">
    <header class="header-toolbar">
      <button id="btn-connect-ble" class="btn btn-icon" title="Connect/Disconnect Bluetooth">
        <span id="icon-ble" class="material-symbols-outlined">bluetooth</span>
      </button>
      <div id="info-badge-header" class="status-group hidden-control" title="Badge Info">
        <span id="text-badge-name" title="Badge Name"></span>
        <span id="text-mac-address" title="MAC Address"></span>
      </div>
      <button id="btn-debug" class="btn btn-icon push-right" title="Toggle Console Debug Logging">
        <span class="material-symbols-outlined">bug_report</span>
      </button>
    </header>

    <main class="badge-controls">
      <div class="command-panel">
        <div class="command-row">
            <button id="btn-set-lang" class="btn btn-text btn-badge-cmd" title="Set Badge Language" disabled>Language</button>
            <select id="sel-lang" class="select-command" title="Select Language">
              <option value="0x01">English</option>
              <option value="0x08">日本語</option>
            </select>
        </div>
        <button id="btn-call" class="btn btn-text btn-badge-cmd" title="Send Call Alert" disabled>Call</button>
        <button id="btn-check-storage" class="btn btn-text btn-badge-cmd" title="Check Free Space on Badge" disabled>Check Free Space</button>
      </div>
    </main>
  </div>

  <div id="panel-media" class="view-panel">
    <header class="header-toolbar">
      <button id="btn-open-file" class="btn btn-icon" title="Open Media File">
        <span class="material-symbols-outlined">folder_open</span>
      </button>
      <input type="file" id="input-file" accept="image/*,video/*,audio/*" hidden>

      <button id="btn-process" class="btn btn-icon" title="Crop and Process Media" disabled>
        <span class="material-symbols-outlined">crop</span>
      </button>

      <div class="control-group">
        <label for="sel-resolution" class="btn btn-icon" title="Select Target Resolution">
          <span class="material-symbols-outlined">aspect_ratio</span>
        </label>
        <select id="sel-resolution" title="Select Target Resolution">
          <option value="240">240px</option>
          <option value="360">360px</option>
        </select>
      </div>

      <div class="control-group hidden-control" id="grp-filesize">
        <label for="input-filesize" class="btn btn-icon" title="Target File Size (KiB)">
          <span class="material-symbols-outlined">compress</span>
        </label>
        <input type="number" id="input-filesize" min="1" max="39" step="1" value="20" title="Target File Size (KiB)">
        <span class="text-label" title="Target File Size (KiB)">KiB</span>
      </div>

      <div class="control-group" id="grp-quality">
        <label for="input-quality" class="btn btn-icon" title="JPEG Quality">
          <span class="material-symbols-outlined">high_quality</span>
        </label>
        <input type="number" id="input-quality" min="1" max="100" step="1" value="90" title="JPEG Quality">
      </div>
    </header>

    <main id="crop-area" class="crop-container" title="Drag to Pan, Scroll/Pinch to Zoom">
      <img id="img-source" decoding="async">
      <video id="video-source" playsinline></video>
      <audio id="audio-source"></audio>
      <div id="crop-mask" class="crop-mask"></div>
    </main>

    <div id="video-controls" class="video-controls">
      <div class="control-group video-playback-row">
        <button id="btn-play" class="btn btn-icon sm">
          <span id="icon-play" class="material-symbols-outlined">play_arrow</span>
        </button>
        <div class="range-slider-container" id="seek-container">
          <div class="range-track"></div>
          <div class="range-track-highlight" id="seek-highlight"></div>
          <div class="range-current-pos" id="seek-current-pos"></div>
          <input type="range" id="seek-start" class="dual-slider" min="0" max="100" step="0.001" value="0">
          <input type="range" id="seek-end" class="dual-slider" min="0" max="100" step="0.001" value="100">
        </div>
      </div>
      <div class="control-group video-params-row">
        <div class="control-group">
          <span class="text-label" title="Start Time (s)">Start(s)</span>
          <input type="number" id="input-start" class="input-time" min="0" step="0.001" value="0.000">
        </div>
        <div class="control-group">
          <span class="text-label" title="Duration (s)">Duration(s)</span>
          <input type="number" id="input-duration" class="input-time" min="0.000" step="0.001" value="0.000">
        </div>
        <div class="control-group hidden-control" id="grp-total">
          <span class="text-label" title="Total Time (s)">Total(s)</span>
          <input type="number" id="input-total" class="input-time" min="0.000" step="0.001" value="0.000">
        </div>
        <div class="control-group" id="grp-fps">
          <span class="text-label" title="Frames Per Second">FPS</span>
          <input type="number" id="input-fps" min="1" max="15" step="1" value="3">
        </div>
      </div>
    </div>
  </div>

  <footer class="thumbnail-footer">
    <button id="btn-import" class="btn btn-icon" title="Import processed JPG or WAV">
      <span class="material-symbols-outlined">library_add</span>
    </button>
    <input type="file" id="input-import" accept=".jpg,.jpeg,.wav" hidden>
    <div id="thumbnail-container" class="thumbnail-list-inner"></div>
    <button id="btn-audio-thumb" class="btn btn-icon" title="Audio Edit">
      <span class="material-symbols-outlined">edit_audio</span>
    </button>
  </footer>

  <div class="status-bar">
    <div class="status-group" title="Battery Level">
      <span id="icon-battery" class="material-symbols-outlined status-icon">battery_full</span>
      <span id="text-battery">--%</span>
    </div>
    <div class="status-group" title="Screen Size">
      <span class="material-symbols-outlined status-icon">aspect_ratio</span>
      <span id="text-screen-size">--x--</span>
    </div>
    <div class="status-group" title="Free Storage Space">
      <span id="text-storage">-- KiB</span>
      <span class="material-symbols-outlined status-icon">storage</span>
    </div>
  </div>
</div>

<div id="modal-preview" class="modal-overlay" tabindex="-1">
  <div class="modal-bar top">
    <div id="modal-filename" class="modal-text primary center" title="Frame Info"></div>
    <button id="btn-close" class="btn btn-icon btn-modal right" title="Close Overlay">
      <span class="material-symbols-outlined">close</span>
    </button>
  </div>

  <div class="modal-content">
    <div id="upload-group" class="upload-group">
      <button id="btn-upload-image" class="btn btn-icon btn-modal" title="Upload Image (JPEG)">
        <span class="material-symbols-outlined">image</span>

    <button id="btn-delete" class="btn btn-icon btn-modal danger right" title="Delete">
      <span class="material-symbols-outlined">delete</span>
    </button>
  </div>
</div>

<script type="module">
  const BLE_UUIDS = {
    SERVICE: '7e400001-b5a3-f393-e0a9-e50e24dcca9d',
    WRITE: '7e400002-b5a3-f393-e0a9-e50e24dcca9d',
    NOTIFY: '7e400003-b5a3-f393-e0a9-e50e24dcca9d'
  };
  const BLE_FRAME = { CMD: 0xCD, ACK: 0xDC };
  const BLE_CMD = { SYSTEM: 0x12, DEVICE: 0x1A, FILE: 0x1F, CTRL: 0x20 };

  const $ = (id) => document.getElementById(id);
  const pad = (num) => String(num).padStart(2, '0');
  const u32be = (v) => [(v >>> 24) & 0xFF, (v >>> 16) & 0xFF, (v >>> 8) & 0xFF, v & 0xFF];

  const elements = {
    tabBadge: $('tab-badge'),
    tabMedia: $('tab-media'),
    panelBadge: $('panel-badge'),
    btnConnectBle: $('btn-connect-ble'),
    iconBle: $('icon-ble'),
    infoBadgeHeader: $('info-badge-header'),
    textBadgeName: $('text-badge-name'),
    textMacAddress: $('text-mac-address'),
    btnDebug: $('btn-debug'),
    btnSetLang: $('btn-set-lang'),
    selLang: $('sel-lang'),
    btnCall: $('btn-call'),
    btnCheckStorage: $('btn-check-storage'),
    panelMedia: $('panel-media'),
    btnOpenFile: $('btn-open-file'),
    inputFile: $('input-file'),
    btnProcess: $('btn-process'),
    selResolution: $('sel-resolution'),
    inputFilesize: $('input-filesize'),
    grpFilesize: $('grp-filesize'),
    inputQuality: $('input-quality'),
    grpQuality: $('grp-quality'),
    cropArea: $('crop-area'),
    imgSource: $('img-source'),
    videoSource: $('video-source'),
    audioSource: $('audio-source'),
    cropMask: $('crop-mask'),
    videoControls: $('video-controls'),
    btnPlay: $('btn-play'),
    iconPlay: $('icon-play'),
    seekStart: $('seek-start'),
    seekEnd: $('seek-end'),
    seekHighlight: $('seek-highlight'),
    seekCurrentPos: $('seek-current-pos'),
    inputStart: $('input-start'),
    inputDuration: $('input-duration'),
    grpTotal: $('grp-total'),
    inputTotal: $('input-total'),
    grpFps: $('grp-fps'),
    inputFps: $('input-fps'),
    btnImport: $('btn-import'),
    inputImport: $('input-import'),
    thumbnailContainer: $('thumbnail-container'),
    btnAudioThumb: $('btn-audio-thumb'),
    iconBattery: $('icon-battery'),
    textBattery: $('text-battery'),
    textScreenSize: $('text-screen-size'),
    textStorage: $('text-storage'),
    modalPreview: $('modal-preview'),
    modalFilename: $('modal-filename'),
    btnClose: $('btn-close'),
    uploadGroup: $('upload-group'),
    btnUploadImage: $('btn-upload-image'),
    btnUploadVideo: $('btn-upload-video'),
    modalFpsGroup: $('modal-fps-group'),
    modalInputFps: $('modal-input-fps'),
    btnPrev: $('btn-prev'),
    imgPreview: $('img-preview'),
    btnNext: $('btn-next'),
    btnDownload: $('btn-download'),
    btnDownloadZip: $('btn-download-zip'),
    progressContainer: $('progress-container'),
    progressBar: $('progress-bar'),
    progressText: $('progress-text'),
    modalFilesize: $('modal-filesize'),
    btnDelete: $('btn-delete')
  };

  const state = {
    isDebug: false,
    isVideo: false,
    isAudioCrop: false,
    badgeWidth: 0,
    badgeHeight: 0,
    maxBlockSize: 0,
    scale: 1,
    x: 0,
    y: 0,
    initialScale: 1,
    initialX: 0,
    initialY: 0,
    pointers: new Map(),
    isPanning: false,
    startX: 0,
    startY: 0,
    pinchDist: 0,
    sourceAudioBuffer: null,
    tempVideoAudioBuffer: null,
    activeAudio: null,
    croppedImages: [],
    previewIndex: -1
  };

  let bluetoothBadge = null;
  let charWrite = null;
  let charNotify = null;
  let rafId = null;
  let cjpegliPromise = null;
  let pendingChunkReq = null;
  let modalTouchX = 0;
  let modalTouchY = 0;
  const pendingRequests = {};

  let cachedCanvas = null;
  let cachedCtx = null;
  let cachedRes = 0;

  const decodeAudio = async (buf) => {
    const ctx = new OfflineAudioContext(1, 1, 16000);
    return await ctx.decodeAudioData(buf);
  };

  const getTimestamp = () => {
    const d = new Date();
    const ms = String(d.getMilliseconds()).padStart(3, '0');
    return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}_${ms}`;
  };

  const logDebug = (msg) => {
    if (state.isDebug) console.log(`[${new Date().toISOString()}] ${msg}`);
  };

  const toHex = (buf) => {
    const hex = Array.from(buf).map(b => b.toString(16).padStart(2, '0').toUpperCase()).join(' ');
    return hex.length > 96 ? hex.substring(0, 96) + '...' : hex;
  };

  const calcChecksum8 = (buf) => buf.reduce((sum, byte) => (sum + byte) >>> 0, 0);

  const calcChecksum32 = (val) => ((val >>> 24) & 0xFF) + ((val >>> 16) & 0xFF) + ((val >>> 8) & 0xFF) + (val & 0xFF);

  const simulateClick = (id) => {
    const btn = $(id);
    if (!btn || btn.disabled || btn.classList.contains('hidden-control') || btn.style.visibility === 'hidden') return;
    btn.classList.add('simulate-active');
    setTimeout(() => btn.classList.remove('simulate-active'), 150);
    btn.click();
  };

  const setUILock = (locked) => {
    elements.btnOpenFile.disabled = locked;
    elements.btnImport.disabled = locked;
    elements.tabBadge.disabled = locked;
    elements.tabMedia.disabled = locked;
  };

  const waitForPacket = (prefix, cls, sub, timeoutMs) => new Promise((resolve, reject) => {
    const key = `${prefix}_${cls}_${sub}`;
    if (pendingRequests[key]) pendingRequests[key].reject(new Error('Cancelled'));
    const timer = setTimeout(() => {
      delete pendingRequests[key];
      reject(new Error(`${prefix.toUpperCase()} Timeout (${cls.toString(16)} ${sub?.toString(16)})`));
    }, timeoutMs);
    pendingRequests[key] = {
      resolve: (data) => {
        clearTimeout(timer);
        delete pendingRequests[key];
        resolve(data);
      },
      reject: (err) => {
        clearTimeout(timer);
        delete pendingRequests[key];
        reject(err);
      },
      clear: () => {
        clearTimeout(timer);
        delete pendingRequests[key];
      }
    };
  });

  const waitForAck = (cls, sub) => waitForPacket('ack', cls, sub, 3000);
  const waitForData = (cls, sub) => waitForPacket('data', cls, sub, 5000);

  const waitForChunkCtrl = (expectedCode, timeoutMs = 10000) => new Promise((resolve, reject) => {
    const timer = setTimeout(() => {
      pendingChunkReq = null;
      reject(new Error(`Chunk Timeout (Expected: ${expectedCode})`));
    }, timeoutMs);
    pendingChunkReq = {
      expectedCode,
      resolve: () => {
        clearTimeout(timer);
        pendingChunkReq = null;
        resolve();
      },
      reject: (err) => {
        clearTimeout(timer);
        pendingChunkReq = null;
        reject(err);
      }
    };
  });

  const buildFrame = (cls, sub, payload = []) => {
    const len = 5 + payload.length;
    const buf = new Uint8Array(len + 3);
    buf[0] = BLE_FRAME.CMD;
    buf[1] = (len >>> 8) & 0xFF;
    buf[2] = len & 0xFF;
    buf[3] = cls;
    buf[4] = 0x01;
    buf[5] = sub;
    buf[6] = (payload.length >>> 8) & 0xFF;
    buf[7] = payload.length & 0xFF;
    buf.set(payload, 8);
    return buf;
  };

  const writePacket = async (buf) => {
    if (!charWrite) throw new Error("Bluetooth not connected");
    logDebug(`[TX] ${toHex(buf)}`);
    for (let i = 0; i < buf.length; i += 487) {
      await charWrite.writeValueWithoutResponse(buf.slice(i, i + 487));
    }
  };

  const sendAck = async (cls, sub, len) => {
    await writePacket(new Uint8Array([BLE_FRAME.ACK, 0x00, 0x05, cls, sub, (len >>> 8) & 0xFF, len & 0xFF, 0x01]));
  };

  const sendCmd = async (cls, sub, payload = []) => {
    const p = waitForAck(cls, sub);
    try {
      await writePacket(buildFrame(cls, sub, payload));
      await p;
    } catch (e) {
      pendingRequests[`ack_${cls}_${sub}`]?.clear();
      throw e;
    }
  };

  const reqData = async (cls, sub, payload = []) => {
    const pData = waitForData(cls, sub);
    try {
      await writePacket(buildFrame(cls, sub, payload));
      if (cls === BLE_CMD.CTRL) return await pData;
      const pAck = waitForAck(cls, sub);
      await Promise.race([pAck, pData]);
      pendingRequests[`ack_${cls}_${sub}`]?.clear();
      return await pData;
    } catch (e) {
      pendingRequests[`data_${cls}_${sub}`]?.clear();
      pendingRequests[`ack_${cls}_${sub}`]?.clear();
      throw e;
    }
  };

  const handleAckEvent = (val) => {
    if (val.length < 8) return;
    const cls = val[3];
    const sub = val[4];
    const req = pendingRequests[`ack_${cls}_${sub}`];
    if (!req) return;
    val[7] === 0x01 ? req.resolve() : req.reject(new Error(`ACK Error: ${val[7]}`));
  };

  const handleDataEvent = async (val) => {
    if (val.length < 8) return;
    const frameLen = (val[1] << 8) | val[2];
    const payloadLen = (val[6] << 8) | val[7];
    if (frameLen !== payloadLen + 5 || val.length < 8 + payloadLen) return;
    const cls = val[3];
    const sub = val[5];
    const payload = val.slice(8, 8 + payloadLen);
    await sendAck(cls, sub, frameLen + 3);
    pendingRequests[`data_${cls}_${sub}`]?.resolve(payload);

    if (cls === BLE_CMD.CTRL && sub === 0x04 && payload.length >= 8) {
      const storageBytes = ((payload[4] << 24) | (payload[5] << 16) | (payload[6] << 8) | payload[7]) >>> 0;
      elements.textStorage.textContent = `${(storageBytes / 1024).toFixed(0)} KiB`;
      return;
    }

    if (cls === BLE_CMD.CTRL && sub === 0x01 && payload.length >= 4 && pendingChunkReq) {
      const code = ((payload[0] << 24) | (payload[1] << 16) | (payload[2] << 8) | (payload[3])) >>> 0;
      code === pendingChunkReq.expectedCode ? pendingChunkReq.resolve() : pendingChunkReq.reject(new Error(`Transfer Rejected: Code ${code}`));
    }
  };

  const onBleNotification = async (e) => {
    const val = new Uint8Array(e.target.value.buffer);
    if (val.length === 0) return;
    logDebug(`[RX] ${toHex(val)}`);
    val[0] === BLE_FRAME.ACK ? handleAckEvent(val) : await handleDataEvent(val);
  };

  const setBadgeControlState = (enabled) => {
    document.querySelectorAll('.btn-badge-cmd').forEach(btn => btn.disabled = !enabled);
    elements.btnConnectBle.classList.toggle('active-primary', enabled);
    elements.iconBle.textContent = enabled ? 'bluetooth_connected' : 'bluetooth';
    elements.infoBadgeHeader.classList.toggle('hidden-control', !enabled);
  };

  const onBadgeDisconnected = () => {
    logDebug("Badge disconnected.");
    setBadgeControlState(false);
    charWrite = null;
    charNotify = null;
    state.badgeWidth = 0;
    state.badgeHeight = 0;
    state.maxBlockSize = 0;
    elements.textBadgeName.textContent = '';
    elements.textMacAddress.textContent = '';
    elements.iconBattery.textContent = 'battery_full';
    elements.textBattery.textContent = '--%';
    elements.textScreenSize.textContent = '--x--';
    elements.textStorage.textContent = '-- KiB';
    Object.keys(pendingRequests).forEach(k => pendingRequests[k]?.reject(new Error("Badge disconnected")));
    if (pendingChunkReq) {
      pendingChunkReq.reject(new Error("Badge disconnected"));
      pendingChunkReq = null;
    }
  };

  const setupSecondaryNotifications = async (service) => {
    try {
      const secChar = await service.getCharacteristic('7e400004-b5a3-f393-e0a9-e50e24dcca9d');
      await secChar.startNotifications();
    } catch (e) {
      logDebug("Secondary notifications unavailable.");
    }
  };

  const setupBatteryService = async (server) => {
    try {
      const batSvc = await server.getPrimaryService('battery_service');
      const batChar = await batSvc.getCharacteristic('battery_level');
      const updateBat = (val) => {
        elements.textBattery.textContent = `${val}%`;
        const step = Math.min(6, Math.floor(val / 15));
        elements.iconBattery.textContent = val >= 95 ? 'battery_full' : `battery_${step}_bar`;
      };
      const initialVal = await batChar.readValue();
      updateBat(initialVal.getUint8(0));
      await batChar.startNotifications();
      batChar.addEventListener('characteristicvaluechanged', e => updateBat(e.target.value.getUint8(0)));
    } catch (e) {
      logDebug("Battery Service unavailable.");
    }
  };

  const execInitSequence = async () => {
    try {
      const d = new Date();
      const packed = ((Math.max(0, d.getFullYear() - 2000) & 0x3F) << 26)
                   | (((d.getMonth() + 1) & 0x0F) << 22)
                   | ((d.getDate() & 0x1F) << 17)
                   | ((d.getHours() & 0x1F) << 12)
                   | ((d.getMinutes() & 0x3F) << 6)
                   | (d.getSeconds() & 0x3F);
      await sendCmd(BLE_CMD.SYSTEM, 0x01, new Uint8Array(u32be(packed)));
      const mac = await reqData(BLE_CMD.DEVICE, 0x0A);
      if (mac.length >= 6) {
        elements.textMacAddress.textContent = `(${Array.from(mac).map(b => b.toString(16).padStart(2,'0').toUpperCase()).join(':')})`;
      }
      const name = await reqData(BLE_CMD.DEVICE, 0x0C);
      if (name.length >= 1) elements.textBadgeName.textContent = new TextDecoder().decode(name.slice(1));
      const ctrlDevInfo = await reqData(BLE_CMD.CTRL, 0x02);
      if (ctrlDevInfo.length >= 32 && ctrlDevInfo[0] === 0x01) {
        state.badgeWidth = (ctrlDevInfo[2] << 8) | ctrlDevInfo[3];
        state.badgeHeight = (ctrlDevInfo[4] << 8) | ctrlDevInfo[5];
        elements.textScreenSize.textContent = `${state.badgeWidth}x${state.badgeHeight}`;
        state.maxBlockSize = (ctrlDevInfo[30] << 8) | ctrlDevInfo[31];
      }
      await reqData(BLE_CMD.CTRL, 0x04);
    } catch (e) {
      logDebug(`Init Error: ${e.message}`);
    }
  };

  const connectAndInitBadge = async () => {
    bluetoothBadge = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: [BLE_UUIDS.SERVICE, 'battery_service']
    });
    bluetoothBadge.addEventListener('gattserverdisconnected', onBadgeDisconnected, { once: true });
    const server = await bluetoothBadge.gatt.connect();
    const service = await server.getPrimaryService(BLE_UUIDS.SERVICE);
    charWrite = await service.getCharacteristic(BLE_UUIDS.WRITE);
    charNotify = await service.getCharacteristic(BLE_UUIDS.NOTIFY);
    await charNotify.startNotifications();
    charNotify.addEventListener('characteristicvaluechanged', onBleNotification);
    setBadgeControlState(true);
    await setupSecondaryNotifications(service);
    await setupBatteryService(server);
    await execInitSequence();
  };

  const initiateFileTransfer = async (size, fileType) => {
    const sid = Math.floor(Math.random() * 0xFFFFFFFF);
    const dSize = size + 4;
    const initPayload = new Uint8Array([
      ...u32be(sid),
      fileType, 0x08, 0, 0, 0,
      ...u32be(dSize),
      0, 0, 0, 0
    ]);
    const p = waitForChunkCtrl(1000);
    await writePacket(buildFrame(BLE_CMD.FILE, 0x02, initPayload));
    await p;
  };

  const sendFileChunk = async (chunkIndex, blockData, totalSize, cs32, currentSum) => {
    const isFirst = chunkIndex === 1;
    const hEnd = isFirst ? 14 : 10;
    const fLen = 5 + (hEnd - 8) + blockData.length + 4;
    const frame = new Uint8Array(fLen + 3);
    frame.set([
      BLE_FRAME.CMD,
      (fLen >>> 8) & 0xFF, fLen & 0xFF,
      BLE_CMD.FILE, 0x01, 0x01,
      ((fLen - 5) >>> 8) & 0xFF, (fLen - 5) & 0xFF,
      (chunkIndex >>> 8) & 0xFF, chunkIndex & 0xFF
    ]);
    if (isFirst) frame.set(u32be(totalSize), 10);
    frame.set(blockData, hEnd);
    const bCS = calcChecksum8(blockData);
    const newSum = (currentSum + bCS) >>> 0;
    const tVal = (isFirst ? (bCS + cs32 + 1) : (bCS + chunkIndex)) >>> 0;
    frame.set(u32be(tVal), hEnd + blockData.length);
    const pChunk = waitForChunkCtrl(1000 + chunkIndex);
    await writePacket(frame);
    await pChunk;
    return newSum;
  };

  const transferFileToBadge = async (blob, onProgress) => {
    const buf = new Uint8Array(await blob.arrayBuffer());
    const size = buf.length;
    const blocks = [];
    let offset = 0;
    let bid = 1;
    while (offset < size) {
      const len = Math.min(size - offset, bid === 1 ? state.maxBlockSize - 4 : state.maxBlockSize);
      blocks.push(buf.slice(offset, offset + len));
      offset += len;
      bid++;
    }
    if (onProgress) onProgress(0, blocks.length);
    await initiateFileTransfer(size, blob.type === 'video/avi' ? 0x01 : 0x02);
    let sum = 0;
    const cs32 = calcChecksum32(size);
    for (let k = 1; k <= blocks.length; k++) {
      sum = await sendFileChunk(k, blocks[k - 1], size, cs32, sum);
      if (onProgress) onProgress(k, blocks.length);
    }
    const vCS = (sum + cs32) >>> 0;
    await writePacket(buildFrame(BLE_CMD.FILE, 0x03, new Uint8Array(u32be(vCS))));
    await waitForChunkCtrl(0x0002);
  };

  const buildAviFile = async (croppedImages, width, height, fps = 3, audioData = null) => {
    const frames = await Promise.all(croppedImages.map(async (img) => {
      const buf = new Uint8Array(await img.blob.arrayBuffer());
      const pad = buf.length % 2 !== 0 ? 1 : 0;
      return { buf, pad, size: buf.length + pad };
    }));
    const hasAudio = audioData && audioData.length > 0;
    const interleaved = [];
    let audioBytesGenerated = 0;
    const microSecPerFrame = Math.round(1000000 / fps);
    const dwScale = 1000;
    const dwRate = Math.max(1, Math.round(fps * dwScale));
    const audioBytesPerSec = 32000;
    const totalAudioBytes = hasAudio ? audioData.length : 0;
    for (let v = 0; v < frames.length; v++) {
      interleaved.push({ type: 'video', frame: frames[v] });
      if (hasAudio) {
        const targetAudioBytes = Math.floor(totalAudioBytes * (v + 1) / frames.length) & ~1;
        while (audioBytesGenerated < targetAudioBytes) {
          let chunkSize = targetAudioBytes - audioBytesGenerated;
          chunkSize = Math.min(chunkSize, audioData.length - audioBytesGenerated);
          if (chunkSize <= 0) break;
          if (chunkSize > 684) chunkSize = 684;
          if (chunkSize % 2 !== 0) chunkSize--;
          if (chunkSize > 0) {
            interleaved.push({ type: 'audio', size: chunkSize, buf: audioData.slice(audioBytesGenerated, audioBytesGenerated + chunkSize) });
            audioBytesGenerated += chunkSize;
          } else {
            break;
          }
        }
      }
    }
    const maxVideoSize = frames.reduce((max, f) => Math.max(max, f.size), 0);
    const maxAudioSize = hasAudio ? 684 : 0;
    const maxBytesPerSec = Math.floor(maxVideoSize * fps) + (hasAudio ? audioBytesPerSec : 0);
    const suggestedBufferSize = maxVideoSize + maxAudioSize;
    const estSize = 15000 + frames.reduce((sum, f) => sum + f.size, 0) + totalAudioBytes + (interleaved.length * 24);
    const data = new Uint8Array(estSize);
    const dv = new DataView(data.buffer);
    let pos = 0;
    const write4CC = (s) => { for(let i=0; i<4; i++) dv.setUint8(pos++, s.charCodeAt(i)); };
    const writeU32 = (v) => { dv.setUint32(pos, v, true); pos += 4; };
    const writeU16 = (v) => { dv.setUint16(pos, v, true); pos += 2; };
    const writeZeros = (len) => { pos += len; };
    const writeData = (buf) => { data.set(buf, pos); pos += buf.length; };
    write4CC('RIFF');
    const riffSizePos = pos;
    writeU32(0); write4CC('AVI '); write4CC('LIST');
    const hdrlSizePos = pos;
    writeU32(0); write4CC('hdrl'); write4CC('avih');
    writeU32(56); writeU32(microSecPerFrame); writeU32(maxBytesPerSec);
    writeU32(0); writeU32(0x0910); writeU32(frames.length); writeU32(0);
    writeU32(hasAudio ? 2 : 1); writeU32(suggestedBufferSize); writeU32(width); writeU32(height);
    writeZeros(16); write4CC('LIST');
    const vStrlSizePos = pos;
    writeU32(0); write4CC('strl'); write4CC('strh'); writeU32(56);
    write4CC('vids'); write4CC('MJPG'); writeU32(0); writeU16(0); writeU16(0);
    writeU32(0); writeU32(dwScale); writeU32(dwRate); writeU32(0); writeU32(frames.length);
    writeU32(maxVideoSize); writeU32(0xFFFFFFFF); writeU32(0); writeU16(0); writeU16(0);
    writeU16(width); writeU16(height); write4CC('strf'); writeU32(40);
    writeU32(40); writeU32(width); writeU32(height); writeU16(1); writeU16(24);
    write4CC('MJPG'); writeU32(maxVideoSize); writeU32(0); writeU32(0); writeU32(0); writeU32(0);
    dv.setUint32(vStrlSizePos, pos - vStrlSizePos - 4, true);
    if (hasAudio) {
      write4CC('LIST');
      const aStrlSizePos = pos;
      writeU32(0); write4CC('strl'); write4CC('strh'); writeU32(56);
      write4CC('auds'); writeU32(0); writeU32(0); writeU16(0); writeU16(0);
      writeU32(0); writeU32(1); writeU32(16000); writeU32(0); writeU32(totalAudioBytes / 2);
      writeU32(maxAudioSize); writeU32(0xFFFFFFFF); writeU32(2); writeZeros(8);
      write4CC('strf'); writeU32(18); writeU16(1); writeU16(1); writeU32(16000);
      writeU32(32000); writeU16(2); writeU16(16); writeU16(0);
      dv.setUint32(aStrlSizePos, pos - aStrlSizePos - 4, true);
    }
    dv.setUint32(hdrlSizePos, pos - hdrlSizePos - 4, true);
    write4CC('LIST');
    const moviSizePos = pos;
    writeU32(0);
    const moviFourccPos = pos;
    write4CC('movi');
    const indexEntries = [];
    for (const item of interleaved) {
      const chunkOffset = pos - moviFourccPos;
      if (item.type === 'video') {
        write4CC('00dc'); writeU32(item.frame.buf.length); writeData(item.frame.buf);
        if (item.frame.pad) writeZeros(1);
        indexEntries.push({ id: '00dc', flags: 0x10, offset: chunkOffset, size: item.frame.buf.length });
      } else {
        write4CC('01wb'); writeU32(item.size);
        item.buf ? writeData(item.buf) : writeZeros(item.size);
        indexEntries.push({ id: '01wb', flags: 0x10, offset: chunkOffset, size: item.size });
      }
    }
    dv.setUint32(moviSizePos, pos - moviSizePos - 4, true);
    write4CC('idx1'); writeU32(indexEntries.length * 16);
    for (const entry of indexEntries) {
      write4CC(entry.id); writeU32(entry.flags); writeU32(entry.offset); writeU32(entry.size);
    }
    dv.setUint32(riffSizePos, pos - 8, true);
    return new Blob([data.slice(0, pos)], { type: 'video/avi' });
  };

  const createZip = (files) => {
    let cdSize = 0, lfSize = 0;
    const crcTable = new Uint32Array(256);
    for (let i = 0; i < 256; i++) {
      let c = i;
      for (let j = 0; j < 8; j++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
      crcTable[i] = c;
    }
    const encoder = new TextEncoder();
    const filesData = files.map(f => {
      const nameBuf = encoder.encode(f.name);
      let crc = ~0 >>> 0;
      const d = f.data;
      const len = d.length;
      for (let j = 0; j < len; j++) {
        crc = crcTable[(crc ^ d[j]) & 0xff] ^ (crc >>> 8);
      }
      const finalCrc = (~crc) >>> 0;
      lfSize += 30 + nameBuf.length + f.data.length;
      cdSize += 46 + nameBuf.length;
      return { ...f, nameBuf, crc: finalCrc };
    });
    const out = new Uint8Array(lfSize + cdSize + 22);
    const dv = new DataView(out.buffer);
    let p = 0;
    for (const f of filesData) {
      f.offset = p;
      dv.setUint32(p, 0x04034b50, true); dv.setUint16(p + 4, 10, true);
      dv.setUint16(p + 8, 0, true); dv.setUint32(p + 14, f.crc, true);
      dv.setUint32(p + 18, f.data.length, true); dv.setUint32(p + 22, f.data.length, true);
      dv.setUint16(p + 26, f.nameBuf.length, true);
      out.set(f.nameBuf, p + 30); out.set(f.data, p + 30 + f.nameBuf.length);
      p += 30 + f.nameBuf.length + f.data.length;
    }
    const cdStart = p;
    for (const f of filesData) {
      dv.setUint32(p, 0x02014b50, true); dv.setUint16(p + 4, 10, true);
      dv.setUint16(p + 6, 10, true); dv.setUint32(p + 16, f.crc, true);
      dv.setUint32(p + 20, f.data.length, true); dv.setUint32(p + 24, f.data.length, true);
      dv.setUint16(p + 28, f.nameBuf.length, true); dv.setUint32(p + 42, f.offset, true);
      out.set(f.nameBuf, p + 46);
      p += 46 + f.nameBuf.length;
    }
    dv.setUint32(p, 0x06054b50, true); dv.setUint16(p + 8, files.length, true);
    dv.setUint16(p + 10, files.length, true); dv.setUint32(p + 12, cdSize, true);
    dv.setUint32(p + 16, cdStart, true);
    return new Blob([out], { type: 'application/zip' });
  };

  const drawToCanvas = async (source, res) => {
    const bmp = await createImageBitmap(source);
    try {
      if (cachedRes !== res || !cachedCanvas) {
        cachedCanvas = new OffscreenCanvas(res, res);
        cachedCtx = cachedCanvas.getContext('2d');
        cachedRes = res;
      }
      const ctx = cachedCtx;
      const cvs = cachedCanvas;
      ctx.imageSmoothingQuality = 'high';
      ctx.fillStyle = 'black';
      ctx.fillRect(0, 0, res, res);
      ctx.beginPath();
      ctx.arc(res / 2, res / 2, (res + 16) / 2, 0, Math.PI * 2);
      ctx.clip();
      const dSize = res + 16;
      const sArea = dSize / state.scale;
      const sx = (bmp.width / 2) - (state.x / state.scale) - sArea / 2;
      const sy = (bmp.height / 2) - (state.y / state.scale) - sArea / 2;
      ctx.drawImage(bmp, sx, sy, sArea, sArea, -8, -8, dSize, dSize);
      return { cvs, ctx };
    } finally {
      bmp.close();
    }
  };

  const generatePamImageAsync = async (source, res) => {
    const { ctx } = await drawToCanvas(source, res);
    const imgData = ctx.getImageData(0, 0, res, res);
    const hdr = new TextEncoder().encode(`P7\nWIDTH ${res}\nHEIGHT ${res}\nDEPTH 3\nMAXVAL 255\nTUPLTYPE RGB\nENDHDR\n`);
    const pam = new Uint8Array(hdr.length + res * res * 3);
    pam.set(hdr);
    let p = hdr.length;
    for (let i = 0; i < imgData.data.length; i += 4) {
      pam[p++] = imgData.data[i]; pam[p++] = imgData.data[i+1]; pam[p++] = imgData.data[i+2];
    }
    return pam;
  };

  const processFrameCjpegli = async (mod, source, res, targetSizeKb) => {
    const pam = await generatePamImageAsync(source, res);
    mod.FS.writeFile('in.pam', pam);
    let jpg = null;
    try {
      mod.callMain(['in.pam', 'out.jpg', '-p', '0', '--target_size', Math.round(Math.max(1, targetSizeKb) * 1024).toString(), '--std_quant']);
      jpg = mod.FS.readFile('out.jpg');
    } catch (e) {
      logDebug(`cjpegli Process Error: ${e.message}`);
      cjpegliPromise = null;
    } finally {
      try { mod.FS.unlink('in.pam'); mod.FS.unlink('out.jpg'); } catch (e) {}
    }
    return jpg ? new Blob([jpg], { type: 'image/jpeg' }) : null;
  };

  const initCjpegli = async () => {
    if (!window.createCjpegli) return null;
    try {
      cjpegliPromise ??= window.createCjpegli();
      return await cjpegliPromise;
    } catch (e) {
      logDebug(`cjpegli Init Error: ${e.message}`);
      cjpegliPromise = null;
      return null;
    }
  };

  const processSingleFrame = async (source, res, targetSize, quality) => {
    const mod = await initCjpegli();
    if (mod) return await processFrameCjpegli(mod, source, res, targetSize);
    const { cvs } = await drawToCanvas(source, res);
    return await cvs.convertToBlob({ type: 'image/jpeg', quality });
  };

  const createPcmWav = async (audioBuffer, startOffset = 0, duration = null, totalDuration = null) => {
    const dur = duration ?? audioBuffer.duration;
    const tot = totalDuration ?? dur;
    const offCtx = new OfflineAudioContext(1, Math.max(1, Math.ceil(tot * 16000)), 16000);
    if (dur > 0 && audioBuffer) {
      const safeStart = Math.min(startOffset, audioBuffer.duration - 0.001);
      const safeDur = Math.min(dur, audioBuffer.duration - safeStart);
      const src = offCtx.createBufferSource();
      src.buffer = audioBuffer;
      src.connect(offCtx.destination);
      src.start(0, safeStart, safeDur);
    }
    const rbuf = await offCtx.startRendering();
    const ch = rbuf.getChannelData(0);
    const pcm = new Int16Array(ch.length);
    for (let j = 0; j < ch.length; j++) {
      let s = Math.max(-1, Math.min(1, ch[j]));
      pcm[j] = s < 0 ? s * 0x8000 : s * 0x7FFF;
    }
    const pcmData = new Uint8Array(pcm.buffer);
    const wav = new ArrayBuffer(44);
    const dv = new DataView(wav);
    const ws = (p, s) => { for(let i=0; i<s.length; i++) dv.setUint8(p+i, s.charCodeAt(i)); };
    ws(0, 'RIFF'); dv.setUint32(4, 36 + pcmData.length, true);
    ws(8, 'WAVE'); ws(12, 'fmt '); dv.setUint32(16, 16, true);
    dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
    dv.setUint32(24, 16000, true); dv.setUint32(28, 32000, true);
    dv.setUint16(32, 2, true); dv.setUint16(34, 16, true);
    ws(36, 'data'); dv.setUint32(40, pcmData.length, true);
    return { pcmData, blob: new Blob([wav, pcmData], { type: 'audio/wav' }), rbuf };
  };

    let bottomText = `${item.filename}\nImage ${item.res}x${item.res} ${(item.size/1024).toFixed(1)} KiB`;

      const uiFps = Math.max(1, Math.min(15, parseInt(elements.modalInputFps.value, 10) || 3));
      const overhead = 15000 + (fileCount * 24);
      const estSize = ((state.croppedImages.reduce((s, img) => s + img.blob.size, 0) + overhead) / 1024).toFixed(1);

  const openModal = (index) => {

  const renderThumbs = () => {

  const loadMediaFile = (file) => {
    pauseMedia();
    elements.btnProcess.disabled = true;
    elements.imgSource.classList.remove('loaded');

    revokeMediaUrl(elements.imgSource);
    revokeMediaUrl(elements.videoSource);
    revokeMediaUrl(elements.audioSource);

    state.isVideo = file.type.startsWith('video/');

  const handlePointerDown = (e) => {

    state.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

      state.y = state.initialY + (e.clientY - state.startY);

    } else if (pts.length === 2 && state.pinchDist > 0) {

  };

      state.startX = pt.x; state.startY = pt.y;
      state.initialX = state.x; state.initialY = state.y;
      state.isPanning = true;
    } else {
      state.isPanning = false;
    }
  };

  const handleKeydown = (e) => {

      const acts = { Escape: 'btn-close', Delete: 'btn-delete', Backspace: 'btn-delete', ArrowLeft: 'btn-prev', ArrowRight: 'btn-next', ArrowDown: 'btn-download' };
      let targetId = acts[e.key];
      if (e.key === 'ArrowUp') targetId = (e.shiftKey && state.activeAudio && state.croppedImages.length > 0) ? 'btn-upload-video' : 'btn-upload-image';
      if (targetId) { simulateClick(targetId); e.preventDefault(); }
      return;
    }
    if (!elements.panelMedia.classList.contains('active') || elements.btnProcess.disabled || state.isAudioCrop || ['INPUT', 'SELECT'].includes(document.activeElement?.tagName)) return;
    const acts = {
      ArrowUp: () => state.y -= 20, ArrowDown: () => state.y += 20,
      ArrowLeft: () => state.x -= 20, ArrowRight: () => state.x += 20,
      PageUp: () => { state.scale *= 1.1; state.x *= 1.1; state.y *= 1.1; },
      PageDown: () => { state.scale /= 1.1; state.x /= 1.1; state.y /= 1.1; }

  const initApp = () => {

    elements.tabMedia.addEventListener('click', () => switchTab(true));

    elements.btnConnectBle.addEventListener('click', async () => {

    });
    elements.btnDebug.addEventListener('click', () => { state.isDebug = !state.isDebug; elements.btnDebug.classList.toggle('active-primary', state.isDebug); });
    elements.btnSetLang.addEventListener('click', async () => { try { await sendCmd(BLE_CMD.SYSTEM, 0x15, [parseInt(elements.selLang.value)]); } catch (e) { logDebug(`Command Error: ${e.message}`); } });
    elements.btnCall.addEventListener('click', async () => { try { await sendCmd(BLE_CMD.SYSTEM, 0x0B, [0x01]); } catch (e) { logDebug(`Command Error: ${e.message}`); } });
    elements.btnCheckStorage.addEventListener('click', async () => { try { await reqData(BLE_CMD.CTRL, 0x04); } catch (e) { logDebug(`Command Error: ${e.message}`); } });

    elements.btnOpenFile.addEventListener('click', () => elements.inputFile.click());
    elements.inputFile.addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file || file.type.includes('svg')) return e.target.value = '';
      e.target.value = '';
      loadMediaFile(file);
    });

    elements.btnProcess.addEventListener('click', async () => {
      if (elements.btnProcess.disabled) return;
      elements.btnProcess.disabled = true;
      setUILock(true);
      const originalBtnHtml = elements.btnProcess.innerHTML;
      try {
        const targetSize = parseFloat(elements.inputFilesize.value) || 20;
        const res = parseInt(elements.selResolution.value, 10);
        const quality = Math.max(1, Math.min(100, parseInt(elements.inputQuality.value, 10) || 90)) / 100;
        const st = parseFloat(elements.inputStart.value) || 0;
        const dur = parseFloat(elements.inputDuration.value) || 0;

        if (state.isAudioCrop) {
          const parsedTot = parseFloat(elements.inputTotal.value);
          const tot = isNaN(parsedTot) ? dur : parsedTot;
          if (tot <= 0) {
            clearActiveAudio();
            state.sourceAudioBuffer = null;
            initTimelineUI(0);
            renderThumbs();
          } else {
            const srcBuf = state.sourceAudioBuffer ?? new AudioBuffer({ length: 16, sampleRate: 16000 });
            const { pcmData, blob, rbuf } = await createPcmWav(srcBuf, st, dur, tot);
            setActiveAudio(pcmData, blob, rbuf);
            renderThumbs();
          }
        } else if (state.isVideo) {
          const fps = Math.min(15, Math.max(1, parseInt(elements.inputFps.value, 10) || 3));
          const frames = Math.round(dur * fps);
          if (dur <= 0 || frames <= 0) return;
          const wasPlaying = !elements.videoSource.paused;
          const originalTime = elements.videoSource.currentTime;
          elements.videoSource.pause();
          const step = 1 / fps;

          for (let i = 0; i < frames; i++) {
            const t = Math.min(elements.videoSource.duration, st + i * step);
            if (t > st + dur + 1e-6) break;
            await seekVideo(t);
            const blob = await processSingleFrame(elements.videoSource, res, targetSize, quality);
            if (blob) addCroppedImage(blob, res, true);

            const pct = Math.round(((i + 1) / frames) * 100);
            elements.btnProcess.innerHTML = `<span style="font-size: 14px; font-weight: bold;">${pct}%</span>`;
          }

          await seekVideo(originalTime);
          if (wasPlaying) elements.videoSource.play();
          if (state.tempVideoAudioBuffer) {
            const { pcmData, blob, rbuf } = await createPcmWav(state.tempVideoAudioBuffer, st, dur, dur);
            setActiveAudio(pcmData, blob, rbuf);
          }
          renderThumbs();
        } else {
          const blob = await processSingleFrame(elements.imgSource, res, targetSize, quality);
          if (blob) addCroppedImage(blob, res);
        }
      } finally {
        elements.btnProcess.innerHTML = originalBtnHtml;
        elements.btnProcess.disabled = false;
        setUILock(false);
      }
    });

    elements.btnImport.addEventListener('click', () => elements.inputImport.click());
    elements.inputImport.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      e.target.value = '';
      const name = file.name.toLowerCase();
      if (file.type === 'image/jpeg' || name.endsWith('.jpg') || name.endsWith('.jpeg')) {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => { addCroppedImage(file, img.naturalWidth || parseInt(elements.selResolution.value, 10)); URL.revokeObjectURL(url); };
        img.src = url;
      } else if (file.type.startsWith('audio/wav') || file.type === 'audio/x-wav' || name.endsWith('.wav')) {
        try {
          const ab = await decodeAudio(await file.arrayBuffer());
          const { pcmData, blob, rbuf } = await createPcmWav(ab, 0, ab.duration, ab.duration);
          setActiveAudio(pcmData, blob, rbuf);
          renderThumbs();
        } catch (err) {
          logDebug(`WAV Import Error: ${err.message}`);
        }
      }
    });

    elements.btnAudioThumb.addEventListener('click', async () => {
      pauseMedia();
      if (!state.activeAudio && state.tempVideoAudioBuffer) {
        state.sourceAudioBuffer = state.tempVideoAudioBuffer;
      }
      state.isAudioCrop = true;
      state.isVideo = false;
      switchTab(true);
      updateMediaModeUI();

      if (state.activeAudio?.url) {
        elements.audioSource.src = state.activeAudio.url;
      } else if (elements.videoSource.src) {
        elements.audioSource.src = elements.videoSource.src;
      }
      initTimelineUI(elements.audioSource.duration || (state.sourceAudioBuffer ? state.sourceAudioBuffer.duration : 0));
      elements.btnProcess.disabled = false;
    });

    elements.audioSource.addEventListener('loadedmetadata', () => {
      if (!state.isAudioCrop) return;
      initTimelineUI(elements.audioSource.duration);
      elements.btnProcess.disabled = false;
    });

    elements.selResolution.addEventListener('change', () => {
      const s = elements.selResolution.value;
      elements.cropMask.style.inlineSize = `${s}px`; elements.cropMask.style.blockSize = `${s}px`;
    });

    elements.cropArea.addEventListener('pointerdown', handlePointerDown);
    elements.cropArea.addEventListener('pointermove', handlePointerMove);
    ['pointerup', 'pointercancel'].forEach(ev => elements.cropArea.addEventListener(ev, handlePointerUp));
    elements.cropArea.addEventListener('wheel', e => {
      if (elements.btnProcess.disabled || state.isAudioCrop) return;
      e.preventDefault();
      const f = Math.exp(-e.deltaY * 0.005);
      state.scale *= f; state.x *= f; state.y *= f;
      renderSourceMedia();
    }, { passive: false });

    elements.thumbnailContainer.addEventListener('wheel', e => { e.preventDefault(); elements.thumbnailContainer.scrollLeft += e.deltaY + e.deltaX; }, { passive: false });

    elements.modalPreview.addEventListener('pointerdown', e => {
      if (e.pointerType !== 'mouse') { modalTouchX = e.clientX; modalTouchY = e.clientY; }
    });
    elements.modalPreview.addEventListener('pointerup', e => {
      if (e.pointerType === 'mouse' || state.previewIndex < 0) return;
      const dx = e.clientX - modalTouchX;
      if (Math.abs(dx) > 50 && Math.abs(e.clientY - modalTouchY) < 50) simulateClick(dx < 0 ? 'btn-next' : 'btn-prev');
    });

    elements.btnClose.addEventListener('click', () => elements.modalPreview.classList.remove('active'));
    elements.btnPrev.addEventListener('click', () => { if (state.previewIndex > 0) openModal(state.previewIndex - 1); });
    elements.btnNext.addEventListener('click', () => { if (state.previewIndex < state.croppedImages.length - 1) openModal(state.previewIndex + 1); });

    elements.btnDelete.addEventListener('click', () => {
      URL.revokeObjectURL(state.croppedImages.splice(state.previewIndex, 1)[0].url);
      renderThumbs();
      if (state.croppedImages.length === 0) {
        elements.modalPreview.classList.remove('active');
        state.previewIndex = -1;
      } else {
        openModal(Math.min(state.previewIndex, state.croppedImages.length - 1));
      }
    });

    elements.btnDownload.addEventListener('click', () => {
      const a = document.createElement('a');
      const img = state.croppedImages[state.previewIndex];
      a.href = img.url; a.download = img.filename.replace('.jpg', `_${state.previewIndex}.jpg`); a.click();
    });

    elements.btnDownloadZip.addEventListener('click', async () => {
      const btns = document.querySelectorAll('.btn-modal');
      btns.forEach(b => b.disabled = true);
      try {
        const filesToZip = [];
        for (let i = 0; i < state.croppedImages.length; i++) {
          const img = state.croppedImages[i];
          const uniqueName = img.filename.replace('.jpg', `_${i}.jpg`);
          filesToZip.push({ name: uniqueName, data: new Uint8Array(await img.blob.arrayBuffer()) });
        }
        if (state.activeAudio) filesToZip.push({ name: state.activeAudio.blob.name, data: new Uint8Array(await state.activeAudio.blob.arrayBuffer()) });
        const a = document.createElement('a');
        const url = URL.createObjectURL(createZip(filesToZip));
        a.href = url;
        a.download = `badge_media_${Date.now()}.zip`;
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } finally {
        btns.forEach(b => b.disabled = false);
      }
    });

    elements.btnUploadImage.addEventListener('click', async () => {
      if (!charWrite) { elements.modalPreview.classList.remove('active'); return simulateClick('tab-badge'); }
      if (!state.badgeWidth || !state.maxBlockSize) return alert("Error: Badge screen size or block size is unknown. Cannot upload.");
      const img = state.croppedImages[state.previewIndex];
      if (img.res !== state.badgeWidth) return alert(`Error: Resolution mismatch in cropped image. Expected ${state.badgeWidth}px.`);
      if (img.blob.size > 40959) return alert("Error: Image exceeds the maximum size of 40959 bytes.");
      await executeUpload(img.blob);
    });

    elements.modalInputFps.addEventListener('input', updateModalText);

    elements.btnUploadVideo.addEventListener('click', async () => {
      const btns = document.querySelectorAll('.btn-modal');
      btns.forEach(b => b.disabled = true);
      try {
        if (!charWrite) { elements.modalPreview.classList.remove('active'); simulateClick('tab-badge'); return; }
        if (!state.badgeWidth || !state.maxBlockSize) { alert("Error: Badge screen size or block size is unknown. Cannot upload."); return; }
        if (state.croppedImages.some(img => img.res !== state.badgeWidth)) { alert(`Error: Resolution mismatch in cropped images. Expected ${state.badgeWidth}px.`); return; }
        if (state.croppedImages.some(img => img.blob.size > 40959)) { alert("Error: One or more frames exceed the maximum size of 40959 bytes."); return; }

        const audioLen = state.activeAudio ? state.activeAudio.pcmData.length / 32000 : 0;
        const uiFps = Math.max(1, Math.min(15, parseInt(elements.modalInputFps.value, 10) || 3));
        const fps = audioLen > 0 ? Math.max(0.001, state.croppedImages.length / audioLen) : uiFps;

        if (fps > 15) throw new Error(`FPS (${fps.toFixed(1)}) exceeds the maximum limit of 15.`);
        const aviBlob = await buildAviFile(state.croppedImages, state.badgeWidth, state.badgeHeight, fps, state.activeAudio?.pcmData);
        await executeUpload(aviBlob);
      } catch (e) {
        alert("Failed to build AVI: " + e.message);
      } finally {
        btns.forEach(b => b.disabled = false);
      }
    });

    elements.seekStart.addEventListener('input', () => {
      elements.seekStart.style.zIndex = 5; elements.seekEnd.style.zIndex = 4;
      updateRangeUI(); getMedia().currentTime = parseFloat(elements.seekStart.value);
    });
    elements.seekEnd.addEventListener('input', () => {
      elements.seekEnd.style.zIndex = 5; elements.seekStart.style.zIndex = 4;
      updateRangeUI(); getMedia().currentTime = parseFloat(elements.seekEnd.value);
    });

    elements.inputStart.addEventListener('input', () => {
      const st = parseFloat(elements.inputStart.value);
      if (!isNaN(st)) {
        elements.seekStart.value = st;
        updateRangeUI(false);
        getMedia().currentTime = st;
      }
    });

    elements.inputStart.addEventListener('change', () => {
      let st = parseFloat(elements.inputStart.value) || 0;
      const ed = parseFloat(elements.seekEnd.value) || 0;
      if (st > ed) st = ed;
      elements.inputStart.value = st.toFixed(3);
      elements.seekStart.value = st;
      updateRangeUI(true);
      getMedia().currentTime = st;
    });

    elements.inputDuration.addEventListener('input', () => {
      const len = parseFloat(elements.inputDuration.value);
      if (!isNaN(len)) {
        const st = parseFloat(elements.seekStart.value) || 0;
        elements.seekEnd.value = st + len;
        updateRangeUI(false);
      }
    });

    elements.inputDuration.addEventListener('change', () => {
      const st = parseFloat(elements.seekStart.value) || 0;
      let len = parseFloat(elements.inputDuration.value) || 0;
      const dur = getMedia().duration || 0;
      if (st + len > dur) len = Math.max(0, dur - st);
      elements.inputDuration.value = len.toFixed(3);
      elements.seekEnd.value = st + len;
      updateRangeUI(true);
    });

    elements.btnPlay.addEventListener('click', () => {
      if (state.isAudioCrop && !elements.audioSource.src) return;
      const m = getMedia();
      m.paused ? m.play() : m.pause();
    });

    const onTimeUpdate = () => {
      const m = getMedia();
      if (!(state.isVideo || state.isAudioCrop) || !m.duration) return;
      if (m.currentTime >= (parseFloat(elements.seekEnd.value) || m.duration) && !m.paused) m.currentTime = parseFloat(elements.seekStart.value) || 0;
      elements.seekCurrentPos.style.insetInlineStart = `${(m.currentTime / m.duration) * 100}%`;
    };
    elements.videoSource.addEventListener('timeupdate', onTimeUpdate);
    elements.audioSource.addEventListener('timeupdate', onTimeUpdate);

    initCjpegli().then(mod => {
      elements.grpFilesize.classList.toggle('hidden-control', !mod);
      elements.grpQuality.classList.toggle('hidden-control', !!mod);
    });
    elements.selResolution.dispatchEvent(new Event('change'));
  };

  initApp();
</script>
</body>
</html>
