<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1e1e1e">
  <title>Web Badge Studio</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0&display=swap">
  <!-- <script src="cjpegli.js"></script> -->
  <style>
    :root {
      color-scheme: light dark;
      --bg-app: light-dark(#f8f9fa, #121212);
      --bg-surface: light-dark(#ffffff, #1e1e1e);
      --bg-stage: light-dark(#e8eaed, #222222);
      --bg-field: light-dark(#ffffff, #333333);
      --bg-backdrop: light-dark(rgba(255, 255, 255, 0.95), rgba(0, 0, 0, 0.95));
      --fill-hover: light-dark(rgba(0, 0, 0, 0.05), rgba(255, 255, 255, 0.1));
      --fill-active: light-dark(rgba(0, 0, 0, 0.1), rgba(255, 255, 255, 0.2));
      --fill-danger: light-dark(rgba(220, 53, 69, 0.1), rgba(255, 69, 58, 0.15));
      --fill-glass: light-dark(rgba(0, 0, 0, 0.05), rgba(255, 255, 255, 0.15));
      --fill-glass-hover: light-dark(rgba(0, 0, 0, 0.1), rgba(255, 255, 255, 0.25));
      --fill-glass-active: light-dark(rgba(0, 0, 0, 0.2), rgba(255, 255, 255, 0.35));
      --fg-primary: light-dark(#202124, #ffffff);
      --fg-muted: light-dark(#5f6368, #aaaaaa);
      --border-subtle: light-dark(#dadce0, #333333);
      --border-guide: light-dark(rgba(0, 0, 0, 0.2), rgba(255, 255, 255, 0.4));
      --color-accent: light-dark(#007bff, #4da3ff);
      --color-danger: light-dark(#dc3545, #ff453a);
      --shadow-sm: 0 2px 4px light-dark(rgba(0, 0, 0, 0.15), rgba(0, 0, 0, 0.4));
      --shadow-md: 0 2px 8px light-dark(rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.5));
      --ease-fast: 0.1s ease;
      --ease-base: 0.2s ease;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    [hidden] { display: none !important; }
    img { -webkit-user-drag: none; }

    html, body {
      inline-size: 100%;
      block-size: 100%;
      margin: 0;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      overflow: hidden;
      overscroll-behavior: none;
      color: var(--fg-primary);
      font-family: system-ui, sans-serif;
      background: var(--bg-app);
      user-select: none;
    }

    :is(body, .panel, .badge-panel, .command-group, .trim-panel, .progress-box) {
      display: flex;
      flex-direction: column;
    }

    :is(.toolbar, .asset-dock, .status-bar, .status-item, .field-group, .command-row, .timeline-track, .thumb-list, .preview-actions) {
      display: flex;
      align-items: center;
    }

    :is(.nav-tabs, .toolbar, .trim-panel, .asset-dock, .status-bar, .badge-panel) {
      background: var(--bg-surface);
    }

    :is(.nav-tabs, .toolbar, .trim-panel) { border-block-end: 1px solid var(--border-subtle); }
    :is(.asset-dock, .status-bar) { border-block-start: 1px solid var(--border-subtle); }
    :is(.toolbar, .asset-dock, .status-bar) { padding-inline: 16px; }
    :is(.panel, .badge-panel) { flex: 1; overflow: hidden; }
    :is(.btn-icon, .timeline-playhead) { aspect-ratio: 1; border-radius: 50%; }
    :is(.preview-text, .progress-text) { font-variant-numeric: tabular-nums; }

    :is(.btn, select, input, dialog):focus-visible {
      outline: 2px solid var(--color-accent);
      outline-offset: 2px;
    }

    .push-end { margin-inline-start: auto; }
    .unit-label { color: var(--fg-muted); font-size: 14px; font-weight: 500; }
    .badge-identity { font-size: 14px; }
    .badge-mac { color: var(--fg-muted); font-size: 12px; font-weight: normal; }

    .nav-tabs { z-index: 20; display: flex; block-size: 48px; }
    .toolbar { z-index: 10; gap: 12px; block-size: 56px; }
    .asset-dock { gap: 12px; block-size: 84px; }
    .status-bar { justify-content: space-between; block-size: 44px; font-size: 14px; }
    .status-item { gap: 8px; font-weight: 500; }
    .status-icon { color: var(--fg-muted); font-size: 24px; }
    .badge-panel { padding: 16px; }
    .command-group { gap: 12px; max-inline-size: 300px; }
    .command-row { gap: 8px; }
    .select-lang { inline-size: 100px; padding: 8px; }
    .trim-panel { gap: 12px; padding: 12px 16px; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      color: var(--fg-primary);
      background: transparent;
      border: none;
      cursor: pointer;
      transition: background-color var(--ease-base), color var(--ease-base), transform var(--ease-fast);
      &:disabled { opacity: 0.3; cursor: not-allowed; }
      &:not(:disabled, .btn-glass):hover { background: var(--fill-hover); }
      &:not(:disabled, .btn-glass):active { background: var(--fill-active); }
    }

    .nav-tab {
      flex: 1;
      color: var(--fg-muted);
      border-block-end: 2px solid transparent;
      &.active { color: var(--fg-primary); border-block-end-color: var(--fg-primary); }
    }

    .btn-icon {
      inline-size: 44px;
      &.active { color: var(--color-accent); }
      &.compact { inline-size: 36px; }
    }

    .btn-action {
      flex: 1;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 500;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
    }

    .btn-glass {
      background: var(--fill-glass);
      backdrop-filter: blur(4px);
      &:hover:not(:disabled) { background: var(--fill-glass-hover); }
      &:active:not(:disabled), &.pressed { background: var(--fill-glass-active); transform: scale(0.9); }
      &.danger {
        color: var(--color-danger);
        &:hover:not(:disabled) { background: var(--fill-danger); }
      }
    }

    :is(select, input[type="number"]) {
      padding: 6px 4px;
      color: var(--fg-primary);
      font-size: 14px;
      background: var(--bg-field);
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      outline: none;
    }

    input[type="number"] {
      inline-size: 50px;
      &.input-time { inline-size: 56px; }
    }

    .field-group {
      gap: 6px;
      &.row-timeline { gap: 12px; margin-block-end: 4px; }
      &.row-params { justify-content: space-between; }
    }

    .crop-stage {
      position: relative;
      flex: 1;
      overflow: hidden;
      background: var(--bg-stage);
      touch-action: none;
    }

    :is(.stage-media, .crop-guide, .stage-audio-icon) {
      position: absolute;
      inset: 50% auto auto 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
    }

    .stage-media {
      opacity: 0;
      transition: opacity var(--ease-base);
      will-change: transform;
      &.ready { opacity: 1; }
    }

    .crop-guide {
      border: 1px dashed var(--border-guide);
      border-radius: 50%;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
    }

    .stage-audio-icon {
      color: var(--fg-muted);
      font-size: 96px;
    }

    .timeline-track { position: relative; flex: 1; block-size: 24px; }
    :is(.timeline-rail, .timeline-fill) { position: absolute; block-size: 6px; border-radius: 3px; }
    .timeline-rail { inline-size: 100%; background: var(--border-subtle); }
    .timeline-fill { background: var(--color-accent); pointer-events: none; }

    .timeline-playhead {
      position: absolute;
      z-index: 6;
      inline-size: 14px;
      background: var(--color-danger);
      border: 2px solid var(--bg-surface);
      box-shadow: var(--shadow-sm);
      pointer-events: none;
      transform: translateX(-50%);
    }

    input[type="range"].timeline-thumb {
      position: absolute;
      z-index: 4;
      inline-size: 100%;
      margin: 0;
      background: transparent;
      pointer-events: none;
      appearance: none;
      &.top { z-index: 5; }
      &::-webkit-slider-thumb {
        inline-size: 12px;
        block-size: 20px;
        background: var(--bg-surface);
        border: 1px solid var(--border-subtle);
        border-radius: 6px;
        box-shadow: var(--shadow-sm), inset 0 0 0 2px var(--color-accent);
        cursor: ew-resize;
        pointer-events: auto;
        appearance: none;
        transition: box-shadow var(--ease-fast), transform var(--ease-fast);
      }
      &:active::-webkit-slider-thumb {
        box-shadow: var(--shadow-md), inset 0 0 0 3px var(--color-accent);
        transform: scale(1.05);
      }
    }

    .thumb-list {
      flex: 1;
      gap: 12px;
      overflow-inline: auto;
      scrollbar-width: none;
    }

    .thumb-item {
      flex-shrink: 0;
      inline-size: 60px;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 4px;
      box-shadow: var(--shadow-md);
      cursor: pointer;
      transition: transform var(--ease-base);
      &:hover { transform: scale(1.05); }
    }

    dialog.modal-overlay {
      inline-size: 100%;
      max-inline-size: none;
      block-size: 100%;
      max-block-size: none;
      margin: 0;
      padding: 0;
      background: transparent;
      border: none;
      outline: none;
      touch-action: none;
      &[open] { display: flex; align-items: center; justify-content: center; }
      &::backdrop { background: var(--bg-backdrop); backdrop-filter: blur(2px); }
    }

    .preview-bar {
      position: absolute;
      inset-inline: 16px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      pointer-events: none;
      &.top { inset-block-start: 16px; }
      &.bottom { inset-block-end: 16px; align-items: end; }
      & .slot-center { grid-column: 2; pointer-events: auto; }
      & .slot-end { grid-column: 3; justify-self: end; pointer-events: auto; }
    }

    .preview-text {
      text-align: center;
      &.counter { max-inline-size: 200px; color: var(--fg-primary); font-size: 16px; font-weight: 600; line-height: 1.2; }
      &.details { color: var(--fg-muted); font-size: 14px; line-height: 1.4; white-space: pre-line; }
    }

    .preview-stage {
      display: grid;
      grid-template-areas:
        ". upload ."
        "prev image next"
        ". download .";
      place-items: center;
      gap: 16px;
      pointer-events: none;
      & > * { pointer-events: auto; }
    }

    .preview-actions {
      gap: 16px;
      &.area-upload { grid-area: upload; }
      &.area-download { grid-area: download; }
    }

    #btn-prev-frame { grid-area: prev; }
    #btn-next-frame { grid-area: next; }

    .loop-chip {
      padding: 4px 8px;
      background: var(--bg-surface);
      border-radius: 4px;
      box-shadow: var(--shadow-md);
    }

    .preview-image {
      grid-area: image;
      max-inline-size: 90vw;
      max-block-size: 55vh;
      object-fit: contain;
      box-shadow: var(--shadow-md);
    }

    .progress-box {
      align-items: center;
      gap: 8px;
      inline-size: 80%;
      max-inline-size: 300px;
    }

    progress {
      inline-size: 100%;
      block-size: 6px;
      overflow: hidden;
      background: transparent;
      border-radius: 3px;
      appearance: none;
      &::-webkit-progress-bar { background: var(--border-subtle); }
      &::-webkit-progress-value { background: var(--color-accent); }
    }

    .progress-text {
      color: var(--fg-primary);
      font-size: 13px;
      font-weight: 500;
    }
  </style>
</head>
<body>

<nav class="nav-tabs">
  <button id="tab-badge" class="btn nav-tab active" title="Badge Control">
    <span class="material-symbols-outlined">watch</span>
  </button>
  <button id="tab-editor" class="btn nav-tab" title="Media Editor">
    <span class="material-symbols-outlined">photo_library</span>
  </button>
</nav>

<section id="panel-badge" class="panel">
  <header class="toolbar">
    <button id="btn-connect" class="btn btn-icon" title="Connect / Disconnect">
      <span id="icon-connect" class="material-symbols-outlined">bluetooth</span>
    </button>
    <div id="badge-identity" class="status-item badge-identity" title="Connected Badge" hidden>
      <span id="text-name" title="Badge Name"></span>
      <span id="text-mac" class="badge-mac" title="MAC Address"></span>
    </div>
    <button id="btn-debug" class="btn btn-icon push-end" title="Toggle Debug Log">
      <span class="material-symbols-outlined">bug_report</span>
    </button>
  </header>

  <main class="badge-panel">
    <div class="command-group">
      <div class="command-row">
        <button id="btn-set-lang" class="btn btn-action badge-cmd" title="Set Language" disabled>Set Language</button>
        <select id="select-lang" class="select-lang" title="Language">
          <option value="1">English</option>
          <option value="8">日本語</option>
        </select>
      </div>
      <button id="btn-call-badge" class="btn btn-action badge-cmd" title="Call Badge" disabled>Call Badge</button>
      <button id="btn-check-storage" class="btn btn-action badge-cmd" title="Check Storage" disabled>Check Storage</button>
    </div>
  </main>
</section>

<section id="panel-editor" class="panel" hidden>
  <header class="toolbar">
    <button id="btn-open-media" class="btn btn-icon" title="Open Media File">
      <span class="material-symbols-outlined">folder_open</span>
    </button>
    <input id="input-media" type="file" accept="image/*,video/*,audio/*" hidden>

    <button id="btn-extract" class="btn btn-icon" title="Extract Media" disabled>
      <span class="material-symbols-outlined">crop</span>
    </button>

    <div class="field-group" title="Target Resolution">
      <label class="btn btn-icon" for="select-resolution">
        <span class="material-symbols-outlined">aspect_ratio</span>
      </label>
      <select id="select-resolution">
        <option value="240x240">240x240</option>
        <option value="360x360">360x360</option>
      </select>
    </div>

    <div id="group-max-size" class="field-group" title="Max File Size (KiB)" hidden>
      <label class="btn btn-icon" for="input-max-size">
        <span class="material-symbols-outlined">compress</span>
      </label>
      <input id="input-max-size" type="number" min="1" max="39" step="1" value="20">
      <span class="unit-label">KiB</span>
    </div>

    <div id="group-quality" class="field-group" title="JPEG Quality">
      <label class="btn btn-icon" for="input-quality">
        <span class="material-symbols-outlined">high_quality</span>
      </label>
      <input id="input-quality" type="number" min="1" max="100" step="1" value="90">
    </div>
  </header>

  <main id="crop-stage" class="crop-stage" title="Drag to Pan, Scroll or Pinch to Zoom">
    <img id="stage-image" class="stage-media" decoding="async">
    <video id="stage-video" class="stage-media" playsinline></video>
    <audio id="stage-audio"></audio>
    <span id="stage-audio-icon" class="material-symbols-outlined stage-audio-icon" hidden>graphic_eq</span>
    <div id="crop-guide" class="crop-guide"></div>
  </main>

  <div id="trim-panel" class="trim-panel" hidden>
    <div class="field-group row-timeline">
      <button id="btn-play" class="btn btn-icon compact" title="Play / Pause">
        <span id="icon-play" class="material-symbols-outlined">play_arrow</span>
      </button>
      <div class="timeline-track">
        <div class="timeline-rail"></div>
        <div id="timeline-fill" class="timeline-fill"></div>
        <div id="timeline-playhead" class="timeline-playhead"></div>
        <input id="range-start" class="timeline-thumb" type="range" min="0" max="100" step="0.1" value="0" title="Start Handle">
        <input id="range-end" class="timeline-thumb" type="range" min="0" max="100" step="0.1" value="100" title="End Handle">
      </div>
    </div>
    <div class="field-group row-params">
      <div class="field-group" title="Start Time (s)">
        <span class="unit-label">Start(s)</span>
        <input id="input-start" class="input-time" type="number" min="0" step="0.1" value="0.0">
      </div>
      <div class="field-group" title="Clip Length (s)">
        <span class="unit-label">Length(s)</span>
        <input id="input-length" class="input-time" type="number" min="0" step="0.1" value="0.0">
      </div>
      <div id="group-total" class="field-group" title="Total Duration (s)" hidden>
        <span class="unit-label">Total(s)</span>
        <input id="input-total" class="input-time" type="number" min="0" step="0.1" value="0.0">
      </div>
      <div id="group-fps" class="field-group" title="Frame Rate (FPS)">
        <span class="unit-label">FPS</span>
        <input id="input-fps" type="number" min="1" max="15" step="1" value="5">
      </div>
    </div>
  </div>
</section>

<footer class="asset-dock">
  <button id="btn-import" class="btn btn-icon" title="Import JPEG / WAV">
    <span class="material-symbols-outlined">library_add</span>
  </button>
  <input id="input-import" type="file" accept=".jpg,.jpeg,.wav" multiple hidden>
  <div id="thumb-list" class="thumb-list"></div>
  <button id="btn-edit-audio" class="btn btn-icon" title="Edit Audio Track">
    <span class="material-symbols-outlined">edit_audio</span>
  </button>
</footer>

<div class="status-bar">
  <div class="status-item" title="Battery Level">
    <span id="icon-battery" class="material-symbols-outlined status-icon">battery_full</span>
    <span id="text-battery">--%</span>
  </div>
  <div class="status-item" title="Display Resolution">
    <span class="material-symbols-outlined status-icon">aspect_ratio</span>
    <span id="text-resolution">--x--</span>
  </div>
  <div class="status-item" title="Free Storage">
    <span id="text-storage">-- KiB</span>
    <span class="material-symbols-outlined status-icon">storage</span>
  </div>
</div>

<dialog id="modal-preview" class="modal-overlay" tabindex="-1">
  <div class="preview-bar top">
    <div id="text-counter" class="preview-text counter slot-center" title="Frame Counter"></div>
    <button id="btn-close-preview" class="btn btn-icon btn-glass slot-end" title="Close Preview">
      <span class="material-symbols-outlined">close</span>
    </button>
  </div>

  <div class="preview-stage">
    <div class="preview-actions area-upload">
      <button id="btn-upload-image" class="btn btn-icon btn-glass" title="Upload Image">
        <span class="material-symbols-outlined">image</span>
      </button>
      <button id="btn-upload-video" class="btn btn-icon btn-glass" title="Upload AVI Video" hidden>
        <span class="material-symbols-outlined">animated_images</span>
      </button>
      <div id="group-loop" class="field-group loop-chip" title="Loop Duration (s)" hidden>
        <input id="input-loop" class="input-time" type="number" min="0.1" step="0.1" value="1.0">
        <span class="unit-label">s</span>
      </div>
    </div>

    <button id="btn-prev-frame" class="btn btn-icon btn-glass" title="Previous Frame">
      <span class="material-symbols-outlined">chevron_left</span>
    </button>

    <img id="preview-image" class="preview-image" title="Frame Preview">

    <button id="btn-next-frame" class="btn btn-icon btn-glass" title="Next Frame">
      <span class="material-symbols-outlined">chevron_right</span>
    </button>

    <div class="preview-actions area-download">
      <button id="btn-download-jpg" class="btn btn-icon btn-glass" title="Download JPEG">
        <span class="material-symbols-outlined">download</span>
      </button>
      <button id="btn-download-zip" class="btn btn-icon btn-glass" title="Download ZIP Archive" hidden>
        <span class="material-symbols-outlined">folder_zip</span>
      </button>
    </div>
  </div>

  <div class="preview-bar bottom">
    <div id="text-details" class="preview-text details slot-center" title="Media Details"></div>
    <button id="btn-delete-frame" class="btn btn-icon btn-glass danger slot-end" title="Delete Frame">
      <span class="material-symbols-outlined">delete</span>
    </button>
  </div>
</dialog>

<dialog id="modal-progress" class="modal-overlay">
  <div class="progress-box" title="Processing Progress">
    <progress id="bar-progress" max="100" value="0"></progress>
    <span id="text-progress" class="progress-text">0%</span>
  </div>
</dialog>

<script type="module">
  const BLE_UUID = {
    SERVICE: '7e400001-b5a3-f393-e0a9-e50e24dcca9d',
    TX: '7e400002-b5a3-f393-e0a9-e50e24dcca9d',
    RX: '7e400003-b5a3-f393-e0a9-e50e24dcca9d',
    AUX_RX: '7e400004-b5a3-f393-e0a9-e50e24dcca9d',
    BATTERY_SVC: 'battery_service',
    BATTERY_CHAR: 'battery_level'
  };

  const PROTO = {
    HEAD_CMD: 0xCD,
    HEAD_ACK: 0xDC,
    CLS_SYS: 0x12,
    CLS_INFO: 0x1A,
    CLS_STREAM: 0x1F,
    CLS_STAT: 0x20
  };

  const SPEC = {
    BLE_MTU: 487,
    MAX_JPG_BYTES: 40959,
    AVI_AUDIO_CHUNK: 684,
    MIN_FPS: 1,
    MAX_FPS: 15,
    DEF_FPS: 5,
    DEF_LOOP_SEC: 1,
    SAMPLE_RATE: 16000,
    BYTE_RATE: 32000
  };

  const CRC32_TABLE = new Uint32Array(256).map((_, idx) => {
    let crc = idx;
    for (let bit = 0; bit < 8; bit++) {
      crc = crc & 1 ? 0xedb88320 ^ (crc >>> 1) : crc >>> 1;
    }
    return crc;
  });

  const ui = Object.fromEntries(
    [...document.querySelectorAll('[id]')].map((el) => [
      el.id.replace(/-([a-z])/g, (_, ch) => ch.toUpperCase()),
      el
    ])
  );

  const state = {
    busy: false,
    debug: false,
    mode: 'image',
    previewIdx: -1,
    badge: { width: 0, height: 0, maxChunk: 0 },
    stage: {
      guideWidth: 0,
      guideHeight: 0,
      scale: 1,
      panX: 0,
      panY: 0,
      baseScale: 1,
      basePanX: 0,
      basePanY: 0,
      startX: 0,
      startY: 0,
      pinchDist: 0,
      pointers: new Map()
    },
    assets: { rawAudio: null, audioTrack: null, frames: [] },
    swipe: { id: null, startX: 0, startY: 0 }
  };

  const ble = {
    connecting: false,
    device: null,
    txChar: null,
    rxChar: null,
    batChar: null,
    txChain: Promise.resolve(),
    cmdChain: Promise.resolve(),
    pending: new Map()
  };

  const encoder = {
    canvas: null,
    ctx: null,
    width: 0,
    height: 0,
    wasmTask: null
  };

  const clamp = (val, min, max) => Math.min(max, Math.max(min, val));
  const roundTenth = (val) => Number.isFinite(val) ? Math.round(val * 10) / 10 : 0;
  const readFloat = (el, fallback = 0) => {
    const val = parseFloat(el.value);
    return Number.isNaN(val) ? fallback : val;
  };
  const readInt = (el, min, max, fallback) => {
    const val = parseInt(el.value, 10);
    return clamp(Number.isNaN(val) ? fallback : val, min, max);
  };
  const toHex = (val) => val.toString(16).padStart(2, '0').toUpperCase();
  const u16be = (val) => [(val >>> 8) & 0xFF, val & 0xFF];
  const u32be = (val) => [(val >>> 24) & 0xFF, (val >>> 16) & 0xFF, (val >>> 8) & 0xFF, val & 0xFF];
  const readU16be = (buf, pos = 0) => (buf[pos] << 8) | buf[pos + 1];
  const readU32be = (buf, pos = 0) => ((buf[pos] << 24) | (buf[pos + 1] << 16) | (buf[pos + 2] << 8) | buf[pos + 3]) >>> 0;
  const sumBytes = (buf) => buf.reduce((acc, b) => (acc + b) >>> 0, 0);
  const getIndexedName = (frame, idx) => frame.name.replace('.jpg', `_${idx}.jpg`);

  const getTimestamp = () => {
    const now = new Date();
    const localIso = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString();
    return localIso.replace(/[-:T]/g, '').replace('.', '_').slice(0, 18);
  };

  const formatPacket = (buf) => {
    const hex = Array.from(buf, toHex).join(' ');
    return hex.length > 96 ? `${hex.slice(0, 96)}...` : hex;
  };

  const logDebug = (msg) => {
    if (state.debug) console.log(`[${new Date().toISOString()}] ${msg}`);
  };

  const createBinaryWriter = (byteLength) => {
    const buffer = new Uint8Array(byteLength);
    const view = new DataView(buffer.buffer);
    let pos = 0;
    return {
      u16: (...vals) => { for (const v of vals) { view.setUint16(pos, v, true); pos += 2; } },
      u32: (...vals) => { for (const v of vals) { view.setUint32(pos, v, true); pos += 4; } },
      str: (...strs) => { for (const s of strs) for (let i = 0; i < 4; i++) buffer[pos++] = s.charCodeAt(i); },
      bytes: (src) => { buffer.set(src, pos); pos += src.length; },
      skip: (len) => { pos += len; },
      patchU32: (at, val) => view.setUint32(at, val, true),
      get offset() { return pos; },
      buffer
    };
  };

  const waitMediaEvent = (target, name) => {
    const { promise, resolve, reject } = Promise.withResolvers();
    const onDone = () => { target.removeEventListener('error', onError); resolve(); };
    const onError = () => { target.removeEventListener(name, onDone); reject(new Error('Media load failed')); };
    target.addEventListener(name, onDone, { once: true });
    target.addEventListener('error', onError, { once: true });
    return promise;
  };

  const updateProgress = (done, total) => {
    const pct = total > 0 ? Math.round((done / total) * 100) : 0;
    ui.barProgress.value = pct;
    ui.textProgress.textContent = `${pct}%`;
  };

  const runTaskWithBusy = async (task, showModal = false) => {
    state.busy = true;
    if (showModal) {
      updateProgress(0, 1);
      if (!ui.modalProgress.open) ui.modalProgress.showModal();
    }
    try {
      await task();
    } finally {
      state.busy = false;
      if (ui.modalProgress.open) ui.modalProgress.close();
      updateProgress(0, 1);
      if (ui.modalPreview.open) ui.modalPreview.focus();
    }
  };

  const triggerButton = (btn) => {
    if (!btn || btn.disabled || btn.hidden || btn.style.visibility === 'hidden') return;
    btn.classList.add('pressed');
    setTimeout(() => btn.classList.remove('pressed'), 150);
    btn.click();
  };

  const downloadBlob = (blob, filename) => {
    const url = URL.createObjectURL(blob);
    Object.assign(document.createElement('a'), { href: url, download: filename }).click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };

  const registerWaiter = (key, timeoutMs, errMsg, meta = {}) => {
    ble.pending.get(key)?.reject(new Error('Superseded'));
    const { promise, resolve, reject } = Promise.withResolvers();
    promise.catch(() => {});
    const clear = () => {
      clearTimeout(timer);
      ble.pending.delete(key);
    };
    const timer = setTimeout(() => {
      clear();
      reject(new Error(errMsg));
    }, timeoutMs);
    const entry = {
      ...meta,
      promise,
      clear,
      resolve: (val) => { clear(); resolve(val); },
      reject: (err) => { clear(); reject(err); }
    };
    ble.pending.set(key, entry);
    return entry;
  };

  const waitPacketReply = (type, cls, id, timeoutMs) =>
    registerWaiter(`${type}_${cls}_${id}`, timeoutMs, `${type.toUpperCase()} Timeout (${cls.toString(16)} ${id?.toString(16)})`);

  const buildCommandPacket = (cls, id, payload = []) => new Uint8Array([
    PROTO.HEAD_CMD,
    ...u16be(5 + payload.length),
    cls,
    0x01,
    id,
    ...u16be(payload.length),
    ...payload
  ]);

  const sendRawPacket = (packet) => {
    const writeChunks = async () => {
      if (!ble.txChar) throw new Error('Badge disconnected');
      logDebug(`[TX] ${formatPacket(packet)}`);
      for (let pos = 0; pos < packet.length; pos += SPEC.BLE_MTU) {
        if (!ble.txChar) throw new Error('Badge disconnected');
        await ble.txChar.writeValueWithoutResponse(packet.subarray(pos, pos + SPEC.BLE_MTU));
      }
    };
    const next = ble.txChain.then(writeChunks, writeChunks);
    ble.txChain = next.catch(() => {});
    return next;
  };

  const enqueueCommand = (fn) => {
    const { promise, resolve, reject } = Promise.withResolvers();
    ble.cmdChain = ble.cmdChain.then(async () => {
      try { resolve(await fn()); } catch (err) { reject(err); }
    });
    return promise;
  };

  const transmitAndAwait = (packet, createWaiter) => enqueueCommand(async () => {
    const waiter = createWaiter();
    try {
      await sendRawPacket(packet);
    } catch (err) {
      waiter.reject(err);
    }
    return waiter.promise;
  });

  const sendBadgeCommand = (cls, id, payload = []) =>
    transmitAndAwait(buildCommandPacket(cls, id, payload), () => waitPacketReply('ack', cls, id, 3000));

  const sendStreamPacket = (id, payload, expectedCode) =>
    transmitAndAwait(
      buildCommandPacket(PROTO.CLS_STREAM, id, payload),
      () => registerWaiter('stream', 10000, `Stream Timeout (Expected: ${expectedCode})`, { expectedCode })
    );

  const queryBadgeData = (cls, id, payload = []) => enqueueCommand(async () => {
    const dataWaiter = waitPacketReply('data', cls, id, 5000);
    const ackWaiter = cls === PROTO.CLS_STAT ? null : waitPacketReply('ack', cls, id, 3000);
    try {
      await sendRawPacket(buildCommandPacket(cls, id, payload));
      if (ackWaiter) await Promise.race([ackWaiter.promise, dataWaiter.promise]);
      return await dataWaiter.promise;
    } finally {
      ackWaiter?.clear();
      dataWaiter.clear();
    }
  });

  const queryStorageSpace = () => queryBadgeData(PROTO.CLS_STAT, 0x04);

  const handleRxNotification = async (event) => {
    const view = event.target.value;
    const pkt = new Uint8Array(view.buffer, view.byteOffset, view.byteLength);
    if (pkt.length < 8) return;
    logDebug(`[RX] ${formatPacket(pkt)}`);

    if (pkt[0] === PROTO.HEAD_ACK) {
      const waiter = ble.pending.get(`ack_${pkt[3]}_${pkt[4]}`);
      if (waiter) pkt[7] === 0x01 ? waiter.resolve() : waiter.reject(new Error(`ACK Error: ${pkt[7]}`));
      return;
    }
    if (pkt[0] !== PROTO.HEAD_CMD) return;

    const bodyLen = readU16be(pkt, 1);
    const payloadLen = readU16be(pkt, 6);
    if (bodyLen !== payloadLen + 5 || pkt.length < 8 + payloadLen) return;

    const cls = pkt[3];
    const id = pkt[5];
    const payload = pkt.slice(8, 8 + payloadLen);

    try {
      await sendRawPacket(new Uint8Array([PROTO.HEAD_ACK, 0x00, 0x05, cls, id, ...u16be(bodyLen + 3), 0x01]));
    } catch (err) {
      logDebug(`ACK Send Error: ${err.message}`);
    }

    if (cls === PROTO.CLS_STAT && id === 0x04 && payload.length >= 8) {
      ui.textStorage.textContent = `${(readU32be(payload, 4) / 1024).toFixed(0)} KiB`;
    }
    ble.pending.get(`data_${cls}_${id}`)?.resolve(payload);
    if (cls !== PROTO.CLS_STAT) return;

    const streamWaiter = ble.pending.get('stream');
    if (id === 0x01 && payload.length >= 4 && streamWaiter) {
      const code = readU32be(payload, 0);
      code === streamWaiter.expectedCode
        ? streamWaiter.resolve()
        : streamWaiter.reject(new Error(`Stream Code Mismatch: ${code}`));
    }
  };

  const updateBatteryStatus = (pct) => {
    ui.textBattery.textContent = `${pct}%`;
    ui.iconBattery.textContent = pct >= 95 ? 'battery_full' : `battery_${Math.min(6, Math.floor(pct / 15))}_bar`;
  };

  const handleBatteryNotification = (event) => updateBatteryStatus(event.target.value.getUint8(0));

  const updateConnectionUi = (connected) => {
    document.querySelectorAll('.badge-cmd').forEach((btn) => { btn.disabled = !connected; });
    ui.btnConnect.classList.toggle('active', connected);
    ui.iconConnect.textContent = connected ? 'bluetooth_connected' : 'bluetooth';
    ui.badgeIdentity.hidden = !connected;
  };

  const handleBadgeDisconnect = () => {
    logDebug('Badge disconnected.');
    updateConnectionUi(false);
    ble.device?.removeEventListener('gattserverdisconnected', handleBadgeDisconnect);
    ble.rxChar?.removeEventListener('characteristicvaluechanged', handleRxNotification);
    ble.batChar?.removeEventListener('characteristicvaluechanged', handleBatteryNotification);
    Object.assign(ble, {
      txChar: null,
      rxChar: null,
      batChar: null,
      txChain: Promise.resolve(),
      cmdChain: Promise.resolve()
    });
    Object.assign(state.badge, { width: 0, height: 0, maxChunk: 0 });
    ui.textName.textContent = '';
    ui.textMac.textContent = '';
    ui.iconBattery.textContent = 'battery_full';
    ui.textBattery.textContent = '--%';
    ui.textResolution.textContent = '--x--';
    ui.textStorage.textContent = '-- KiB';
    ble.pending.forEach((waiter) => waiter.reject(new Error('Badge disconnected')));
  };

  const initializeBadgeSession = async () => {
    const now = new Date();
    const packedTime = ((Math.max(0, now.getFullYear() - 2000) & 0x3F) << 26)
      | (((now.getMonth() + 1) & 0x0F) << 22)
      | ((now.getDate() & 0x1F) << 17)
      | ((now.getHours() & 0x1F) << 12)
      | ((now.getMinutes() & 0x3F) << 6)
      | (now.getSeconds() & 0x3F);
    await sendBadgeCommand(PROTO.CLS_SYS, 0x01, u32be(packedTime));

    const macBytes = await queryBadgeData(PROTO.CLS_INFO, 0x0A);
    if (macBytes.length >= 6) {
      ui.textMac.textContent = `(${Array.from(macBytes.subarray(0, 6), toHex).join(':')})`;
    }

    const nameBytes = await queryBadgeData(PROTO.CLS_INFO, 0x0C);
    if (nameBytes.length > 1) {
      ui.textName.textContent = new TextDecoder().decode(nameBytes.subarray(1)).replace(/\0+$/, '');
    }

    const specBytes = await queryBadgeData(PROTO.CLS_STAT, 0x02);
    if (specBytes.length < 32 || specBytes[0] !== 0x01) {
      throw new Error('Invalid badge specifications');
    }
    const width = readU16be(specBytes, 2);
    const height = readU16be(specBytes, 4);
    const maxChunk = readU16be(specBytes, 30);
    if (!width || !height || maxChunk <= 4) {
      throw new Error('Invalid badge specifications');
    }
    Object.assign(state.badge, { width, height, maxChunk });
    const resLabel = `${width}x${height}`;
    ui.textResolution.textContent = resLabel;
    if ([...ui.selectResolution.options].some((opt) => opt.value === resLabel)) {
      ui.selectResolution.value = resLabel;
      updateCropGuide();
    }

    await queryStorageSpace();
  };

  const setupOptionalServices = async (server, primaryService) => {
    try {
      await (await primaryService.getCharacteristic(BLE_UUID.AUX_RX)).startNotifications();
    } catch {
      logDebug('Aux RX characteristic unavailable.');
    }

    try {
      const batService = await server.getPrimaryService(BLE_UUID.BATTERY_SVC);
      ble.batChar = await batService.getCharacteristic(BLE_UUID.BATTERY_CHAR);
      updateBatteryStatus((await ble.batChar.readValue()).getUint8(0));
      await ble.batChar.startNotifications();
      ble.batChar.addEventListener('characteristicvaluechanged', handleBatteryNotification);
    } catch {
      logDebug('Battery service unavailable.');
    }
  };

  const connectBadge = async () => {
    const selected = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: [BLE_UUID.SERVICE, BLE_UUID.BATTERY_SVC]
    });
    ble.device?.removeEventListener('gattserverdisconnected', handleBadgeDisconnect);
    ble.device = selected;
    ble.device.addEventListener('gattserverdisconnected', handleBadgeDisconnect, { once: true });

    try {
      const server = await ble.device.gatt.connect();
      const service = await server.getPrimaryService(BLE_UUID.SERVICE);
      ble.txChar = await service.getCharacteristic(BLE_UUID.TX);
      ble.rxChar = await service.getCharacteristic(BLE_UUID.RX);
      await ble.rxChar.startNotifications();
      ble.rxChar.addEventListener('characteristicvaluechanged', handleRxNotification);

      await setupOptionalServices(server, service);
      await initializeBadgeSession();
      if (ble.device?.gatt.connected) updateConnectionUi(true);
    } catch (err) {
      ble.device?.gatt.connected ? ble.device.gatt.disconnect() : handleBadgeDisconnect();
      throw err;
    }
  };

  const streamBlobToBadge = async (blob, onProgress) => {
    const raw = new Uint8Array(await blob.arrayBuffer());
    const { maxChunk } = state.badge;
    if (!ble.txChar || maxChunk <= 4) throw new Error('Badge disconnected');
    const totalLen = raw.length;
    const chunks = [];
    for (let pos = 0, idx = 1; pos < totalLen; idx++) {
      const cap = idx === 1 ? maxChunk - 4 : maxChunk;
      const len = Math.min(totalLen - pos, cap);
      chunks.push(raw.subarray(pos, pos + len));
      pos += len;
    }

    onProgress?.(0, chunks.length);
    const startHeader = new Uint8Array([
      ...u32be(Math.floor(Math.random() * 0xFFFFFFFF)),
      blob.type === 'video/avi' ? 0x01 : 0x02,
      0x08, 0, 0, 0,
      ...u32be(totalLen + 4),
      0, 0, 0, 0
    ]);
    await sendStreamPacket(0x02, startHeader, 1000);

    let totalSum = 0;
    const lenByteSum = sumBytes(u32be(totalLen));
    for (let idx = 1; idx <= chunks.length; idx++) {
      const slice = chunks[idx - 1];
      const isFirst = idx === 1;
      const headSize = isFirst ? 6 : 2;
      const packet = new Uint8Array(headSize + slice.length + 4);
      packet.set(u16be(idx), 0);
      if (isFirst) packet.set(u32be(totalLen), 2);
      packet.set(slice, headSize);

      const sliceSum = sumBytes(slice);
      totalSum = (totalSum + sliceSum) >>> 0;
      const checksum = (isFirst ? sliceSum + lenByteSum + 1 : sliceSum + idx) >>> 0;
      packet.set(u32be(checksum), headSize + slice.length);
      await sendStreamPacket(0x01, packet, 1000 + idx);
      onProgress?.(idx, chunks.length);
    }
    await sendStreamPacket(0x03, u32be((totalSum + lenByteSum) >>> 0), 0x0002);
  };

  const calculateAviSize = (frames, pcmLen) => {
    const hasAudio = pcmLen > 0;
    let videoBytes = 0;
    let chunkCount = frames.length;
    let audioCursor = 0;
    for (let i = 0; i < frames.length; i++) {
      const size = frames[i].blob.size;
      videoBytes += size + (size & 1);
      if (hasAudio) {
        const target = Math.floor((pcmLen * (i + 1)) / frames.length) & ~1;
        chunkCount += Math.ceil((target - audioCursor) / SPEC.AVI_AUDIO_CHUNK);
        audioCursor = target;
      }
    }
    return (hasAudio ? 334 : 232) + videoBytes + pcmLen + chunkCount * 24;
  };

  const buildAviBlob = async (frames, width, height, fps, pcmBytes) => {
    const videoChunks = await Promise.all(frames.map(async (frame) => {
      const bytes = new Uint8Array(await frame.blob.arrayBuffer());
      const pad = bytes.length & 1;
      return { tag: '00dc', bytes, pad, size: bytes.length + pad };
    }));
    const hasAudio = Boolean(pcmBytes?.length);
    const pcmLen = hasAudio ? pcmBytes.length : 0;
    const moviChunks = [];
    let audioPos = 0;

    for (let i = 0; i < videoChunks.length; i++) {
      moviChunks.push(videoChunks[i]);
      if (!hasAudio) continue;
      const targetPos = Math.floor((pcmLen * (i + 1)) / videoChunks.length) & ~1;
      while (audioPos < targetPos) {
        const len = Math.min(SPEC.AVI_AUDIO_CHUNK, targetPos - audioPos);
        const pad = len & 1;
        moviChunks.push({ tag: '01wb', bytes: pcmBytes.subarray(audioPos, audioPos + len), pad, size: len + pad });
        audioPos += len;
      }
    }

    const usecPerFrame = Math.round(1000000 / fps);
    const scale = 1000;
    const rate = Math.max(1, Math.round(fps * scale));
    const maxVideoSize = videoChunks.reduce((max, c) => Math.max(max, c.size), 0);
    const maxAudioSize = hasAudio ? SPEC.AVI_AUDIO_CHUNK : 0;
    const maxByteRate = Math.floor(maxVideoSize * fps) + (hasAudio ? SPEC.BYTE_RATE : 0);
    const moviDataBytes = moviChunks.reduce((sum, c) => sum + c.size, 0);
    const writer = createBinaryWriter((hasAudio ? 334 : 232) + moviDataBytes + moviChunks.length * 24);

    writer.str('RIFF');
    const riffSizePos = writer.offset;
    writer.u32(0);
    writer.str('AVI ', 'LIST');
    const hdrlSizePos = writer.offset;
    writer.u32(0);
    writer.str('hdrl', 'avih');
    writer.u32(56, usecPerFrame, maxByteRate, 0, 0x0910, videoChunks.length, 0, hasAudio ? 2 : 1, maxVideoSize + maxAudioSize, width, height);
    writer.skip(16);
    writer.str('LIST');
    const vStrlPos = writer.offset;
    writer.u32(0);
    writer.str('strl', 'strh');
    writer.u32(56);
    writer.str('vids', 'MJPG');
    writer.u32(0);
    writer.u16(0, 0);
    writer.u32(0, scale, rate, 0, videoChunks.length, maxVideoSize, 0xFFFFFFFF, 0);
    writer.u16(0, 0, width, height);
    writer.str('strf');
    writer.u32(40, 40, width, height);
    writer.u16(1, 24);
    writer.str('MJPG');
    writer.u32(maxVideoSize, 0, 0, 0, 0);
    writer.patchU32(vStrlPos, writer.offset - vStrlPos - 4);

    if (hasAudio) {
      writer.str('LIST');
      const aStrlPos = writer.offset;
      writer.u32(0);
      writer.str('strl', 'strh');
      writer.u32(56);
      writer.str('auds');
      writer.u32(0, 0);
      writer.u16(0, 0);
      writer.u32(0, 1, SPEC.SAMPLE_RATE, 0, pcmLen / 2, maxAudioSize, 0xFFFFFFFF, 2);
      writer.skip(8);
      writer.str('strf');
      writer.u32(18);
      writer.u16(1, 1);
      writer.u32(SPEC.SAMPLE_RATE, SPEC.BYTE_RATE);
      writer.u16(2, 16, 0);
      writer.patchU32(aStrlPos, writer.offset - aStrlPos - 4);
    }

    writer.patchU32(hdrlSizePos, writer.offset - hdrlSizePos - 4);
    writer.str('LIST');
    const moviSizePos = writer.offset;
    writer.u32(0);
    const moviStart = writer.offset;
    writer.str('movi');
    const indexList = [];

    for (const chunk of moviChunks) {
      const offset = writer.offset - moviStart;
      writer.str(chunk.tag);
      writer.u32(chunk.bytes.length);
      writer.bytes(chunk.bytes);
      if (chunk.pad) writer.skip(1);
      indexList.push({ tag: chunk.tag, offset, len: chunk.bytes.length });
    }

    writer.patchU32(moviSizePos, writer.offset - moviSizePos - 4);
    writer.str('idx1');
    writer.u32(indexList.length * 16);
    for (const idx of indexList) {
      writer.str(idx.tag);
      writer.u32(0x10, idx.offset, idx.len);
    }
    writer.patchU32(riffSizePos, writer.offset - 8);
    return new Blob([writer.buffer], { type: 'video/avi' });
  };

  const buildZipBlob = (entries) => {
    let centralLen = 0;
    let localLen = 0;
    const textEnc = new TextEncoder();
    const now = new Date();
    const dosTime = (now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1);
    const dosDate = ((Math.max(1980, now.getFullYear()) - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate();

    const records = entries.map((item) => {
      const nameBytes = textEnc.encode(item.name);
      let crc = ~0 >>> 0;
      for (let i = 0; i < item.data.length; i++) {
        crc = CRC32_TABLE[(crc ^ item.data[i]) & 0xFF] ^ (crc >>> 8);
      }
      localLen += 30 + nameBytes.length + item.data.length;
      centralLen += 46 + nameBytes.length;
      return { ...item, nameBytes, crc: (~crc) >>> 0, offset: 0 };
    });

    const writer = createBinaryWriter(localLen + centralLen + 22);
    for (const rec of records) {
      rec.offset = writer.offset;
      writer.u32(0x04034b50);
      writer.u16(20, 0x0800, 0, dosTime, dosDate);
      writer.u32(rec.crc, rec.data.length, rec.data.length);
      writer.u16(rec.nameBytes.length, 0);
      writer.bytes(rec.nameBytes);
      writer.bytes(rec.data);
    }

    const centralStart = writer.offset;
    for (const rec of records) {
      writer.u32(0x02014b50);
      writer.u16(20, 20, 0x0800, 0, dosTime, dosDate);
      writer.u32(rec.crc, rec.data.length, rec.data.length);
      writer.u16(rec.nameBytes.length, 0, 0, 0, 0);
      writer.u32(0, rec.offset);
      writer.bytes(rec.nameBytes);
    }

    writer.u32(0x06054b50);
    writer.u16(0, 0, records.length, records.length);
    writer.u32(centralLen, centralStart);
    writer.u16(0);
    return new Blob([writer.buffer], { type: 'application/zip' });
  };

  const renderCropCanvas = (visualEl, width, height) => {
    if (encoder.width !== width || encoder.height !== height || !encoder.canvas) {
      encoder.canvas = new OffscreenCanvas(width, height);
      encoder.ctx = encoder.canvas.getContext('2d', { willReadFrequently: Boolean(window.createCjpegli) });
      encoder.ctx.imageSmoothingQuality = 'high';
      encoder.ctx.fillStyle = 'black';
      encoder.ctx.beginPath();
      encoder.ctx.ellipse(width / 2, height / 2, (width + 16) / 2, (height + 16) / 2, 0, 0, Math.PI * 2);
      encoder.ctx.clip();
      encoder.width = width;
      encoder.height = height;
    }
    encoder.ctx.fillRect(0, 0, width, height);
    const srcWidth = visualEl.videoWidth || visualEl.naturalWidth;
    const srcHeight = visualEl.videoHeight || visualEl.naturalHeight;
    const { scale, panX, panY } = state.stage;
    const cropWidth = width / scale;
    const cropHeight = height / scale;
    const cropX = (srcWidth - cropWidth) / 2 - panX / scale;
    const cropY = (srcHeight - cropHeight) / 2 - panY / scale;
    encoder.ctx.drawImage(visualEl, cropX, cropY, cropWidth, cropHeight, 0, 0, width, height);
    return encoder;
  };

  const buildPamBytes = (visualEl, width, height) => {
    const { ctx } = renderCropCanvas(visualEl, width, height);
    const rgba = ctx.getImageData(0, 0, width, height).data;
    const head = new TextEncoder().encode(
      `P7\nWIDTH ${width}\nHEIGHT ${height}\nDEPTH 3\nMAXVAL 255\nTUPLTYPE RGB\nENDHDR\n`
    );
    const pam = new Uint8Array(head.length + width * height * 3);
    pam.set(head);
    for (let i = 0, dst = head.length; i < rgba.length; i += 4) {
      pam[dst++] = rgba[i];
      pam[dst++] = rgba[i + 1];
      pam[dst++] = rgba[i + 2];
    }
    return pam;
  };

  const getCjpegliInstance = async () => {
    try {
      encoder.wasmTask ??= window.createCjpegli();
      return await encoder.wasmTask;
    } catch (err) {
      logDebug(`cjpegli Init Error: ${err.message}`);
      encoder.wasmTask = null;
      return null;
    }
  };

  const encodeJpegBlob = async (visualEl, width, height, maxKiB, quality) => {
    if (!window.createCjpegli) {
      return renderCropCanvas(visualEl, width, height).canvas.convertToBlob({ type: 'image/jpeg', quality });
    }
    const wasm = await getCjpegliInstance();
    if (!wasm) return null;
    wasm.FS.writeFile('in.pam', buildPamBytes(visualEl, width, height));
    try {
      wasm.callMain(['in.pam', 'out.jpg', '-p', '0', '--target_size', String(maxKiB * 1024), '--std_quant']);
      const data = wasm.FS.readFile('out.jpg');
      return data.byteLength > 0 ? new Blob([data], { type: 'image/jpeg' }) : null;
    } catch (err) {
      logDebug(`cjpegli Encode Error: ${err.message}`);
      encoder.wasmTask = null;
      return null;
    } finally {
      for (const file of ['in.pam', 'out.jpg']) {
        try { wasm.FS.unlink(file); } catch {}
      }
    }
  };

  const decodeAudioBuffer = (arrayBuffer) =>
    new OfflineAudioContext(1, 1, SPEC.SAMPLE_RATE).decodeAudioData(arrayBuffer);

  const hasTimeline = () => state.mode === 'video' || state.mode === 'audio';
  const getActiveMediaPlayer = () => state.mode === 'audio' ? ui.stageAudio : ui.stageVideo;
  const getActiveVisualMedia = () => state.mode === 'video' ? ui.stageVideo : ui.stageImage;
  const getTimelineDuration = () => parseFloat(ui.rangeEnd.max) || 0;

  const getTargetResolution = () => {
    const [width, height] = ui.selectResolution.value.split('x').map(Number);
    return { width, height };
  };

  const getTrimRange = () => ({
    start: readFloat(ui.rangeStart),
    end: readFloat(ui.rangeEnd)
  });

  const getClipMetrics = () => {
    const pcmLen = state.assets.audioTrack?.pcmBytes.length ?? 0;
    const hasAudio = pcmLen > 0;
    const duration = hasAudio
      ? pcmLen / SPEC.BYTE_RATE
      : Math.max(0.1, roundTenth(readFloat(ui.inputLoop, SPEC.DEF_LOOP_SEC)));
    const fps = duration > 0 ? state.assets.frames.length / duration : 0;
    return { pcmLen, hasAudio, duration, fps };
  };

  const pauseMediaPlayback = () => {
    ui.stageVideo.pause();
    ui.stageAudio.pause();
    ui.iconPlay.textContent = 'play_arrow';
  };

  const resetMediaElements = (...els) => {
    for (const el of els) {
      if (el.src?.startsWith('blob:') && el.src !== state.assets.audioTrack?.url) {
        URL.revokeObjectURL(el.src);
      }
      el.removeAttribute('src');
      if (el.tagName !== 'IMG') el.load();
    }
  };

  const clearStageMedia = () => {
    pauseMediaPlayback();
    state.stage.pointers.clear();
    ui.stageImage.classList.remove('ready');
    ui.stageVideo.classList.remove('ready');
    resetMediaElements(ui.stageImage, ui.stageVideo, ui.stageAudio);
    state.assets.rawAudio = null;
  };

  const releaseAudioTrack = () => {
    if (!state.assets.audioTrack) return;
    URL.revokeObjectURL(state.assets.audioTrack.url);
    state.assets.audioTrack = null;
  };

  const renderAudioTrack = async (srcBuffer, startSec, lenSec, totalSec = lenSec) => {
    const start = roundTenth(startSec);
    const len = roundTenth(lenSec);
    const total = roundTenth(totalSec);
    const sampleCount = Math.max(1, Math.round(total * SPEC.SAMPLE_RATE));
    const offlineCtx = new OfflineAudioContext(1, sampleCount, SPEC.SAMPLE_RATE);
    if (len > 0 && srcBuffer) {
      const safeStart = clamp(start, 0, Math.max(0, srcBuffer.duration - 0.001));
      const safeLen = clamp(len, 0, Math.max(0, srcBuffer.duration - safeStart));
      if (safeLen > 0) {
        const source = offlineCtx.createBufferSource();
        source.buffer = srcBuffer;
        source.connect(offlineCtx.destination);
        source.start(0, safeStart, safeLen);
      }
    }
    const rendered = await offlineCtx.startRendering();
    const floats = rendered.getChannelData(0);
    const pcm16 = new Int16Array(floats.length);
    for (let i = 0; i < floats.length; i++) {
      const s = clamp(floats[i], -1, 1);
      pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
    }
    const pcmBytes = new Uint8Array(pcm16.buffer);
    const wavHead = createBinaryWriter(44);
    wavHead.str('RIFF');
    wavHead.u32(36 + pcmBytes.length);
    wavHead.str('WAVE', 'fmt ');
    wavHead.u32(16);
    wavHead.u16(1, 1);
    wavHead.u32(SPEC.SAMPLE_RATE, SPEC.BYTE_RATE);
    wavHead.u16(2, 16);
    wavHead.str('data');
    wavHead.u32(pcmBytes.length);

    releaseAudioTrack();
    const blob = new Blob([wavHead.buffer, pcmBytes], { type: 'audio/wav' });
    blob.name = `audio_${getTimestamp()}.wav`;
    state.assets.audioTrack = {
      pcmBytes,
      blob,
      url: URL.createObjectURL(blob),
      buffer: rendered
    };
    return rendered;
  };

  const resetStageTransform = () => {
    Object.assign(state.stage, {
      scale: 1, baseScale: 1, panX: 0, panY: 0, basePanX: 0, basePanY: 0, startX: 0, startY: 0, pinchDist: 0
    });
    state.stage.pointers.clear();
  };

  const switchPanel = (toEditor) => {
    pauseMediaPlayback();
    ui.tabBadge.classList.toggle('active', !toEditor);
    ui.tabEditor.classList.toggle('active', toEditor);
    ui.panelBadge.hidden = toEditor;
    ui.panelEditor.hidden = !toEditor;
  };

  const updateEditorModeUi = () => {
    const isAudio = state.mode === 'audio';
    ui.cropGuide.hidden = isAudio;
    ui.stageAudioIcon.hidden = !isAudio;
    ui.stageImage.hidden = state.mode !== 'image';
    ui.stageVideo.hidden = state.mode !== 'video';
    ui.trimPanel.hidden = !hasTimeline();
    ui.groupTotal.hidden = !isAudio;
    ui.groupFps.hidden = isAudio;
  };

  const seekVideoTo = (sec) => {
    if (!ui.stageVideo.seeking && ui.stageVideo.readyState >= 2 && Math.abs(ui.stageVideo.currentTime - sec) < 0.001) {
      return Promise.resolve();
    }
    const { promise, resolve } = Promise.withResolvers();
    const onSeeked = () => {
      clearTimeout(fallbackTimer);
      requestAnimationFrame(resolve);
    };
    const fallbackTimer = setTimeout(() => {
      ui.stageVideo.removeEventListener('seeked', onSeeked);
      resolve();
    }, 500);
    ui.stageVideo.addEventListener('seeked', onSeeked, { once: true });
    ui.stageVideo.currentTime = sec;
    return promise;
  };

  const updatePlayheadPosition = () => {
    const duration = getTimelineDuration();
    const pct = duration > 0 ? clamp((getActiveMediaPlayer().currentTime / duration) * 100, 0, 100) : 0;
    ui.timelinePlayhead.style.insetInlineStart = `${pct}%`;
  };

  const seekActivePlayer = (sec) => {
    getActiveMediaPlayer().currentTime = roundTenth(sec);
    updatePlayheadPosition();
  };

  const syncTrimFields = (syncTotal = true, syncLen = true) => {
    if (!hasTimeline()) return;
    const duration = getTimelineDuration();
    let start = roundTenth(readFloat(ui.rangeStart));
    let end = roundTenth(readFloat(ui.rangeEnd));
    if (start > end) {
      ui.rangeStart.classList.contains('top')
        ? (ui.rangeEnd.value = end = start)
        : (ui.rangeStart.value = start = end);
    }
    if (start === end) {
      if (end <= 0) {
        ui.rangeStart.classList.remove('top');
        ui.rangeEnd.classList.add('top');
      } else if (duration > 0 && start >= duration) {
        ui.rangeStart.classList.add('top');
        ui.rangeEnd.classList.remove('top');
      }
    }
    const len = roundTenth(end - start);
    ui.timelineFill.style.insetInlineStart = `${duration > 0 ? (start / duration) * 100 : 0}%`;
    ui.timelineFill.style.inlineSize = `${duration > 0 ? (len / duration) * 100 : 0}%`;

    const lenStr = len.toFixed(1);
    if (document.activeElement !== ui.inputStart) ui.inputStart.value = start.toFixed(1);
    if (syncLen && document.activeElement !== ui.inputLength) ui.inputLength.value = lenStr;
    if (syncTotal && document.activeElement !== ui.inputTotal) ui.inputTotal.value = lenStr;
  };

  const initializeTimeline = (duration) => {
    const maxDur = duration > 0 && Number.isFinite(duration) ? Math.max(0.1, roundTenth(duration)) : 0;
    ui.rangeStart.max = ui.rangeEnd.max = maxDur;
    ui.rangeStart.value = 0;
    ui.rangeEnd.value = maxDur;
    ui.timelinePlayhead.style.insetInlineStart = '0%';
    syncTrimFields();
  };

  const applyStageTransform = () => {
    if (state.mode === 'audio') return;
    const { panX, panY, scale } = state.stage;
    getActiveVisualMedia().style.transform = `translate(-50%, -50%) translate3d(${panX}px, ${panY}px, 0) scale(${scale})`;
  };

  const zoomStageBy = (factor) => {
    if (!Number.isFinite(factor) || factor <= 0) return;
    const nextScale = clamp(state.stage.scale * factor, 0.05, 100);
    const ratio = nextScale / state.stage.scale;
    state.stage.scale = nextScale;
    state.stage.panX *= ratio;
    state.stage.panY *= ratio;
    applyStageTransform();
  };

  const updateCropGuide = () => {
    const { width, height } = getTargetResolution();
    const { guideWidth } = state.stage;
    ui.cropGuide.style.inlineSize = `${width}px`;
    ui.cropGuide.style.blockSize = `${height}px`;
    if (guideWidth > 0 && guideWidth !== width && state.mode !== 'audio' && getActiveVisualMedia().classList.contains('ready')) {
      zoomStageBy(width / guideWidth);
    }
    state.stage.guideWidth = width;
    state.stage.guideHeight = height;
  };

  const fitMediaToStage = (el, srcWidth, srcHeight) => {
    const { width, height } = getTargetResolution();
    state.stage.scale = Math.min(1, Math.max(width / (srcWidth || width), height / (srcHeight || height)));
    applyStageTransform();
    el.classList.add('ready');
  };

  const updatePreviewDetails = () => {
    if (state.previewIdx < 0) return;
    const frame = state.assets.frames[state.previewIdx];
    const count = state.assets.frames.length;
    const { pcmLen, hasAudio, duration, fps } = getClipMetrics();
    const isMulti = count > 1 || hasAudio;

    let details = `${frame.name}\nImage ${frame.width}x${frame.height} ${(frame.blob.size / 1024).toFixed(1)} KiB`;
    if (isMulti) {
      const aviKiB = (calculateAviSize(state.assets.frames, pcmLen) / 1024).toFixed(1);
      const audioLabel = hasAudio ? `Audio ${duration.toFixed(1)}s` : `Loop ${duration.toFixed(1)}s`;
      details += `\n${audioLabel} | AVI ${aviKiB} KiB ${fps.toFixed(1)}fps`;
    }
    ui.btnDownloadZip.hidden = !isMulti;
    ui.btnUploadVideo.hidden = !isMulti;
    ui.groupLoop.hidden = hasAudio || !isMulti;
    ui.textDetails.textContent = details;
  };

  const openPreviewModal = (idx) => {
    const count = state.assets.frames.length;
    if (idx < 0 || idx >= count) return;
    state.previewIdx = idx;

    ui.previewImage.src = state.assets.frames[idx].url;
    ui.textCounter.textContent = `${idx + 1} / ${count}`;
    updatePreviewDetails();

    ui.btnPrevFrame.style.visibility = idx > 0 ? 'visible' : 'hidden';
    ui.btnNextFrame.style.visibility = idx < count - 1 ? 'visible' : 'hidden';
    if (!ui.modalPreview.open) ui.modalPreview.showModal();
    ui.modalPreview.focus();
  };

  const renderThumbList = () => {
    ui.thumbList.replaceChildren(
      ...state.assets.frames.map((frame, idx) =>
        Object.assign(document.createElement('img'), {
          className: 'thumb-item',
          src: frame.url,
          title: 'Preview Frame',
          onclick: () => openPreviewModal(idx)
        })
      )
    );
    ui.btnEditAudio.classList.toggle('active', Boolean(state.assets.audioTrack));
    ui.thumbList.scrollLeft = ui.thumbList.scrollWidth;
  };

  const appendFrame = (blob, width, height, deferRender = false) => {
    state.assets.frames.push({
      url: URL.createObjectURL(blob),
      blob,
      name: `badge_${getTimestamp()}.jpg`,
      width,
      height
    });
    if (!deferRender) renderThumbList();
  };

  const loadMediaFile = (file) => runTaskWithBusy(async () => {
    clearStageMedia();
    ui.btnExtract.disabled = true;
    state.mode = file.type.startsWith('audio/') ? 'audio' : file.type.startsWith('video/') ? 'video' : 'image';
    resetStageTransform();
    updateEditorModeUi();

    const url = URL.createObjectURL(file);
    try {
      if (state.mode === 'audio') {
        ui.stageAudio.src = url;
        const decoded = await decodeAudioBuffer(await file.arrayBuffer());
        state.assets.rawAudio = decoded;
        initializeTimeline(decoded.duration);
      } else if (state.mode === 'video') {
        const audioTask = file.arrayBuffer()
          .then(decodeAudioBuffer)
          .catch((err) => {
            logDebug(`Video Audio Note: ${err.message}`);
            return null;
          });

        ui.stageVideo.src = url;
        const videoTask = waitMediaEvent(ui.stageVideo, 'loadedmetadata').then(async () => {
          if (!ui.stageVideo.videoWidth || !ui.stageVideo.videoHeight) {
            throw new Error('Video track unavailable');
          }
          initializeTimeline(ui.stageVideo.duration);
          await seekVideoTo(0);
          fitMediaToStage(ui.stageVideo, ui.stageVideo.videoWidth, ui.stageVideo.videoHeight);
        });
        const [decodedAudio] = await Promise.all([audioTask, videoTask]);
        state.assets.rawAudio = decodedAudio;
      } else {
        ui.stageImage.src = url;
        await waitMediaEvent(ui.stageImage, 'load');
        if (!ui.stageImage.naturalWidth || !ui.stageImage.naturalHeight) {
          throw new Error('Image unavailable');
        }
        fitMediaToStage(ui.stageImage, ui.stageImage.naturalWidth, ui.stageImage.naturalHeight);
      }
      ui.btnExtract.disabled = false;
    } catch (err) {
      clearStageMedia();
      if (hasTimeline()) initializeTimeline(0);
      URL.revokeObjectURL(url);
      logDebug(`Media Load Error: ${err.message}`);
    }
  });

  const extractVideoSequence = async (width, height, maxKiB, quality, startSec, lenSec) => {
    if (lenSec <= 0) return;
    const fps = readInt(ui.inputFps, SPEC.MIN_FPS, SPEC.MAX_FPS, SPEC.DEF_FPS);
    const totalFrames = Math.max(1, Math.round(lenSec * fps));

    await runTaskWithBusy(async () => {
      const wasPlaying = !ui.stageVideo.paused;
      const savedTime = ui.stageVideo.currentTime;
      ui.stageVideo.pause();
      const stepSec = 1 / fps;
      let added = 0;

      for (let i = 0; i < totalFrames; i++) {
        await seekVideoTo(Math.min(ui.stageVideo.duration, startSec + i * stepSec));
        const blob = await encodeJpegBlob(ui.stageVideo, width, height, maxKiB, quality);
        if (blob) {
          appendFrame(blob, width, height, true);
          added++;
        }
        updateProgress(i + 1, totalFrames);
      }
      await seekVideoTo(savedTime);
      updatePlayheadPosition();
      if (added > 0 && state.assets.rawAudio) {
        await renderAudioTrack(state.assets.rawAudio, startSec, lenSec);
      }
      if (wasPlaying) ui.stageVideo.play().catch(() => {});
      renderThumbList();
    }, true);
  };

  const extractAudioTrack = async (startSec, lenSec) => {
    const totalSec = roundTenth(readFloat(ui.inputTotal, lenSec));
    pauseMediaPlayback();
    resetMediaElements(ui.stageAudio);
    if (totalSec <= 0) {
      releaseAudioTrack();
      state.assets.rawAudio = null;
      initializeTimeline(0);
      renderThumbList();
      return;
    }
    const srcBuffer = state.assets.rawAudio ?? new AudioBuffer({ length: 1, sampleRate: SPEC.SAMPLE_RATE });
    const rendered = await renderAudioTrack(srcBuffer, startSec, lenSec, totalSec);
    state.assets.rawAudio = rendered;
    ui.stageAudio.src = state.assets.audioTrack.url;
    initializeTimeline(rendered.duration);
    renderThumbList();
  };

  const isWavFile = (file) =>
    file.type.startsWith('audio/wav') || file.type === 'audio/x-wav' || file.name.toLowerCase().endsWith('.wav');

  const importAssetFile = async (file, fallbackWidth, fallbackHeight) => {
    const lower = file.name.toLowerCase();
    if (file.type === 'image/jpeg' || lower.endsWith('.jpg') || lower.endsWith('.jpeg')) {
      try {
        const bmp = await createImageBitmap(file);
        appendFrame(file, bmp.width || fallbackWidth, bmp.height || fallbackHeight, true);
        bmp.close();
      } catch (err) {
        logDebug(`JPEG Import Error: ${err.message}`);
      }
      return;
    }
    if (isWavFile(file)) {
      try {
        const decoded = await decodeAudioBuffer(await file.arrayBuffer());
        const editingTrack = state.mode === 'audio' && (!ui.stageAudio.src || ui.stageAudio.src === state.assets.audioTrack?.url);
        if (editingTrack) {
          pauseMediaPlayback();
          resetMediaElements(ui.stageAudio);
        }
        const rendered = await renderAudioTrack(decoded, 0, Math.max(0.1, decoded.duration));
        if (editingTrack) {
          state.assets.rawAudio = rendered;
          ui.stageAudio.src = state.assets.audioTrack.url;
          initializeTimeline(rendered.duration);
        }
      } catch (err) {
        logDebug(`WAV Import Error: ${err.message}`);
      }
    }
  };

  const updateGestureOrigin = () => {
    const { stage } = state;
    const pts = [...stage.pointers.values()];
    if (pts.length === 1) {
      Object.assign(stage, {
        startX: pts[0].x,
        startY: pts[0].y,
        basePanX: stage.panX,
        basePanY: stage.panY
      });
    } else if (pts.length === 2) {
      stage.pinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      stage.baseScale = stage.scale;
    }
  };

  const handleStagePointerDown = (event) => {
    if (ui.btnExtract.disabled || state.mode === 'audio' || (event.pointerType === 'mouse' && event.button !== 0)) return;
    event.preventDefault();
    document.activeElement?.blur();
    ui.cropStage.setPointerCapture(event.pointerId);
    state.stage.pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
    updateGestureOrigin();
  };

  const handleStagePointerMove = (event) => {
    const { stage } = state;
    if (!stage.pointers.has(event.pointerId) || ui.btnExtract.disabled || state.mode === 'audio') return;
    stage.pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
    const pts = [...stage.pointers.values()];

    if (pts.length === 1) {
      stage.panX = stage.basePanX + (event.clientX - stage.startX);
      stage.panY = stage.basePanY + (event.clientY - stage.startY);
      applyStageTransform();
    } else if (pts.length === 2 && stage.pinchDist > 0) {
      const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      zoomStageBy((stage.baseScale * (dist / stage.pinchDist)) / stage.scale);
    }
  };

  const handleStagePointerUp = (event) => {
    if (state.stage.pointers.delete(event.pointerId)) updateGestureOrigin();
  };

  const handleGlobalKeyDown = (event) => {
    if (event.key === 'Enter' && event.target.tagName === 'INPUT') {
      event.target.blur();
      if (ui.modalPreview.open) ui.modalPreview.focus();
      return;
    }
    if (state.busy || event.ctrlKey || event.altKey || event.metaKey) return;
    if (['INPUT', 'SELECT'].includes(document.activeElement?.tagName)) return;

    if (ui.modalPreview.open) {
      const previewKeyMap = {
        Delete: ui.btnDeleteFrame,
        Backspace: ui.btnDeleteFrame,
        ArrowLeft: ui.btnPrevFrame,
        ArrowRight: ui.btnNextFrame,
        ArrowDown: event.shiftKey ? ui.btnDownloadZip : ui.btnDownloadJpg,
        ArrowUp: event.shiftKey ? ui.btnUploadVideo : ui.btnUploadImage
      };
      if (previewKeyMap[event.key]) {
        triggerButton(previewKeyMap[event.key]);
        event.preventDefault();
      }
      return;
    }

    if (ui.panelEditor.hidden || ui.btnExtract.disabled || state.mode === 'audio') return;
    const stageKeyMap = {
      ArrowUp: () => { state.stage.panY -= 20; applyStageTransform(); },
      ArrowDown: () => { state.stage.panY += 20; applyStageTransform(); },
      ArrowLeft: () => { state.stage.panX -= 20; applyStageTransform(); },
      ArrowRight: () => { state.stage.panX += 20; applyStageTransform(); },
      PageUp: () => zoomStageBy(1.1),
      PageDown: () => zoomStageBy(1 / 1.1)
    };
    if (stageKeyMap[event.key]) {
      stageKeyMap[event.key]();
      event.preventDefault();
    }
  };

  const validateFramesForUpload = (frames) => {
    if (!ble.txChar) {
      if (ui.modalPreview.open) ui.modalPreview.close();
      switchPanel(false);
      return false;
    }
    const { width, height, maxChunk } = state.badge;
    if (!width || !height || maxChunk <= 4) {
      alert('Error: Badge specifications unknown. Please reconnect.');
      return false;
    }
    if (frames.some((f) => f.width !== width || f.height !== height)) {
      alert(`Error: Image resolution must be ${width}x${height}px.`);
      return false;
    }
    if (frames.some((f) => f.blob.size <= 0 || f.blob.size > SPEC.MAX_JPG_BYTES)) {
      alert(`Error: Image size must be between 1 and ${SPEC.MAX_JPG_BYTES} bytes.`);
      return false;
    }
    return true;
  };

  const uploadBlobToBadge = async (blob) => {
    try {
      await streamBlobToBadge(blob, updateProgress);
      await queryStorageSpace();
    } catch (err) {
      logDebug(`Upload Error: ${err.message}`);
    }
  };

  const bindBadgeEvents = () => {
    ui.tabBadge.addEventListener('click', () => switchPanel(false));
    ui.tabEditor.addEventListener('click', () => switchPanel(true));

    ui.btnConnect.addEventListener('click', async () => {
      if (ble.connecting) return;
      if (ble.device?.gatt.connected) {
        ble.device.gatt.disconnect();
        return;
      }
      ble.connecting = true;
      try {
        await connectBadge();
      } catch (err) {
        logDebug(`Connect Error: ${err.message}`);
      } finally {
        ble.connecting = false;
      }
    });

    ui.btnDebug.addEventListener('click', () => {
      state.debug = !state.debug;
      ui.btnDebug.classList.toggle('active', state.debug);
    });

    const bindCommand = (btn, task) => btn.addEventListener('click', async () => {
      try { await task(); } catch (err) { logDebug(`Command Error: ${err.message}`); }
    });
    bindCommand(ui.btnSetLang, () => sendBadgeCommand(PROTO.CLS_SYS, 0x15, [parseInt(ui.selectLang.value, 10)]));
    bindCommand(ui.btnCallBadge, () => sendBadgeCommand(PROTO.CLS_SYS, 0x0B, [0x01]));
    bindCommand(ui.btnCheckStorage, queryStorageSpace);
  };

  const bindEditorEvents = () => {
    const syncPlayIcon = (event) => {
      if (event.target !== getActiveMediaPlayer()) return;
      ui.iconPlay.textContent = event.type === 'play' ? 'pause' : 'play_arrow';
    };
    const handleTimeUpdate = (event) => {
      const player = getActiveMediaPlayer();
      if (event.target !== player || !hasTimeline() || !getTimelineDuration()) return;
      const { start, end } = getTrimRange();
      if (end <= start) {
        player.pause();
        return;
      }
      if (player.currentTime >= end && !player.paused) player.currentTime = start;
      updatePlayheadPosition();
    };
    const handleMediaEnded = (event) => {
      const player = getActiveMediaPlayer();
      if (event.target !== player || !hasTimeline()) return;
      const { start, end } = getTrimRange();
      if (end <= start) return;
      player.currentTime = start;
      player.play().catch(() => {});
    };

    for (const player of [ui.stageVideo, ui.stageAudio]) {
      player.addEventListener('play', syncPlayIcon);
      player.addEventListener('pause', syncPlayIcon);
      player.addEventListener('timeupdate', handleTimeUpdate);
      player.addEventListener('ended', handleMediaEnded);
    }

    const bindClampedInt = (el, min, max, fallback) => {
      el.addEventListener('change', () => { el.value = readInt(el, min, max, fallback); });
    };
    bindClampedInt(ui.inputMaxSize, 1, 39, 20);
    bindClampedInt(ui.inputQuality, 1, 100, 90);
    bindClampedInt(ui.inputFps, SPEC.MIN_FPS, SPEC.MAX_FPS, SPEC.DEF_FPS);

    ui.inputLoop.addEventListener('input', updatePreviewDetails);
    ui.inputLoop.addEventListener('change', () => {
      ui.inputLoop.value = Math.max(0.1, roundTenth(readFloat(ui.inputLoop, SPEC.DEF_LOOP_SEC))).toFixed(1);
      updatePreviewDetails();
    });

    ui.btnOpenMedia.addEventListener('click', () => {
      if (!state.busy) ui.inputMedia.click();
    });
    ui.inputMedia.addEventListener('change', (event) => {
      const [file] = event.target.files;
      event.target.value = '';
      if (!state.busy && file && !file.type.includes('svg')) loadMediaFile(file);
    });

    ui.btnExtract.addEventListener('click', async () => {
      if (ui.btnExtract.disabled || state.busy) return;
      const maxKiB = readInt(ui.inputMaxSize, 1, 39, 20);
      const { width, height } = getTargetResolution();
      const quality = readInt(ui.inputQuality, 1, 100, 90) / 100;
      const { start: startSec, end } = getTrimRange();
      const lenSec = roundTenth(end - startSec);

      if (state.mode === 'video') {
        await extractVideoSequence(width, height, maxKiB, quality, startSec, lenSec);
        return;
      }
      await runTaskWithBusy(async () => {
        if (state.mode === 'audio') {
          await extractAudioTrack(startSec, lenSec);
          return;
        }
        const blob = await encodeJpegBlob(ui.stageImage, width, height, maxKiB, quality);
        if (blob) appendFrame(blob, width, height);
      });
    });

    ui.btnImport.addEventListener('click', () => {
      if (!state.busy) ui.inputImport.click();
    });
    ui.inputImport.addEventListener('change', async (event) => {
      const rawFiles = [...event.target.files];
      event.target.value = '';
      if (state.busy || !rawFiles.length) return;
      const lastWav = rawFiles.findLast(isWavFile);
      const files = rawFiles.filter((f) => !isWavFile(f) || f === lastWav);
      const { width, height } = getTargetResolution();

      await runTaskWithBusy(async () => {
        for (let i = 0; i < files.length; i++) {
          await importAssetFile(files[i], width, height);
          if (files.length > 1) updateProgress(i + 1, files.length);
        }
        renderThumbList();
      }, files.length > 1);
    });

    ui.btnEditAudio.addEventListener('click', () => {
      if (state.busy) return;
      clearStageMedia();
      state.mode = 'audio';
      switchPanel(true);
      updateEditorModeUi();

      const track = state.assets.audioTrack;
      state.assets.rawAudio = track?.buffer ?? null;
      if (track) ui.stageAudio.src = track.url;
      initializeTimeline(track ? track.buffer.duration : 0);
      ui.btnExtract.disabled = false;
    });

    ui.selectResolution.addEventListener('change', updateCropGuide);

    ui.cropStage.addEventListener('pointerdown', handleStagePointerDown);
    ui.cropStage.addEventListener('pointermove', handleStagePointerMove);
    for (const type of ['pointerup', 'pointercancel', 'lostpointercapture']) {
      ui.cropStage.addEventListener(type, handleStagePointerUp);
    }
    ui.cropStage.addEventListener('wheel', (event) => {
      if (ui.btnExtract.disabled || state.mode === 'audio') return;
      event.preventDefault();
      zoomStageBy(Math.exp(-event.deltaY * 0.005));
    }, { passive: false });

    ui.thumbList.addEventListener('wheel', (event) => {
      event.preventDefault();
      ui.thumbList.scrollLeft += event.deltaY + event.deltaX;
    }, { passive: false });

    const handleThumbSlide = (isStart) => {
      pauseMediaPlayback();
      ui.rangeStart.classList.toggle('top', isStart);
      ui.rangeEnd.classList.toggle('top', !isStart);
      syncTrimFields();
      seekActivePlayer(readFloat(isStart ? ui.rangeStart : ui.rangeEnd));
    };
    ui.rangeStart.addEventListener('input', () => handleThumbSlide(true));
    ui.rangeEnd.addEventListener('input', () => handleThumbSlide(false));

    const bindTimeField = (el, applyFn) => {
      const handle = (commit) => {
        const val = parseFloat(el.value);
        if (!commit && Number.isNaN(val)) return;
        pauseMediaPlayback();
        applyFn(val || 0, commit);
      };
      el.addEventListener('input', () => handle(false));
      el.addEventListener('change', () => handle(true));
    };

    bindTimeField(ui.inputStart, (val, commit) => {
      const maxDur = getTimelineDuration();
      const len = readFloat(ui.inputLength);
      const clamped = clamp(roundTenth(val), 0, maxDur);
      if (commit) ui.inputStart.value = clamped.toFixed(1);
      ui.rangeStart.value = clamped;
      ui.rangeEnd.value = clamp(roundTenth(clamped + len), clamped, maxDur);
      syncTrimFields(commit, commit);
      seekActivePlayer(clamped);
    });

    bindTimeField(ui.inputLength, (val, commit) => {
      const start = readFloat(ui.rangeStart);
      const maxLen = Math.max(0, roundTenth(getTimelineDuration() - start));
      const clamped = clamp(roundTenth(val), 0, maxLen);
      if (commit) ui.inputLength.value = clamped.toFixed(1);
      ui.rangeEnd.value = roundTenth(start + clamped);
      syncTrimFields(commit);
    });

    ui.inputTotal.addEventListener('change', () => {
      ui.inputTotal.value = Math.max(0, roundTenth(readFloat(ui.inputTotal))).toFixed(1);
    });

    ui.btnPlay.addEventListener('click', () => {
      if (state.mode === 'audio' && !ui.stageAudio.src) return;
      const player = getActiveMediaPlayer();
      if (!player.paused) {
        player.pause();
        return;
      }
      const { start, end } = getTrimRange();
      if (end <= start) return;
      if (player.currentTime < start || player.currentTime >= end) player.currentTime = start;
      player.play().catch(() => {});
    });
  };

  const bindPreviewEvents = () => {
    ui.modalPreview.addEventListener('close', () => {
      state.previewIdx = -1;
      state.swipe.id = null;
    });
    ui.modalPreview.addEventListener('pointerdown', (event) => {
      if (event.pointerType === 'mouse' || state.swipe.id !== null || event.target.closest('button, input')) return;
      Object.assign(state.swipe, { id: event.pointerId, startX: event.clientX, startY: event.clientY });
    });
    ui.modalPreview.addEventListener('pointerup', (event) => {
      if (event.pointerId !== state.swipe.id) return;
      state.swipe.id = null;
      if (state.busy || state.previewIdx < 0) return;
      const dx = event.clientX - state.swipe.startX;
      if (Math.abs(dx) > 50 && Math.abs(event.clientY - state.swipe.startY) < 50) {
        triggerButton(dx < 0 ? ui.btnNextFrame : ui.btnPrevFrame);
      }
    });
    ui.modalPreview.addEventListener('pointercancel', (event) => {
      if (event.pointerId === state.swipe.id) state.swipe.id = null;
    });

    ui.btnClosePreview.addEventListener('click', () => {
      if (!state.busy && ui.modalPreview.open) ui.modalPreview.close();
    });
    ui.btnPrevFrame.addEventListener('click', () => {
      if (!state.busy && state.previewIdx > 0) openPreviewModal(state.previewIdx - 1);
    });
    ui.btnNextFrame.addEventListener('click', () => {
      if (!state.busy && state.previewIdx < state.assets.frames.length - 1) openPreviewModal(state.previewIdx + 1);
    });

    ui.btnDeleteFrame.addEventListener('click', () => {
      if (state.busy) return;
      const [removed] = state.assets.frames.splice(state.previewIdx, 1);
      if (removed) URL.revokeObjectURL(removed.url);
      renderThumbList();
      if (!state.assets.frames.length) {
        ui.previewImage.removeAttribute('src');
        if (ui.modalPreview.open) ui.modalPreview.close();
        return;
      }
      openPreviewModal(Math.min(state.previewIdx, state.assets.frames.length - 1));
    });

    ui.btnDownloadJpg.addEventListener('click', () => {
      if (state.busy) return;
      const frame = state.assets.frames[state.previewIdx];
      if (frame) downloadBlob(frame.blob, getIndexedName(frame, state.previewIdx));
    });

    ui.btnDownloadZip.addEventListener('click', () => {
      if (state.busy) return;
      runTaskWithBusy(async () => {
        const totalItems = state.assets.frames.length + (state.assets.audioTrack ? 1 : 0);
        const entries = [];
        for (let i = 0; i < state.assets.frames.length; i++) {
          const frame = state.assets.frames[i];
          entries.push({
            name: getIndexedName(frame, i),
            data: new Uint8Array(await frame.blob.arrayBuffer())
          });
          updateProgress(i + 1, totalItems);
        }
        if (state.assets.audioTrack) {
          entries.push({
            name: state.assets.audioTrack.blob.name,
            data: new Uint8Array(await state.assets.audioTrack.blob.arrayBuffer())
          });
          updateProgress(totalItems, totalItems);
        }
        downloadBlob(buildZipBlob(entries), `badge_bundle_${Date.now()}.zip`);
      }, true);
    });

    ui.btnUploadImage.addEventListener('click', async () => {
      if (state.busy) return;
      const frame = state.assets.frames[state.previewIdx];
      if (frame && validateFramesForUpload([frame])) {
        await runTaskWithBusy(() => uploadBlobToBadge(frame.blob), true);
      }
    });

    ui.btnUploadVideo.addEventListener('click', async () => {
      if (state.busy || !validateFramesForUpload(state.assets.frames)) return;
      const { fps } = getClipMetrics();
      if (fps <= 0 || fps > SPEC.MAX_FPS) {
        alert(`Failed to build AVI: Frame rate (${fps.toFixed(1)}fps) exceeds the ${SPEC.MAX_FPS}fps limit.`);
        return;
      }
      const { width, height } = state.badge;
      await runTaskWithBusy(async () => {
        let aviBlob;
        try {
          aviBlob = await buildAviBlob(
            state.assets.frames,
            width,
            height,
            fps,
            state.assets.audioTrack?.pcmBytes
          );
        } catch (err) {
          alert(`Failed to build AVI: ${err.message}`);
          return;
        }
        await uploadBlobToBadge(aviBlob);
      }, true);
    });
  };

  document.addEventListener('keydown', handleGlobalKeyDown);
  bindBadgeEvents();
  bindEditorEvents();
  bindPreviewEvents();
  ui.modalProgress.addEventListener('cancel', (event) => event.preventDefault());

  const hasCjpegli = Boolean(window.createCjpegli);
  ui.groupMaxSize.hidden = !hasCjpegli;
  ui.groupQuality.hidden = hasCjpegli;
  if (hasCjpegli) getCjpegliInstance();
  updateCropGuide();
</script>
</body>
</html>
